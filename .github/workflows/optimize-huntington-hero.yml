name: Optimize Huntington Beach Hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-huntington-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create sharp mobile derivative
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          src = Path('assets/laundry/original-user-heroes/20240903_134418.jpg')
          out = Path('assets/laundry/optimized/huntington-beach-20240903_134418-1600.jpg')
          out.parent.mkdir(parents=True, exist_ok=True)

          if out.exists():
              print('Derivative already exists; nothing to do.')
              raise SystemExit(0)

          with Image.open(src) as im:
              im = ImageOps.exif_transpose(im).convert('RGB')
              im.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
              im.save(out, 'JPEG', quality=88, optimize=True, progressive=True, subsampling=0)
              print('Created', out, out.stat().st_size, 'bytes', im.size)
          PY
      - name: Commit derivative
        run: |
          if git diff --quiet -- assets/laundry/optimized/huntington-beach-20240903_134418-1600.jpg && [ ! -f assets/laundry/optimized/huntington-beach-20240903_134418-1600.jpg ]; then
            echo "No derivative created."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/laundry/optimized/huntington-beach-20240903_134418-1600.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add optimized Huntington Beach hero derivative"
          git push
