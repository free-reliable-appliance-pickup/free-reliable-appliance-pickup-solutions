name: Normalize Customer Request Actions

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.html'
      - '.github/workflows/normalize-customer-request-actions.yml'

permissions:
  contents: write

jobs:
  normalize-request-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure every approved page has a local request path
        shell: python
        run: |
          from pathlib import Path
          import re

          approved = [x.strip() for x in Path('data/approved-indexable-locations.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          changed = []

          request_block = """<section id="request" class="site-request-panel">
          <h2>Request Appliance Pickup</h2>
          <p>Send the appliance type, working condition, exact pickup city, access details and photos when available. Free pickup is qualification-based and must be confirmed.</p>
          <form action="https://formspree.io/f/mvzeapzd" method="POST">
          <input type="hidden" name="source_page" value="{slug}">
          <div class="site-request-grid">
          <div class="site-request-field"><label>Name<input type="text" name="name" required autocomplete="name"></label></div>
          <div class="site-request-field"><label>Phone<input type="tel" name="phone" required autocomplete="tel"></label></div>
          <div class="site-request-field"><label>City<input type="text" name="city" required autocomplete="address-level2"></label></div>
          <div class="site-request-field"><label>State<input type="text" name="state" value="California" required autocomplete="address-level1"></label></div>
          <div class="site-request-field"><label>Appliance<select name="appliance" required><option value="">Select appliance</option><option>Refrigerator</option><option>Washer</option><option>Dryer</option><option>Washer &amp; Dryer Set</option><option>Stove / Range</option><option>Oven</option><option>Freezer</option><option>RV Appliance / Equipment</option><option>Multiple Appliances</option><option>Other Major Appliance</option></select></label></div>
          <div class="site-request-field"><label>Condition<select name="condition" required><option value="">Select condition</option><option>Fully working</option><option>Needs minor repair</option><option>Not working</option><option>Unknown</option><option>Mixed load - majority working</option></select></label></div>
          <div class="site-request-field full"><label>Access / Appliance Details<textarea name="message" rows="5" required placeholder="Floor, stairs, gates, parking, appliance condition, and photo availability."></textarea></label></div>
          <div class="site-request-field full"><button class="site-request-submit" type="submit">Submit Pickup Request</button></div>
          </div>
          </form>
          </section>"""

          for slug in approved:
              path = Path(slug) / 'index.html'
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              original = text
              low = text.lower()

              # Approved pages always load the customer-routing helper exactly once.
              if 'assets/customer-routing.js' not in low and '</head>' in low:
                  idx = low.index('</head>')
                  text = text[:idx] + '<script src="/assets/customer-routing.js" defer></script>\n' + text[idx:]
                  low = text.lower()

              has_form = 'https://formspree.io/f/mvzeapzd' in low
              has_request = 'id="request"' in low or "id='request'" in low

              # If an approved page has no local form, add one without touching its hero/image content.
              if not has_form:
                  block = request_block.format(slug=slug)
                  insert_at = text.lower().rfind('</main>')
                  if insert_at < 0:
                      insert_at = text.lower().rfind('<footer')
                  if insert_at < 0:
                      insert_at = text.lower().rfind('</body>')
                  if insert_at < 0:
                      insert_at = len(text)
                  text = text[:insert_at] + '\n' + block + '\n' + text[insert_at:]
                  low = text.lower()
                  has_request = True

              # Existing Formspree pages without a request target get the target on the form section.
              if not has_request:
                  m = re.search(r'<form\b[^>]*action=["\']https://formspree\.io/f/mvzeapzd["\'][^>]*>', text, re.I|re.S)
                  if m:
                      sec = text.lower().rfind('<section', 0, m.start())
                      if sec >= 0:
                          end = text.find('>', sec)
                          opening = text[sec:end+1]
                          if not re.search(r'\bid\s*=', opening, re.I):
                              opening = opening[:-1] + ' id="request">'
                              text = text[:sec] + opening + text[end+1:]
                          else:
                              text = text[:m.start()] + '<span id="request" aria-hidden="true"></span>\n' + text[m.start():]

              low = text.lower()
              if 'href="#request"' not in low and "href='#request'" not in low:
                  cta = '<p class="site-inline-request"><a class="btn" href="#request">Request Pickup</a></p>\n'
                  pos = text.lower().find('<main')
                  if pos >= 0:
                      pos = text.find('>', pos) + 1
                      text = text[:pos] + '\n' + cta + text[pos:]
                  else:
                      pos = text.lower().find('</header>')
                      if pos >= 0:
                          pos += len('</header>')
                          text = text[:pos] + '\n' + cta + text[pos:]

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Approved pages repaired: {len(changed)}')
          for item in changed:
              print(' -', item)

      - name: Keep customer request actions on the local form
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []
          detected = []

          def is_customer_form_page(text):
              lower = text.lower()
              return (
                  'formspree.io' in lower
                  and ('name="city"' in lower or "name='city'" in lower or 'name="pickup_city"' in lower or "name='pickup_city'" in lower)
                  and ('name="state"' in lower or "name='state'" in lower or 'name="pickup_state"' in lower or "name='pickup_state'" in lower)
                  and ('name="appliance"' in lower or "name='appliance'" in lower or 'name="appliance type"' in lower or "name='appliance type'" in lower)
              )

          anchor_re = re.compile(r'<a\b(?P<attrs>[^>]*)>(?P<label>.*?)</a>', re.I | re.S)
          href_re = re.compile(r'\bhref\s*=\s*(["\'])([^"\']*)\1', re.I)
          request_id_re = re.compile(r'\bid\s*=\s*(["\'])request\1', re.I)
          form_re = re.compile(r'<form\b[^>]*\baction\s*=\s*(["\'])https://formspree\.io/[^"\']+\1[^>]*>', re.I | re.S)
          class_re = re.compile(r'\bclass\s*=\s*(["\'])([^"\']*)\1', re.I)

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8', errors='replace')
              if not is_customer_form_page(text):
                  continue

              detected.append(str(path))
              original = text

              # Repair the one false-positive produced by the first normalizer run.
              if str(path).replace('\\','/') == 'salem-appliance-pickup/index.html':
                  text = text.replace(
                      '<a href="#request">Keizer requests have a dedicated local page</a>',
                      '<a href="../keizer-appliance-pickup/">Keizer requests have a dedicated local page</a>'
                  )

              # Every customer pickup form page gets a local #request target.
              if not request_id_re.search(text):
                  form = form_re.search(text)
                  if form:
                      section_start = text.lower().rfind('<section', 0, form.start())
                      if section_start >= 0:
                          section_end = text.find('>', section_start)
                          opening = text[section_start:section_end + 1]
                          if not re.search(r'\bid\s*=', opening, re.I):
                              opening = opening[:-1] + ' id="request">'
                              text = text[:section_start] + opening + text[section_end + 1:]
                          else:
                              text = text[:form.start()] + '<span id="request" aria-hidden="true"></span>\n' + text[form.start():]
                      else:
                          text = text[:form.start()] + '<span id="request" aria-hidden="true"></span>\n' + text[form.start():]

              # Only true request CTAs/navigation are localized. Ordinary prose links
              # that merely contain the word "request" must keep their real destination.
              def localize_request_anchor(match):
                  tag = match.group(0)
                  attrs = match.group('attrs')
                  label_html = match.group('label')
                  label = re.sub(r'<[^>]+>', ' ', label_html)
                  label = re.sub(r'\s+', ' ', label).strip().lower()
                  classes = ''
                  cm = class_re.search(attrs)
                  if cm:
                      classes = cm.group(2).lower()
                  button_like = any(token in classes.split() for token in ('button','btn','cta'))
                  request_cta = label.startswith('request') or (button_like and 'request' in label)
                  if not request_cta:
                      return tag
                  href = href_re.search(attrs)
                  if href:
                      replacement_attrs = href_re.sub('href="#request"', attrs, count=1)
                  else:
                      replacement_attrs = attrs + ' href="#request"'
                  return '<a' + replacement_attrs + '>' + label_html + '</a>'

              text = anchor_re.sub(localize_request_anchor, text)

              # Catch only legacy links whose actual destination is a request anchor.
              text = re.sub(r'href\s*=\s*(["\'])(?:https://freereliableappliancepickup\.com/|/|\.\./|\./)#request\1', 'href="#request"', text, flags=re.I)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Detected customer pickup form pages: {len(detected)}')
          print(f'Normalized pages: {len(changed)}')
          for item in changed:
              print(' -', item)

      - name: Verify request actions
        shell: python
        run: |
          from pathlib import Path
          import re

          failures = []
          checked = 0
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8', errors='replace')
              lower = text.lower()
              customer = (
                  'formspree.io' in lower
                  and ('name="city"' in lower or "name='city'" in lower or 'name="pickup_city"' in lower or "name='pickup_city'" in lower)
                  and ('name="state"' in lower or "name='state'" in lower or 'name="pickup_state"' in lower or "name='pickup_state'" in lower)
                  and ('name="appliance"' in lower or "name='appliance'" in lower or 'name="appliance type"' in lower or "name='appliance type'" in lower)
              )
              if not customer:
                  continue
              checked += 1
              if not re.search(r'\bid\s*=\s*(["\'])request\1', text, re.I):
                  failures.append(f'{path}: missing #request target')
              if re.search(r'href\s*=\s*(["\'])(?:https://freereliableappliancepickup\.com/|/|\.\./|\./)#request\1', text, re.I):
                  failures.append(f'{path}: legacy request redirect remains')

          if not checked:
              raise SystemExit('No customer pickup form pages detected.')
          if failures:
              print('Request-action verification FAILED:')
              for item in failures:
                  print(' -', item)
              raise SystemExit(1)
          print(f'PASS: {checked} customer pickup form pages keep request actions on their local form.')

      - name: Commit normalized request actions
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No request-action changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' '**/*.html'
          git commit -m 'Keep pickup request buttons on local forms'
          git push
