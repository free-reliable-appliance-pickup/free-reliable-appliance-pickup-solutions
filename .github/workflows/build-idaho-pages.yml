name: Build Idaho Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-idaho:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Idaho appliance pickup pages
        run: |
          python3 <<'PY'
          from pathlib import Path
          from html import escape

          BASE = "https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/"
          FORM = "https://formspree.io/f/mvzeapzd"

          cities = {
              "Boise": "boise",
              "Meridian": "meridian",
              "Nampa": "nampa",
              "Caldwell": "caldwell",
              "Eagle": "eagle",
              "Garden City": "garden-city",
              "Kuna": "kuna",
              "Star": "star"
          }

          def make_page(city, slug):
              canonical = f"{BASE}{slug}-appliance-pickup/"

              links = "\n".join(
                  f'<a href="../{s}-appliance-pickup/">{escape(c)}</a>'
                  for c, s in cities.items()
                  if s != slug
              )

              return f"""<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">

              <title>Free Appliance Pickup {city} ID | Washer & Dryer Removal</title>

              <meta
                  name="description"
                  content="Request qualifying free appliance pickup in {city}, Idaho for washers, dryers, refrigerators, stoves, freezers and other major appliances."
              >

              <meta name="robots" content="index, follow">
              <link rel="canonical" href="{canonical}">

              <meta property="og:title" content="Free Appliance Pickup {city} Idaho">
              <meta
                  property="og:description"
                  content="Qualifying washer, dryer, refrigerator and major appliance pickup in {city}, Idaho."
              >
              <meta property="og:type" content="website">
              <meta property="og:url" content="{canonical}">

              <style>
                  * {{ box-sizing: border-box; }}

                  html {{ scroll-behavior: smooth; }}

                  body {{
                      margin: 0;
                      font-family: Arial, Helvetica, sans-serif;
                      line-height: 1.6;
                      color: #222;
                      background: #f6f7f6;
                  }}

                  header {{
                      background: linear-gradient(135deg, #075c32, #15934f);
                      color: white;
                      text-align: center;
                      padding: 50px 20px;
                  }}

                  header h1 {{
                      margin: 0 0 12px;
                      font-size: 38px;
                  }}

                  header p {{
                      max-width: 900px;
                      margin: auto;
                      font-size: 19px;
                  }}

                  nav {{
                      background: #111;
                      text-align: center;
                      padding: 14px;
                  }}

                  nav a {{
                      color: white;
                      text-decoration: none;
                      font-weight: bold;
                      margin: 0 10px;
                  }}

                  main {{
                      width: min(1100px, 92%);
                      margin: auto;
                  }}

                  section {{
                      background: white;
                      margin: 25px 0;
                      padding: 32px 26px;
                      border-radius: 12px;
                      box-shadow: 0 2px 10px rgba(0,0,0,.06);
                  }}

                  h2 {{
                      color: #075c32;
                      margin-top: 0;
                  }}

                  h3 {{
                      color: #12653e;
                  }}

                  .grid {{
                      display: grid;
                      grid-template-columns: repeat(3, 1fr);
                      gap: 18px;
                  }}

                  .card {{
                      padding: 20px;
                      border: 1px solid #ddd;
                      background: #fafafa;
                      border-radius: 10px;
                  }}

                  .button {{
                      display: inline-block;
                      background: #08753f;
                      color: white;
                      text-decoration: none;
                      padding: 14px 24px;
                      border-radius: 7px;
                      font-weight: bold;
                  }}

                  .priority {{
                      background: #eef8f2;
                      border-left: 5px solid #08753f;
                      padding: 18px;
                      margin-top: 20px;
                  }}

                  .notice {{
                      background: #fff8e7;
                      border-left: 5px solid #d99b00;
                      padding: 18px;
                  }}

                  .cities {{
                      display: flex;
                      flex-wrap: wrap;
                      gap: 10px;
                  }}

                  .cities a {{
                      background: #eef7f1;
                      padding: 8px 12px;
                      border-radius: 6px;
                      text-decoration: none;
                      color: #075c32;
                  }}

                  form {{
                      display: grid;
                      gap: 13px;
                  }}

                  label {{
                      font-weight: bold;
                  }}

                  input,
                  select,
                  textarea {{
                      width: 100%;
                      padding: 12px;
                      border: 1px solid #bbb;
                      border-radius: 6px;
                      font-size: 16px;
                  }}

                  textarea {{
                      min-height: 120px;
                  }}

                  button {{
                      padding: 14px;
                      border: 0;
                      border-radius: 7px;
                      background: #08753f;
                      color: white;
                      font-size: 17px;
                      font-weight: bold;
                      cursor: pointer;
                  }}

                  footer {{
                      background: #111;
                      color: white;
                      text-align: center;
                      padding: 30px 20px;
                      margin-top: 30px;
                  }}

                  footer a {{
                      color: white;
                  }}

                  @media (max-width: 800px) {{
                      .grid {{
                          grid-template-columns: 1fr;
                      }}

                      header h1 {{
                          font-size: 30px;
                      }}
                  }}
              </style>

              <script type="application/ld+json">
              {{
                  "@context": "https://schema.org",
                  "@type": "Service",
                  "name": "Free Appliance Pickup {city} Idaho",
                  "serviceType": [
                      "Washer Pickup",
                      "Dryer Pickup",
                      "Washer and Dryer Pickup",
                      "Appliance Pickup",
                      "Refrigerator Pickup",
                      "Appliance Removal",
                      "Appliance Recycling"
                  ],
                  "provider": {{
                      "@type": "Organization",
                      "name": "Free Reliable Appliance Pickup",
                      "url": "{BASE}"
                  }},
                  "areaServed": {{
                      "@type": "City",
                      "name": "{city}"
                  }},
                  "url": "{canonical}"
              }}
              </script>
          </head>

          <body>

          <header>
              <h1>Free Appliance Pickup in {city}, Idaho</h1>

              <p>
                  Qualifying washer, dryer, refrigerator,
                  stove, freezer and other major appliance pickup,
                  removal, reuse and recycling.
              </p>
          </header>

          <nav>
              <a href="../">Home</a>
              <a href="../idaho-appliance-pickup/">Idaho</a>
              <a href="#washers-dryers">Washer & Dryer</a>
              <a href="#request">Request Pickup</a>
          </nav>

          <main>

              <section>
                  <h2>{city} Appliance Pickup & Removal</h2>

                  <p>
                      Free Reliable Appliance Pickup reviews qualifying
                      appliance pickup requests throughout {city}, Idaho.
                      We work with homeowners, renters, landlords and
                      property managers who need major household
                      appliances removed.
                  </p>

                  <p>
                      Working appliances are especially valuable because
                      they may qualify for reuse or refurbishment.
                  </p>

                  <a class="button" href="#request">
                      Request Pickup Review
                  </a>
              </section>

              <section id="washers-dryers">
                  <h2>Free Washer & Dryer Pickup in {city}</h2>

                  <div class="priority">
                      <strong>Priority category:</strong>
                      Washers, dryers and washer-and-dryer sets are
                      among our most important appliance pickup requests.
                  </div>

                  <p>
                      If you are replacing a washing machine or clothes dryer,
                      send clear photos and tell us whether the machine
                      is fully working, partly working or not working.
                  </p>

                  <p>
                      Top-load washers, front-load washers, electric dryers,
                      gas dryers and laundry sets may qualify depending
                      on condition, access and current demand.
                  </p>
              </section>

              <section>
                  <h2>Appliances We Pick Up in {city}</h2>

                  <div class="grid">

                      <div class="card">
                          <h3>Washer Pickup</h3>
                          <p>
                              Top-load and front-load washers may qualify
                              for pickup and potential reuse.
                          </p>
                      </div>

                      <div class="card">
                          <h3>Dryer Pickup</h3>
                          <p>
                              Electric and gas dryers may qualify,
                              especially when still functioning.
                          </p>
                      </div>

                      <div class="card">
                          <h3>Washer & Dryer Sets</h3>
                          <p>
                              Laundry sets are especially valuable
                              for potential reuse or refurbishment.
                          </p>
                      </div>

                      <div class="card">
                          <h3>Refrigerator Pickup</h3>
                          <p>
                              Qualifying refrigerators may be reviewed
                              for pickup, reuse or parts recovery.
                          </p>
                      </div>

                      <div class="card">
                          <h3>Stove & Range Pickup</h3>
                          <p>
                              Gas and electric stoves and ranges may
                              qualify depending on condition.
                          </p>
                      </div>

                      <div class="card">
                          <h3>Freezer Pickup</h3>
                          <p>
                              Upright and chest freezers may qualify
                              depending on condition and current demand.
                          </p>
                      </div>

                  </div>
              </section>

              <section>
                  <h2>Appliance Pickup From Homes, Apartments & Rentals</h2>

                  <p>
                      We review pickup requests from houses, apartments,
                      rental properties, garages and property turnovers
                      throughout the {city} area.
                  </p>

                  <p>
                      Tell us whether the appliance is upstairs,
                      downstairs, in a basement, garage or outside,
                      and whether stairs or narrow doors are involved.
                  </p>
              </section>

              <section>
                  <h2>Reuse and Appliance Recycling</h2>

                  <p>
                      Appliances with remaining useful life may be
                      recovered for reuse, refurbishment or parts.
                      Appliances that cannot reasonably be reused may
                      be directed toward appropriate recycling options
                      when available.
                  </p>

                  <div class="notice">
                      <strong>Important:</strong>
                      Free pickup is not guaranteed.
                      Approval depends on appliance condition,
                      location, accessibility, demand and scheduling.
                  </div>
              </section>

              <section id="request">
                  <h2>Request Appliance Pickup in {city}</h2>

                  <form
                      action="{FORM}"
                      method="POST"
                      enctype="multipart/form-data"
                  >

                      <input
                          type="hidden"
                          name="_subject"
                          value="{city} Idaho Appliance Pickup Request"
                      >

                      <input
                          type="hidden"
                          name="city"
                          value="{city}"
                      >

                      <input
                          type="hidden"
                          name="state"
                          value="Idaho"
                      >

                      <label>Name</label>
                      <input type="text" name="name" required>

                      <label>Phone</label>
                      <input type="tel" name="phone" required>

                      <label>Email (optional)</label>
                      <input type="email" name="email">

                      <label>Pickup Address</label>
                      <input type="text" name="address" required>

                      <label>ZIP Code</label>
                      <input type="text" name="zip" required>

                      <label>Appliance Type</label>

                      <select name="appliance" required>
                          <option value="">Select Appliance</option>
                          <option>Washer</option>
                          <option>Dryer</option>
                          <option>Washer and Dryer</option>
                          <option>Refrigerator</option>
                          <option>Stove or Range</option>
                          <option>Freezer</option>
                          <option>Dishwasher</option>
                          <option>Multiple Appliances</option>
                          <option>Other Major Appliance</option>
                      </select>

                      <label>Condition</label>

                      <select name="condition" required>
                          <option value="">Select Condition</option>
                          <option>Fully working</option>
                          <option>Working but needs repair</option>
                          <option>Not working</option>
                          <option>Unknown</option>
                      </select>

                      <label>Appliance Location</label>

                      <select name="location" required>
                          <option value="">Select Location</option>
                          <option>First Floor</option>
                          <option>Second Floor</option>
                          <option>Third Floor</option>
                          <option>Basement</option>
                          <option>Garage</option>
                          <option>Outside</option>
                          <option>Other</option>
                      </select>

                      <label>Stairs</label>

                      <select name="stairs" required>
                          <option value="">Select Stairs</option>
                          <option>No Stairs</option>
                          <option>1 Flight</option>
                          <option>2 Flights</option>
                          <option>3+ Flights</option>
                          <option>Unknown</option>
                      </select>

                      <label>Additional Information</label>

                      <textarea
                          name="details"
                          placeholder="Brand, model, age, working condition and pickup access."
                      ></textarea>

                      <label>Appliance Photos</label>

                      <input
                          type="file"
                          name="photos"
                          accept="image/*"
                          multiple
                          required
                      >

                      <label>
                          <input
                              type="checkbox"
                              name="partner_consent"
                              value="yes"
                              style="width:auto;"
                          >
                          I understand my request may be fulfilled
                          by an approved local pickup partner.
                      </label>

                      <button type="submit">
                          Submit Pickup Request
                      </button>

                  </form>
              </section>

              <section>
                  <h2>Other Idaho Appliance Pickup Areas</h2>

                  <div class="cities">
                      {links}
                  </div>
              </section>

          </main>

          <footer>
              <p>© 2026 Free Reliable Appliance Pickup</p>

              <p>
                  <a href="../">Home</a> |
                  <a href="../idaho-appliance-pickup/">
                      Idaho Appliance Pickup
                  </a>
              </p>
          </footer>

          </body>
          </html>
          """

          for city, slug in cities.items():
              folder = Path(f"{slug}-appliance-pickup")
              folder.mkdir(parents=True, exist_ok=True)

              (folder / "index.html").write_text(
                  make_page(city, slug),
                  encoding="utf-8"
              )

              print("Created:", city)

          hub_links = "\n".join(
              f'<li><a href="../{slug}-appliance-pickup/">{city} Appliance Pickup</a></li>'
              for city, slug in cities.items()
          )

          hub = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">

              <title>Free Appliance Pickup Idaho | Boise Metro</title>

              <meta
                  name="description"
                  content="Request qualifying free appliance pickup across Idaho, including Boise, Meridian, Nampa, Caldwell, Eagle, Garden City, Kuna and Star."
              >

              <meta name="robots" content="index, follow">

              <link
                  rel="canonical"
                  href="{BASE}idaho-appliance-pickup/"
              >

              <style>
                  body {{
                      margin: 0;
                      font-family: Arial, Helvetica, sans-serif;
                      line-height: 1.6;
                      color: #222;
                      background: #f6f7f6;
                  }}

                  header {{
                      background: linear-gradient(135deg, #075c32, #15934f);
                      color: white;
                      text-align: center;
                      padding: 50px 20px;
                  }}

                  main {{
                      width: min(1000px, 92%);
                      margin: auto;
                  }}

                  section {{
                      background: white;
                      margin: 25px 0;
                      padding: 30px;
                      border-radius: 12px;
                  }}

                  h2 {{
                      color: #075c32;
                  }}

                  a {{
                      color: #08753f;
                  }}

                  li {{
                      margin: 9px 0;
                  }}

                  footer {{
                      background: #111;
                      color: white;
                      text-align: center;
                      padding: 30px;
                  }}
              </style>
          </head>

          <body>

          <header>
              <h1>Free Appliance Pickup in Idaho</h1>

              <p>
                  Qualifying washer, dryer, refrigerator,
                  stove, freezer and major appliance pickup.
              </p>
          </header>

          <main>

              <section>
                  <h2>Idaho Appliance Pickup Network</h2>

                  <p>
                      Free Reliable Appliance Pickup is expanding
                      qualifying appliance pickup coverage across
                      the Boise metro and surrounding Treasure Valley.
                  </p>

                  <p>
                      Washers, dryers and washer-and-dryer sets are
                      priority appliance categories.
                  </p>
              </section>

              <section>
                  <h2>Boise Metro & Treasure Valley</h2>

                  <p>
                      Our Idaho coverage includes Boise, Meridian,
                      Nampa, Caldwell, Eagle, Garden City,
                      Kuna and Star.
                  </p>
              </section>

              <section>
                  <h2>Idaho Cities</h2>

                  <ul>
                      {hub_links}
                  </ul>
              </section>

          </main>

          <footer>
              © 2026 Free Reliable Appliance Pickup
          </footer>

          </body>
          </html>
          """

          hub_folder = Path("idaho-appliance-pickup")
          hub_folder.mkdir(parents=True, exist_ok=True)

          (hub_folder / "index.html").write_text(
              hub,
              encoding="utf-8"
          )

          # Rebuild sitemap from every appliance pickup folder
          urls = [BASE]

          for folder in sorted(Path(".").glob("*-appliance-pickup")):
              if folder.is_dir() and (folder / "index.html").exists():
                  urls.append(BASE + folder.name + "/")

          sitemap = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]

          for url in urls:
              sitemap.extend([
                  "  <url>",
                  f"    <loc>{url}</loc>",
                  "  </url>"
              ])

          sitemap.append("</urlset>")

          Path("sitemap.xml").write_text(
              "\n".join(sitemap),
              encoding="utf-8"
          )

          print("Idaho hub created")
          print("Idaho city pages created:", len(cities))
          print("Sitemap rebuilt:", len(urls), "URLs")
          PY

      - name: Commit Idaho pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Add Idaho appliance pickup pages"
            git push
          fi
