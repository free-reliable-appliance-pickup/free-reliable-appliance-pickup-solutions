name: Replace Compressed Laundry Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-compressed-laundry-images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: replace-compressed-laundry-images
  cancel-in-progress: true

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old compressed washer dryer photos with sharp real photos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          BASE='https://freereliableappliancepickup.com/'
          replacements={
            '/assets/washer-dryer-photos/washer-dryer-pickup-frontload-set.jpg':'/assets/laundry/front-load-laundry-set.jpg',
            '/assets/washer-dryer-photos/washer-dryer-pickup-gray-topload-set.jpg':'/assets/laundry/laundry-pair.jpg',
            '/assets/washer-dryer-photos/washer-dryer-pickup-modern-topload-set.jpg':'/assets/laundry/washer-dryer-set-sharp.jpg',
            '/assets/washer-dryer-photos/washer-dryer-pickup-stacked-set.jpg':'/assets/laundry/stacked-laundry-center.jpg',
          }

          # Verify every replacement target exists before editing anything.
          for target in replacements.values():
              p=Path(target.lstrip('/'))
              if not p.exists():
                  raise SystemExit(f'Missing sharp replacement asset: {p}')

          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root=ET.parse('sitemap.xml').getroot()
          urls=[x.text.strip() for x in root.findall('.//s:loc',ns) if x.text and x.text.strip().startswith(BASE)]

          def file_for(url):
              if url==BASE:
                  return Path('index.html')
              return Path(url[len(BASE):].strip('/'))/'index.html'

          changed=[]
          counts={k:0 for k in replacements}
          for url in urls:
              p=file_for(url)
              if not p.exists():
                  continue
              raw=p.read_text(encoding='utf-8',errors='ignore')
              before=raw
              for old,new in replacements.items():
                  n=raw.count(old)
                  if n:
                      counts[old]+=n
                      raw=raw.replace(old,new)
                      # Also catches absolute URLs because the path substring is the same.
              if raw!=before:
                  p.write_text(raw,encoding='utf-8')
                  changed.append(str(p))

          print('Changed active pages:',len(changed))
          for p in changed:
              print(' -',p)
          print('Replacement counts:')
          for old,n in counts.items():
              print(f' {n:3d}  {old}')
          PY

          git add index.html '*/index.html' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No compressed laundry image references remained on active pages."
            exit 0
          fi

          git commit -m "Replace compressed laundry photos with sharp real images"
          git pull --rebase origin main || true
          git push origin HEAD:main
