name: Strengthen Discovered Page Crawl Links

on:
  push:
    paths:
      - '.github/workflows/strengthen-indexing-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strengthen contextual internal links
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          la=Path('los-angeles-county-appliance-pickup/index.html')
          s=la.read_text(encoding='utf-8')
          old='''<div class="card"><h3>San Gabriel Valley</h3><p>Selected San Gabriel Valley requests are handled under the regional 909 coverage. Call or text <a href="tel:+19093756685">909-375-6685</a> with the city and ZIP code.</p></div>'''
          new='''<div class="card"><h3>San Gabriel Valley</h3><p>Selected San Gabriel Valley requests are handled under the regional 909 coverage. Approved local pages include <a href="../la-crescenta-appliance-pickup/">La Crescenta appliance pickup</a>, <a href="../la-canada-flintridge-appliance-pickup/">La Cañada Flintridge appliance pickup</a>, <a href="../pasadena-appliance-pickup/">Pasadena appliance pickup</a> and <a href="../altadena-appliance-pickup/">Altadena appliance pickup</a>. Call or text <a href="tel:+19093756685">909-375-6685</a> with the city and ZIP code.</p></div>'''
          if old not in s:
              raise SystemExit('Expected San Gabriel Valley card not found')
          s=s.replace(old,new,1)
          old2='''<section><h2>Los Angeles County Communities</h2><div class="links"><a href="../los-angeles-appliance-pickup/">Los Angeles</a><span>Palmdale</span><span>Lancaster</span><a href="../long-beach-appliance-pickup/">Long Beach</a><span>Torrance</span><span>Santa Clarita</span><span>Santa Monica</span><span>Culver City</span><a href="../pasadena-appliance-pickup/">Pasadena</a></div>'''
          new2='''<section><h2>Los Angeles County Communities</h2><div class="links"><a href="../los-angeles-appliance-pickup/">Los Angeles</a><span>Palmdale</span><span>Lancaster</span><a href="../long-beach-appliance-pickup/">Long Beach</a><span>Torrance</span><span>Santa Clarita</span><span>Santa Monica</span><span>Culver City</span><a href="../pasadena-appliance-pickup/">Pasadena</a><a href="../la-crescenta-appliance-pickup/">La Crescenta</a><a href="../la-canada-flintridge-appliance-pickup/">La Cañada Flintridge</a></div>'''
          if old2 not in s:
              raise SystemExit('Expected LA communities block not found')
          s=s.replace(old2,new2,1)
          la.write_text(s,encoding='utf-8')

          co=Path('colorado-appliance-pickup/index.html')
          s=co.read_text(encoding='utf-8')
          old='''<a href="../aurora-appliance-pickup/">Aurora</a>\n<span class="nonindexed-area">Lakewood</span>'''
          new='''<a href="../aurora-appliance-pickup/">Aurora</a>\n<a href="../westminster-appliance-pickup/">Westminster</a>\n<span class="nonindexed-area">Lakewood</span>'''
          if old not in s:
              raise SystemExit('Expected Colorado priority links not found')
          s=s.replace(old,new,1)
          old2='''<div class="card"><h3>North &amp; West Metro</h3><p>Arvada, Westminster, Thornton, Commerce City, Brighton, Broomfield, Golden and Northglenn requests may be reviewed within available route coverage.</p></div>'''
          new2='''<div class="card"><h3>North &amp; West Metro</h3><p>Arvada, <a href="../westminster-appliance-pickup/">Westminster</a>, Thornton, Commerce City, Brighton, Broomfield, Golden and Northglenn requests may be reviewed within available route coverage.</p></div>'''
          if old2 not in s:
              raise SystemExit('Expected North & West Metro card not found')
          s=s.replace(old2,new2,1)
          co.write_text(s,encoding='utf-8')

          # Safety checks: targets remain indexable and canonicalized.
          targets=[
            'la-crescenta-appliance-pickup/index.html',
            'la-canada-flintridge-appliance-pickup/index.html',
            'westminster-appliance-pickup/index.html',
            'glendora-appliance-pickup/index.html',
            'upland-appliance-pickup/index.html',
            'central-coast-appliance-pickup/index.html',
            'contact/index.html',
          ]
          for name in targets:
              text=Path(name).read_text(encoding='utf-8',errors='ignore').lower()
              if 'noindex' in text:
                  raise SystemExit(f'Unexpected noindex in {name}')
              if 'rel="canonical"' not in text:
                  raise SystemExit(f'Missing canonical in {name}')

          # Intentional exclusions must remain excluded.
          for name in ['privacy/index.html','terms/index.html','phoenix-metro-appliance-pickup/index.html']:
              text=Path(name).read_text(encoding='utf-8',errors='ignore').lower()
              if 'noindex' not in text:
                  raise SystemExit(f'Intentional noindex missing in {name}')

          print('PASS: strengthened contextual crawl links without changing intentional noindex pages')
          PY
      - name: Commit indexing-link improvements
        shell: bash
        run: |
          rm -f .github/workflows/strengthen-indexing-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Strengthen crawl links for discovered indexable pages"
          git push
