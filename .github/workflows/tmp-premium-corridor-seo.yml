name: Temporary premium corridor SEO audit

on:
  push:
    paths:
      - '.github/workflows/tmp-premium-corridor-seo.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit and optimize premium corridor pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from datetime import date

          cities = [
              ("Montrose", "montrose-washer-dryer-pickup"),
              ("La Crescenta", "la-crescenta-washer-dryer-pickup"),
              ("La Cañada Flintridge", "la-canada-flintridge-washer-dryer-pickup"),
              ("Altadena", "altadena-washer-dryer-pickup"),
              ("Pasadena", "pasadena-washer-dryer-pickup"),
              ("San Marino", "san-marino-washer-dryer-pickup"),
              ("San Gabriel", "san-gabriel-washer-dryer-pickup"),
              ("Sierra Madre", "sierra-madre-washer-dryer-pickup"),
              ("Arcadia", "arcadia-washer-dryer-pickup"),
              ("Monrovia", "monrovia-washer-dryer-pickup"),
              ("Duarte", "duarte-washer-dryer-pickup"),
              ("Azusa", "azusa-washer-dryer-pickup"),
              ("Glendora", "glendora-washer-dryer-pickup"),
              ("Covina", "covina-washer-dryer-pickup"),
              ("West Covina", "west-covina-washer-dryer-pickup"),
              ("San Dimas", "san-dimas-washer-dryer-pickup"),
              ("La Verne", "la-verne-washer-dryer-pickup"),
              ("Claremont", "claremont-washer-dryer-pickup"),
              ("Pomona", "pomona-washer-dryer-pickup"),
              ("Montclair", "montclair-washer-dryer-pickup"),
              ("Ontario", "ontario-washer-dryer-pickup"),
              ("Upland", "upland-washer-dryer-pickup"),
              ("Rancho Cucamonga", "rancho-cucamonga-washer-dryer-pickup"),
              ("Fontana", "fontana-washer-dryer-pickup"),
              ("San Bernardino", "san-bernardino-washer-dryer-pickup"),
          ]

          sharp_replacements = {
              "/assets/laundry/washer-dryer-set.jpg": "/assets/laundry/washer-dryer-set-sharp.jpg",
              "/assets/laundry/laundry-pair.jpg": "/assets/laundry/washer-dryer-set-sharp.jpg",
              "/assets/laundry/top-load-washer.jpg": "/assets/laundry/real-laundry-pickup-1.jpg",
              "/assets/laundry/front-load-dryer.jpg": "/assets/laundry/real-laundry-pickup-2.jpg",
              "/assets/laundry/stacked-laundry-center.jpg": "/assets/laundry/real-laundry-pickup-3.jpg",
              "/assets/laundry/front-load-laundry-set.jpg": "/assets/laundry/real-laundry-pickup-4.jpg",
          }

          changed = []
          missing = []
          for i, (city, slug) in enumerate(cities):
              p = Path(slug) / "index.html"
              if not p.exists():
                  missing.append(str(p))
                  continue
              text = p.read_text(encoding="utf-8")
              original = text

              # Strong, accurate city/service titles and descriptions without promising same-day service.
              title = f"Free Washer & Dryer Pickup in {city}, CA | Appliance Removal"
              desc = (f"Request free washer and dryer pickup in {city}, CA for qualifying working washers, dryers and complete sets. "
                      "See pickup qualifications, access details, real photos and the local request form.")
              text = re.sub(r"<title>.*?</title>", f"<title>{title}</title>", text, count=1, flags=re.S)
              text = re.sub(r'<meta name="description" content="[^"]*">', f'<meta name="description" content="{desc}">', text, count=1)

              # Use the sharper real-photo assets anywhere older compressed laundry files remain.
              for old, new in sharp_replacements.items():
                  text = text.replace(old, new)

              # Preserve the full appliance in galleries instead of cropping it.
              text = re.sub(r'(\.photo-grid img\{[^}]*?)object-fit:cover;', r'\1object-fit:contain;background:#f5f7f6;', text)

              # Build a browseable corridor hierarchy with descriptive internal links.
              if 'data-premium-corridor-neighbors="1"' not in text:
                  links = []
                  if i > 0:
                      prev_city, prev_slug = cities[i-1]
                      links.append(f'<a href="/{prev_slug}/">Free washer &amp; dryer pickup in {prev_city}, CA</a>')
                  links.append('<a href="/san-gabriel-inland-empire-washer-dryer-pickup/">San Gabriel Valley to Inland Empire premium corridor</a>')
                  if i + 1 < len(cities):
                      next_city, next_slug = cities[i+1]
                      links.append(f'<a href="/{next_slug}/">Free washer &amp; dryer pickup in {next_city}, CA</a>')
                  appliance_slug = slug.replace('-washer-dryer-pickup', '-appliance-pickup')
                  if (Path(appliance_slug) / 'index.html').exists():
                      links.append(f'<a href="/{appliance_slug}/">All appliance pickup in {city}</a>')
                  section = ('<section data-premium-corridor-neighbors="1"><h2>Nearby Premium Corridor Pickup Pages</h2>'
                             '<p>Use the neighboring city pages for location-specific pickup details, or return to the corridor hub to browse the full connected service area.</p>'
                             '<div class="links">' + ''.join(links) + '</div></section>\n')
                  marker = '<section id="request">'
                  if marker in text:
                      text = text.replace(marker, section + marker, 1)
                  else:
                      text = text.replace('</main>', section + '</main>', 1)

              if text != original:
                  p.write_text(text, encoding="utf-8")
                  changed.append(str(p))

          # Strengthen the corridor hub around exact user intent and descriptive crawlable city links.
          hub = Path('san-gabriel-inland-empire-washer-dryer-pickup/index.html')
          if hub.exists():
              text = hub.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'<title>.*?</title>', '<title>Free Washer & Dryer Pickup | San Gabriel Valley & Inland Empire</title>', text, count=1, flags=re.S)
              text = re.sub(r'<meta name="description" content="[^"]*">', '<meta name="description" content="Free washer and dryer pickup across a 25-city San Gabriel Valley to Inland Empire corridor. Browse dedicated city pages, qualifications, real photos and pickup request details.">', text, count=1)
              for old, new in sharp_replacements.items():
                  text = text.replace(old, new)
              text = re.sub(r'(\.photo-grid img\{[^}]*?)object-fit:cover;', r'\1object-fit:contain;background:#f5f7f6;', text)

              for city, slug in cities:
                  # Descriptive anchor text gives customers and crawlers more context than a city name alone.
                  pattern = rf'(<a href="/{re.escape(slug)}/">){re.escape(city)}(</a>)'
                  repl = rf'\1Free washer &amp; dryer pickup in {city}, CA\2'
                  text = re.sub(pattern, repl, text)

              if 'data-corridor-seo-help="1"' not in text:
                  helpful = '''<section data-corridor-seo-help="1"><h2>How Free Washer &amp; Dryer Pickup Works Across This Corridor</h2><div class="grid"><div class="card"><h3>1. Choose your city</h3><p>Open the dedicated city page for local access guidance, neighboring service areas and the correct pickup request form.</p></div><div class="card"><h3>2. Show the appliance condition</h3><p>Clear photos and tested functions help determine whether a washer, dryer or complete set qualifies for free pickup.</p></div><div class="card"><h3>3. Describe the removal path</h3><p>Include floor level, stairs, gates, parking, driveway access and carrying distance so the local pickup professional can review the job before confirming it.</p></div><div class="card"><h3>4. Get route confirmation</h3><p>Pickup is confirmed after appliance condition, access and current route availability are reviewed. Free pickup is qualification-based rather than a guaranteed junk-hauling offer.</p></div></div></section>\n'''
                  photo_marker = '<section><h2>Real Washer & Dryer Photos</h2>'
                  if photo_marker in text:
                      text = text.replace(photo_marker, helpful + photo_marker, 1)
                  else:
                      text = text.replace('</main>', helpful + '</main>', 1)

              if text != original:
                  hub.write_text(text, encoding='utf-8')
                  changed.append(str(hub))

          # Ensure every corridor page and the hub are discoverable in both sitemap copies.
          target_urls = [f"https://freereliableappliancepickup.com/{slug}/" for _, slug in cities]
          target_urls.append('https://freereliableappliancepickup.com/san-gabriel-inland-empire-washer-dryer-pickup/')
          lastmod = '2026-09-15'
          for sm_name in ('sitemap.xml', 'sitemap-new.xml'):
              sm = Path(sm_name)
              if not sm.exists():
                  continue
              s = sm.read_text(encoding='utf-8')
              original = s
              for url in target_urls:
                  simple = f'<url><loc>{url}</loc></url>'
                  dated = f'<url><loc>{url}</loc><lastmod>{lastmod}</lastmod></url>'
                  if simple in s:
                      s = s.replace(simple, dated)
                  elif url not in s:
                      s = s.replace('</urlset>', f'  {dated}\n</urlset>')
              if s != original:
                  sm.write_text(s, encoding='utf-8')
                  changed.append(sm_name)

          # Verify the final state and save a concise repository audit.
          lines = []
          passed = 0
          for i, (city, slug) in enumerate(cities):
              p = Path(slug) / 'index.html'
              if not p.exists():
                  lines.append(f'FAIL {city}: missing {p}')
                  continue
              t = p.read_text(encoding='utf-8')
              checks = {
                  'title': f'Free Washer & Dryer Pickup in {city}, CA | Appliance Removal' in t,
                  'canonical': f'https://freereliableappliancepickup.com/{slug}/' in t,
                  'h1': '<h1' in t and city in t,
                  'service_schema': '"@type":"Service"' in t or '"@type": "Service"' in t,
                  'faq_schema': 'FAQPage' in t,
                  'breadcrumb_schema': 'BreadcrumbList' in t,
                  'request_form': 'formspree.io/f/mvzeapzd' in t,
                  'corridor_link': '/san-gabriel-inland-empire-washer-dryer-pickup/' in t,
                  'neighbor_nav': 'data-premium-corridor-neighbors="1"' in t,
                  'no_old_blurry_assets': not any(old in t for old in sharp_replacements),
              }
              ok = all(checks.values())
              if ok:
                  passed += 1
              failed_checks = ', '.join(k for k,v in checks.items() if not v) or 'none'
              lines.append(f'{"PASS" if ok else "CHECK"} {city}: failed={failed_checks}')

          lines.insert(0, f'Premium Corridor SEO Audit — {lastmod}')
          lines.insert(1, f'Pages passing all checks: {passed}/{len(cities)}')
          lines.insert(2, f'Missing page files: {len(missing)}')
          lines.append('')
          lines.append('Strategy applied: exact city/service titles, descriptive internal links, browseable corridor hierarchy, sharp real-photo fallbacks, accurate qualification language, Service/FAQ/Breadcrumb checks, request-form checks, and sitemap coverage.')
          Path('premium-corridor-audit.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          print('\n'.join(lines))
          print(f'Changed files before report: {len(set(changed))}')
          if missing:
              raise SystemExit('Missing corridor pages: ' + ', '.join(missing))
          PY

      - name: Commit optimized corridor pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add montrose-washer-dryer-pickup la-crescenta-washer-dryer-pickup la-canada-flintridge-washer-dryer-pickup altadena-washer-dryer-pickup pasadena-washer-dryer-pickup san-marino-washer-dryer-pickup san-gabriel-washer-dryer-pickup sierra-madre-washer-dryer-pickup arcadia-washer-dryer-pickup monrovia-washer-dryer-pickup duarte-washer-dryer-pickup azusa-washer-dryer-pickup glendora-washer-dryer-pickup covina-washer-dryer-pickup west-covina-washer-dryer-pickup san-dimas-washer-dryer-pickup la-verne-washer-dryer-pickup claremont-washer-dryer-pickup pomona-washer-dryer-pickup montclair-washer-dryer-pickup ontario-washer-dryer-pickup upland-washer-dryer-pickup rancho-cucamonga-washer-dryer-pickup fontana-washer-dryer-pickup san-bernardino-washer-dryer-pickup san-gabriel-inland-empire-washer-dryer-pickup sitemap.xml sitemap-new.xml premium-corridor-audit.txt
          if git diff --cached --quiet; then
            echo "No corridor changes needed"
          else
            git commit -m "Optimize 25-city premium washer dryer corridor"
            git push origin HEAD:main
          fi
