      - name: Commit verified updates and remove one-time workflow
        run: |
          git config user.name "Free Reliable Website Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/ttg-ga-fl-tx-free-pickup.yml
          git add -u
          git commit -m "Georgia Florida Texas: Free Pickup customer copy and request consent"
          git fetch origin ttg/ga-fl-tx-free-pickup-copy-20261110
          git pull --rebase origin ttg/ga-fl-tx-free-pickup-copy-20261110
