name: Audit Active Metadata Uniqueness
# Revalidated after the approved-page request-action repair pass.

on:
  push:
    paths:
      - 'sitemap.xml'
      - 'data/approved-indexable-locations.txt'
      - '.github/workflows/audit-active-metadata-uniqueness.yml'
  pull_request:
    paths:
      - 'sitemap.xml'
      - 'data/approved-indexable-locations.txt'
      - '.github/workflows/audit-active-metadata-uniqueness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check canonical, title, description and H1 uniqueness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          from html.parser import HTMLParser
          import html, xml.etree.ElementTree as ET

          BASE='https://freereliableappliancepickup.com/'
          root=ET.parse('sitemap.xml').getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[e.text.strip() for e in root.findall('.//s:loc',ns) if e.text]

          def file_for(url):
              if url.rstrip('/')==BASE.rstrip('/'):
                  return Path('index.html')
              if not url.startswith(BASE):
                  return None
              rel=url[len(BASE):].strip('/')
              p=Path(rel)
              return p if p.suffix else p/'index.html'

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.title=''; self.h1=''; self.desc=''; self.canonical=''
                  self._capture=None; self._buf=[]
              def handle_starttag(self, tag, attrs):
                  a={k.lower():(v or '') for k,v in attrs}
                  tag=tag.lower()
                  if tag=='title' and not self.title:
                      self._capture='title'; self._buf=[]
                  elif tag=='h1' and not self.h1:
                      self._capture='h1'; self._buf=[]
                  elif tag=='meta' and a.get('name','').lower()=='description' and not self.desc:
                      self.desc=a.get('content','').strip()
                  elif tag=='link' and 'canonical' in a.get('rel','').lower() and not self.canonical:
                      self.canonical=a.get('href','').strip()
              def handle_endtag(self, tag):
                  tag=tag.lower()
                  if self._capture==tag:
                      value=' '.join(''.join(self._buf).split())
                      if tag=='title': self.title=value
                      elif tag=='h1': self.h1=value
                      self._capture=None; self._buf=[]
              def handle_data(self, data):
                  if self._capture:
                      self._buf.append(data)

          rows=[]
          for url in urls:
              p=file_for(url)
              if p is None or not p.exists():
                  rows.append((url,'','','','MISSING'))
                  continue
              parser=MetaParser()
              parser.feed(p.read_text(encoding='utf-8',errors='ignore'))
              rows.append((url,html.unescape(parser.title),html.unescape(parser.desc),html.unescape(parser.h1),parser.canonical))

          print('ACTIVE_URLS',len(rows))
          print('MISSING_TITLE',sum(not r[1] for r in rows))
          print('MISSING_DESCRIPTION',sum(not r[2] for r in rows))
          print('MISSING_H1',sum(not r[3] for r in rows))
          print('MISSING_CANONICAL',sum(not r[4] for r in rows))
          bad=[r for r in rows if r[4] and r[4] != 'MISSING' and r[4].rstrip('/')!=r[0].rstrip('/')]
          print('CANONICAL_MISMATCH',len(bad))
          for r in bad: print('BAD_CANONICAL',r[0],'->',r[4])

          for label,idx in [('TITLE',1),('DESCRIPTION',2),('H1',3)]:
              groups=defaultdict(list)
              for r in rows:
                  key=' '.join(r[idx].lower().split())
                  if key: groups[key].append(r[0])
              dups=[(k,v) for k,v in groups.items() if len(v)>1]
              print('\nDUPLICATE_'+label+'_GROUPS',len(dups))
              for k,v in sorted(dups,key=lambda x:(-len(x[1]),x[0])):
                  print(label,len(v),k)
                  for u in v: print(' ',u)
          PY
