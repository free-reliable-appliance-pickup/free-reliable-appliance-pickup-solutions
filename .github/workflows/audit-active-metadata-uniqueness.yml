name: Audit Active Metadata Uniqueness
# Reports duplicate search metadata and blocks verified canonical/missing-metadata defects.

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'data/approved-indexable-locations.txt'
      - '.github/workflows/audit-active-metadata-uniqueness.yml'
  pull_request:
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'data/approved-indexable-locations.txt'
      - '.github/workflows/audit-active-metadata-uniqueness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check canonical, title, description and H1 uniqueness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          from html.parser import HTMLParser
          import html, sys, xml.etree.ElementTree as ET

          BASE='https://freereliableappliancepickup.com/'
          root=ET.parse('sitemap.xml').getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[e.text.strip() for e in root.findall('.//s:loc',ns) if e.text and e.text.startswith(BASE)]

          def file_for(url):
              if url.rstrip('/')==BASE.rstrip('/'):
                  return Path('index.html')
              rel=url[len(BASE):].strip('/')
              p=Path(rel)
              return p if p.suffix else p/'index.html'

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.title=''; self.h1=''; self.desc=''; self.canonical=''
                  self._capture=None; self._buf=[]
              def handle_starttag(self, tag, attrs):
                  a={k.lower():(v or '') for k,v in attrs}
                  tag=tag.lower()
                  if tag=='title' and not self.title:
                      self._capture='title'; self._buf=[]
                  elif tag=='h1' and not self.h1:
                      self._capture='h1'; self._buf=[]
                  elif tag=='meta' and a.get('name','').lower()=='description' and not self.desc:
                      self.desc=a.get('content','').strip()
                  elif tag=='link' and 'canonical' in a.get('rel','').lower() and not self.canonical:
                      self.canonical=a.get('href','').strip()
              def handle_endtag(self, tag):
                  tag=tag.lower()
                  if self._capture==tag:
                      value=' '.join(''.join(self._buf).split())
                      if tag=='title': self.title=value
                      elif tag=='h1': self.h1=value
                      self._capture=None; self._buf=[]
              def handle_data(self, data):
                  if self._capture:
                      self._buf.append(data)

          rows=[]
          errors=[]
          for url in urls:
              p=file_for(url)
              if p is None or not p.exists():
                  errors.append(f'MISSING_FILE {url} -> {p}')
                  continue
              raw=p.read_text(encoding='utf-8',errors='ignore')
              if 'noindex' in raw.lower():
                  continue
              parser=MetaParser(); parser.feed(raw)
              title=html.unescape(parser.title).strip()
              desc=html.unescape(parser.desc).strip()
              h1=html.unescape(parser.h1).strip()
              canonical=parser.canonical.strip()
              rows.append((url,title,desc,h1,canonical))
              if not title: errors.append(f'MISSING_TITLE {url}')
              if not desc: errors.append(f'MISSING_DESCRIPTION {url}')
              if not h1: errors.append(f'MISSING_H1 {url}')
              if not canonical: errors.append(f'MISSING_CANONICAL {url}')
              elif canonical.rstrip('/') != url.rstrip('/'):
                  errors.append(f'CANONICAL_MISMATCH {url} -> {canonical}')

          print('ACTIVE_URLS',len(rows))
          print('TECHNICAL_ERRORS',len(errors))
          for e in errors[:200]:
              print(e)

          for label,idx in [('TITLE',1),('DESCRIPTION',2),('H1',3)]:
              groups=defaultdict(list)
              for r in rows:
                  key=' '.join(r[idx].lower().split())
                  if key: groups[key].append(r[0])
              dups=[(k,v) for k,v in groups.items() if len(v)>1]
              print('\nDUPLICATE_'+label+'_GROUPS',len(dups))
              for k,v in sorted(dups,key=lambda x:(-len(x[1]),x[0]))[:100]:
                  print(label,len(v),k)
                  for u in v: print(' ',u)

          canon=defaultdict(list)
          for url,_,_,_,canonical in rows:
              if canonical: canon[canonical.rstrip('/')].append(url)
          dup_canon=[(k,v) for k,v in canon.items() if len(v)>1]
          print('\nDUPLICATE_CANONICAL_GROUPS',len(dup_canon))
          for k,v in dup_canon[:100]:
              print('CANONICAL',len(v),k,'|',' ; '.join(v))

          if errors or dup_canon:
              sys.exit('Active metadata/canonical technical errors found')
          PY
