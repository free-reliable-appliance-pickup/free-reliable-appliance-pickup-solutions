name: TTG Colorado Gold Gapfill QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  colorado:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Colorado city matrix, intake, unique photos and release gates
        run: python -m unittest discover -s tests -p 'test_ttg_colorado_pages.py' -v
