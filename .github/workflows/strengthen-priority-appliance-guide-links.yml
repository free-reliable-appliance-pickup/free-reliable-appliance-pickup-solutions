name: Strengthen priority appliance guide links

on:
  push:
    paths:
      - '.github/workflows/strengthen-priority-appliance-guide-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add priority city links to washer and refrigerator guides
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('washer-dryer-pickup/index.html'): (
                  '<a href="/los-angeles-appliance-pickup/">Los Angeles CA</a><a href="/inland-empire-appliance-pickup/">Inland Empire CA</a><a href="/orange-county-appliance-pickup/">Orange County CA</a><a href="/riverside-county-appliance-pickup/">Riverside County CA</a><a href="/service-areas/">All Service Areas</a>',
                  '<a href="/los-angeles-appliance-pickup/">Los Angeles CA</a><a href="/long-beach-appliance-pickup/">Long Beach CA</a><a href="/pasadena-appliance-pickup/">Pasadena CA</a><a href="/inland-empire-appliance-pickup/">Inland Empire CA</a><a href="/rancho-cucamonga-appliance-pickup/">Rancho Cucamonga CA</a><a href="/fontana-appliance-pickup/">Fontana CA</a><a href="/ontario-appliance-pickup/">Ontario CA</a><a href="/orange-county-appliance-pickup/">Orange County CA</a><a href="/anaheim-appliance-pickup/">Anaheim CA</a><a href="/irvine-appliance-pickup/">Irvine CA</a><a href="/riverside-county-appliance-pickup/">Riverside County CA</a><a href="/riverside-appliance-pickup/">Riverside CA</a><a href="/temecula-appliance-pickup/">Temecula CA</a><a href="/service-areas/">All Service Areas</a>'
              ),
              Path('refrigerator-pickup/index.html'): (
                  '<a href="/los-angeles-appliance-pickup/">Los Angeles CA</a><a href="/long-beach-appliance-pickup/">Long Beach CA</a><a href="/pasadena-appliance-pickup/">Pasadena CA</a><a href="/inland-empire-appliance-pickup/">Inland Empire CA</a><a href="/orange-county-appliance-pickup/">Orange County CA</a><a href="/riverside-county-appliance-pickup/">Riverside County CA</a><a href="/service-areas/">All Service Areas</a>',
                  '<a href="/los-angeles-appliance-pickup/">Los Angeles CA</a><a href="/long-beach-appliance-pickup/">Long Beach CA</a><a href="/pasadena-appliance-pickup/">Pasadena CA</a><a href="/inland-empire-appliance-pickup/">Inland Empire CA</a><a href="/rancho-cucamonga-appliance-pickup/">Rancho Cucamonga CA</a><a href="/fontana-appliance-pickup/">Fontana CA</a><a href="/ontario-appliance-pickup/">Ontario CA</a><a href="/orange-county-appliance-pickup/">Orange County CA</a><a href="/anaheim-appliance-pickup/">Anaheim CA</a><a href="/irvine-appliance-pickup/">Irvine CA</a><a href="/riverside-county-appliance-pickup/">Riverside County CA</a><a href="/riverside-appliance-pickup/">Riverside CA</a><a href="/temecula-appliance-pickup/">Temecula CA</a><a href="/service-areas/">All Service Areas</a>'
              )
          }

          changed = []
          for path, (old, new) in replacements.items():
              text = path.read_text()
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Expected link block not found in {path}')
              path.write_text(text.replace(old, new, 1))
              changed.append(str(path))

          print('Changed:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit targeted internal-link update
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add washer-dryer-pickup/index.html refrigerator-pickup/index.html
          git commit -m 'Strengthen priority city links from appliance guides'
          git push
