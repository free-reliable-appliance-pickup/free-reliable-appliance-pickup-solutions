name: Turbo Priority SEO Batch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/turbo-seo-network.json'
      - 'scripts/turbo-seo-batch.py'
      - 'scripts/turbo-final-audit.py'
      - '.github/workflows/turbo-california-seo-batch.yml'

permissions:
  contents: write

concurrency:
  group: turbo-priority-seo-batch
  cancel-in-progress: true

jobs:
  turbo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply all priority-page SEO changes in one run
        run: python3 scripts/turbo-seo-batch.py --write

      - name: Verify the batch is stable
        run: |
          python3 scripts/turbo-seo-batch.py > /tmp/turbo-dry-run.txt
          cat /tmp/turbo-dry-run.txt
          grep -q 'TARGETS_CHANGED=0' /tmp/turbo-dry-run.txt

      - name: Run Turbo final SEO audit
        run: python3 scripts/turbo-final-audit.py

      - name: Audit active page images
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/audit-active-page-images.py

      - name: Commit once
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*-appliance-pickup/index.html' '*-washer-dryer-pickup/index.html' '*-refrigerator-pickup/index.html' '*-freezer-pickup/index.html' '*-stove-oven-pickup/index.html' refrigerator-pickup/index.html freezer-pickup/index.html stove-oven-pickup/index.html sitemap.xml sitemap-regular-washer-dryer.xml
          if git diff --cached --quiet; then
            echo "No page changes needed"
            exit 0
          fi
          git commit -m "Apply turbo priority appliance and washer dryer SEO batch"
          git push
