name: Audit Texas City Photo Disclosures

on:
  pull_request:
    paths:
      - '**/index.html'
      - 'data/cities.json'
      - 'scripts/audit-texas-visual-disclosures.py'
      - '.github/workflows/audit-texas-visual-disclosures.yml'
  push:
    branches: [main]
    paths:
      - '**/index.html'
      - 'data/cities.json'
      - 'scripts/audit-texas-visual-disclosures.py'
      - '.github/workflows/audit-texas-visual-disclosures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit all Texas city photos, page identity and visible disclosures
        run: python3 scripts/audit-texas-visual-disclosures.py --strict-disclosures
