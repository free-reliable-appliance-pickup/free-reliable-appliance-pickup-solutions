name: One-Time Workflow Cleanup

on:
  push:
    paths:
      - '.github/workflows/cleanup-old-workflows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove completed manual workflows
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          rm -f \
            .github/workflows/build-idaho-pages.yml \
            .github/workflows/build-nevada-pages.yml \
            .github/workflows/build-washington-pages.yml \
            .github/workflows/nationwide-final-build.yml \
            .github/workflows/priority-ranking-upgrade.yml \
            .github/workflows/repair-site-compact.yml \
            .github/workflows/restore-nationwide-partners.yml \
            .github/workflows/sitewide-seo-refresh.yml \
            .github/workflows/strengthen-arizona-seo.yml \
            .github/workflows/cleanup-old-workflows.yml

          if git diff --quiet; then
            echo 'Nothing to clean.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove completed manual website workflows'

          for attempt in 1 2 3 4; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main || true
          done

          echo 'Could not push cleanup after retries.'
          exit 1
