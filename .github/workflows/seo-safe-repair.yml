name: SEO Autopilot - Safe Repairs
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/seo_safe_repair.py'
      - '.github/scripts/test_seo_safe_repair.py'
      - '.github/workflows/seo-safe-repair.yml'
  schedule:
    # 6 AM Pacific: 13:00 UTC during daylight saving time, 14:00 UTC in standard time.
    # GitHub cron is UTC-only; the two entries use month windows as an approximation.
    # Exact DST transitions need a timezone-aware guard if strict 6 AM is required.
    - cron: '0 13 * 4-10 *'
    - cron: '0 14 * 11-3 *'
permissions:
  contents: write
  pull-requests: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify repair script and regression tests
        run: |
          python -m py_compile .github/scripts/seo_safe_repair.py .github/scripts/test_seo_safe_repair.py
          python -m unittest discover -s .github/scripts -p 'test_seo_safe_repair.py'
      - name: Stop before writes on pull requests
        if: github.event_name == 'pull_request'
        run: echo 'Tests complete; repair writes are disabled on pull requests.'
      - name: Repair only unambiguous broken HTML links
        if: github.event_name != 'pull_request'
        run: python .github/scripts/seo_safe_repair.py --apply
      - name: Confirm repeatability
        if: github.event_name != 'pull_request'
        run: |
          python .github/scripts/seo_safe_repair.py --apply
          git diff --check
      - name: Create reviewable repair PR
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/seo-safe-link-repairs
          delete-branch: true
          commit-message: "fix: repair unambiguous broken internal HTML links"
          title: "SEO Autopilot: safe internal link repairs"
          body: "Automated conservative fixes only. Please review before merging. No phone numbers, forms, copy, images, or canonical tags are changed."
          add-paths: '**/*.html'
