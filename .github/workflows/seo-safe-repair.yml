name: SEO Autopilot - Safe Repairs
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/seo_safe_repair.py'
      - '.github/scripts/test_seo_safe_repair.py'
      - '.github/workflows/seo-safe-repair.yml'
  schedule:
    # Two UTC slots cover 6 AM Pacific year-round; timezone guard selects one.
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check 6 AM Pacific schedule
        id: pacific_time
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import os
          # Scheduled runs can queue for hours. Select by the intended UTC cron slot.
          if os.environ["EVENT_NAME"] != "schedule":
              allowed = True
          else:
              parts = os.environ.get("SCHEDULE_EXPR", "").split()
              allowed = False
              if len(parts) == 5 and parts[0].isdigit() and parts[1].isdigit():
                  minute, hour = int(parts[0]), int(parts[1])
                  if 0 <= minute < 60 and 0 <= hour < 24:
                      nominal = datetime.now(timezone.utc).replace(
                          hour=hour, minute=minute, second=0, microsecond=0)
                      allowed = nominal.astimezone(ZoneInfo("America/Los_Angeles")).hour == 6
          print(f"Scheduled slot: {os.environ.get('SCHEDULE_EXPR', 'manual')}; run: {allowed}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run_repair={str(allowed).lower()}\n")
          PY
      - uses: actions/checkout@v4
        if: steps.pacific_time.outputs.run_repair == 'true'
      - name: Verify repair script and regression tests
        if: steps.pacific_time.outputs.run_repair == 'true'
        run: |
          python -m py_compile .github/scripts/seo_safe_repair.py .github/scripts/test_seo_safe_repair.py
          python -m unittest discover -s .github/scripts -p 'test_seo_safe_repair.py'
      - name: Stop before writes on pull requests
        if: steps.pacific_time.outputs.run_repair == 'true' && github.event_name == 'pull_request'
        run: echo 'Tests complete; repair writes are disabled on pull requests.'
      - name: Repair only unambiguous broken HTML links
        if: steps.pacific_time.outputs.run_repair == 'true' && github.event_name != 'pull_request'
        run: python .github/scripts/seo_safe_repair.py --apply
      - name: Confirm repeatability
        if: steps.pacific_time.outputs.run_repair == 'true' && github.event_name != 'pull_request'
        run: |
          python .github/scripts/seo_safe_repair.py --apply
          git diff --check
      - name: Create reviewable repair PR
        if: steps.pacific_time.outputs.run_repair == 'true' && github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/seo-safe-link-repairs
          delete-branch: true
          commit-message: "fix: repair unambiguous broken internal HTML links"
          title: "SEO Autopilot: safe internal link repairs"
          body: "Automated conservative fixes only. Please review before merging. No phone numbers, forms, copy, images, or canonical tags are changed."
          add-paths: '**/*.html'
