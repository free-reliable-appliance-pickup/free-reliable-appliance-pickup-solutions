# Reusable offline preflight for manifest-listed state batches.
# Not a production approval or substitute for existing required reviews.
name: TTG FastTrack 2.1 State Batch QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: State page structure (no external AI quota)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test routing and page validator
        run: python -m unittest discover -s tests -p 'test_ttg_state_batch_qa.py' -v
      - name: Validate Minnesota state, city and appliance link integrity
        run: python -m unittest discover -s tests -p 'test_ttg_minnesota_pages.py' -v
      - name: Test statewide free-pickup eligibility messaging
        run: python -m unittest discover -s tests -p 'test_ttg_free_pickup_state_hubs.py' -v
      - name: Verify conditional free-pickup titles and schema across city batches
        run: python -m unittest discover -s tests -p 'test_ttg_free_city_category_copy.py' -v
      - name: Validate Oklahoma 50-city Gold rollout
        run: python -m unittest discover -s tests -p 'test_ttg_oklahoma_pages.py' -v
      - name: Verify Alabama 50-city Gold request pages
        run: python -m unittest discover -s tests -p 'test_ttg_alabama_pages.py' -v
      - name: Verify Mississippi Gold 251-page rollout
        run: python -m unittest discover -s tests -p 'test_ttg_mississippi_pages.py' -v
      - name: Verify Louisiana Gold 251-page rollout
        run: python -m unittest discover -s tests -p 'test_ttg_louisiana_pages.py' -v
      - name: Validate Arkansas Gold city and category rollout
        run: python -m unittest discover -s tests -p 'test_ttg_arkansas_pages.py' -v
      - name: Validate Kansas California Gold expansion
        run: python -m unittest discover -s tests -p 'test_ttg_kansas_pages.py' -v
      - name: Verify Nebraska 251-page California Gold rollout
        run: python -m unittest discover -s tests -p 'test_ttg_nebraska_pages.py' -v
      - name: Verify Iowa 251-page Gold request-only expansion
        run: python -m unittest discover -s tests -p 'test_ttg_iowa_pages.py' -v
      - name: Verify New Jersey 251-page California Gold requests
        run: python -m unittest discover -s tests -p 'test_ttg_new_jersey_pages.py' -v
      - name: Verify Maryland 251-page California Gold request-only rollout
        run: python -m unittest discover -s tests -p 'test_ttg_maryland_pages.py' -v
      - name: Validate state manifests and every listed page
        run: python scripts/ttg_state_batch_qa.py
