name: Competitor SEO Change Watch

on:
  schedule:
    # 8:30 AM America/Mazatlan (UTC-7) daily.
    - cron: '30 15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/competitor-watch-targets.json'
      - 'scripts/watch-competitor-pages.py'
      - '.github/workflows/watch-competitor-pages.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: competitor-seo-change-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare priority competitor pages
        id: watch
        run: |
          python3 scripts/watch-competitor-pages.py
          cat reports/competitor-watch-latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed baseline and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/competitor-watch-snapshots.json reports/competitor-watch-latest.md
          if git diff --cached --quiet; then
            echo "No snapshot/report changes to commit."
          else
            git commit -m "SEO watch: refresh competitor baseline"
            git push
          fi

      - name: Open or update actionable competitor alert
        if: steps.watch.outputs.meaningful_changes != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Competitor SEO change — $(date -u +%Y-%m-%d)"
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "'"$title"'") | .number' | head -n1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file reports/competitor-watch-latest.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file reports/competitor-watch-latest.md
          fi
