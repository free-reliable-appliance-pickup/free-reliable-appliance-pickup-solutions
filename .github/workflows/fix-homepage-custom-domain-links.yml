name: Fix homepage custom-domain links

on:
  push:
    paths:
      - '.github/workflows/fix-homepage-custom-domain-links.yml'

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old GitHub Pages paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="/free-reliable-appliance-pickup-solutions/partners/"', 'href="/partners/"')
          s = s.replace('href="/free-reliable-appliance-pickup-solutions/"', 'href="/"')
          s = s.replace('href="/free-reliable-appliance-pickup-solutions/sitemap.xml"', 'href="/sitemap.xml"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage link changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix homepage custom-domain links"
          git push
