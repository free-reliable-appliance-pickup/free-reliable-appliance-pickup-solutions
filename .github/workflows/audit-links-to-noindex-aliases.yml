name: Audit Links To Noindex Aliases

on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - '**/index.html'
      - '.github/workflows/audit-links-to-noindex-aliases.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find internal links from indexable pages to noindex pages
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          base='https://freereliableappliancepickup.com/'

          pages=[Path('index.html')]+sorted(
              p for p in Path('.').rglob('index.html')
              if '.git' not in p.parts and '.github' not in p.parts and p != Path('index.html')
          )

          # Noindex is not synonymous with an alias. An explicitly labeled,
          # self-canonical request-only city guide may be useful to customers
          # while remaining excluded from search. An alias points elsewhere.
          def canonical_in(head):
              for tag in re.findall(r'<link\b[^>]*>',head,re.I):
                  rel=re.search(r'\brel\s*=\s*([\x22\x27])([^\x22\x27]*)\1',tag,re.I)
                  href=re.search(r'\bhref\s*=\s*([\x22\x27])([^\x22\x27]*)\1',tag,re.I)
                  if rel and href and 'canonical' in rel.group(2).lower().split():
                      return href.group(2).strip()
              return None

          noindex=set()
          aliases=set()
          indexable=[]
          for p in pages:
              text=p.read_text(encoding='utf-8',errors='ignore')
              head=text.lower().split('</head>',1)[0]
              rel='' if p==Path('index.html') else p.parent.as_posix().strip('/')
              if 'noindex' in head:
                  if rel:
                      noindex.add(rel)
                      canonical=canonical_in(head)
                      if not canonical or canonical.rstrip('/') != (base+rel).rstrip('/'):
                          aliases.add(rel)
              else:
                  indexable.append((p,text))

          assert canonical_in('<link rel="canonical" href="'+base+'miami-fl-appliance-pickup/">') == base+'miami-fl-appliance-pickup/'
          leaks=[]
          allowed_guides=0
          for p,text in indexable:
              hrefs=re.findall(r'href=["\']([^"\']+)["\']',text,re.I)
              for href in hrefs:
                  target=None
                  if href.startswith(base):
                      target=href[len(base):].split('#',1)[0].split('?',1)[0].strip('/')
                  elif href.startswith('/'):
                      target=href.split('#',1)[0].split('?',1)[0].strip('/')
                  elif href.startswith('../'):
                      # Resolve simple relative site links against page parent.
                      try:
                          target=(p.parent / href.split('#',1)[0].split('?',1)[0]).resolve().relative_to(Path('.').resolve()).as_posix().strip('/')
                      except Exception:
                          target=None
                  # Utility/legal noindex pages are intentionally linked from the site.
                  if target in {'privacy','terms'}:
                      continue
                  if target and target in aliases:
                      leaks.append((str(p),href,target))
                  elif target and target in noindex:
                      allowed_guides+=1

          print(f'NOINDEX_PATHS {len(noindex)}')
          print(f'NOINDEX_ALIASES {len(aliases)}')
          print(f'INDEXABLE_PAGES_SCANNED {len(indexable)}')
          print(f'LINKS_TO_SELFCANONICAL_NOINDEX_GUIDES {allowed_guides}')
          print(f'LINKS_TO_NOINDEX_ALIASES {len(leaks)}')
          for src,href,target in leaks[:300]:
              print(f'LEAK {src} -> {href} [{target}]')

          if leaks:
              sys.exit(1)
          print('PASS: no indexable page links to an internal noindex alias.')
