name: One-Time Focused Crawl Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/focused-crawl-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Focus internal crawl graph on indexable sitemap URLs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, urlunparse
          import re
          import xml.etree.ElementTree as ET

          BASE = 'https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/'
          base_parts = urlparse(BASE)
          base_path = base_parts.path

          tree = ET.parse('sitemap.xml')
          root = tree.getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          allowed = {el.text.strip() for el in root.findall('sm:url/sm:loc', ns) if el.text}
          preserve = {urljoin(BASE, 'partners/')}

          def page_url(path: Path):
              s = path.as_posix()
              if s == 'index.html':
                  return BASE
              if s.endswith('/index.html'):
                  return urljoin(BASE, s[:-10])
              return urljoin(BASE, s)

          anchor_re = re.compile(r'<a\b([^>]*?)href\s*=\s*([\"\'])(.*?)\2([^>]*)>(.*?)</a>', re.I | re.S)

          changed_files = []
          removed_links = [0]

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              current = page_url(path)
              if current not in allowed:
                  continue

              text = path.read_text(encoding='utf-8')

              def repl(m):
                  before, quote, href, after, inner = m.groups()
                  h = href.strip()
                  low = h.lower()
                  if not h or low.startswith(('#', 'tel:', 'sms:', 'mailto:', 'javascript:', 'data:')):
                      return m.group(0)

                  absolute = urljoin(current, h)
                  p = urlparse(absolute)
                  clean = urlunparse((p.scheme, p.netloc, p.path, '', '', ''))

                  if p.netloc != base_parts.netloc or not p.path.startswith(base_path):
                      return m.group(0)

                  last = p.path.rsplit('/', 1)[-1]
                  if '.' in last and not last.endswith('.html'):
                      return m.group(0)

                  if not clean.endswith('/') and not clean.endswith('.html'):
                      clean += '/'

                  if clean in allowed or clean in preserve:
                      return m.group(0)

                  removed_links[0] += 1
                  return f'<span class="nonindexed-area">{inner}</span>'

              new = anchor_re.sub(repl, text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed_files.append(path.as_posix())

          Path('README.md').write_text(
              '# Free Reliable Appliance Pickup\n\n'
              'Live website: https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/\n\n'
              'Free Reliable Appliance Pickup reviews qualifying pickup requests for washers, dryers, refrigerators, freezers, stoves and ovens. Working and reusable appliances receive priority.\n\n'
              '## Main service and information pages\n\n'
              '- https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/service-areas/\n'
              '- https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/how-appliance-pickup-works/\n'
              '- https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/free-pickup-qualification/\n'
              '- https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/washer-dryer-pickup/\n'
              '- https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/refrigerator-pickup/\n\n'
              'The XML sitemap contains the focused set of pages intended for Google indexing. Secondary location templates remain available but are excluded from indexing until individually strengthened.\n',
              encoding='utf-8'
          )

          print(f'Allowed sitemap URLs: {len(allowed)}')
          print(f'Indexable HTML files changed: {len(changed_files)}')
          print(f'Links to excluded template pages converted to text: {removed_links[0]}')
          for f in changed_files:
              print('changed:', f)
          PY

      - name: Remove this one-time workflow and commit cleanup
        shell: bash
        run: |
          rm -f .github/workflows/focused-crawl-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'Focus internal crawl graph on indexable pages'
          git push
