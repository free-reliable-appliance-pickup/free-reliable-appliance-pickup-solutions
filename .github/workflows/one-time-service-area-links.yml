name: One-Time Service Area Links

on:
  push:
    paths:
      - '.github/workflows/one-time-service-area-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strengthen-service-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add finished city pages to service hub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('service-areas/index.html')
          s = p.read_text(encoding='utf-8')
          anchor = '<div class="card"><a href="https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/riverside-county-appliance-pickup/">Riverside County Appliance Pickup</a></div>'
          additions = [
              '<div class="card"><a href="https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/riverside-appliance-pickup/">Riverside Appliance Pickup</a></div>',
              '<div class="card"><a href="https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/palm-desert-appliance-pickup/">Palm Desert Appliance Pickup</a></div>',
              '<div class="card"><a href="https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/san-diego-appliance-pickup/">San Diego Appliance Pickup</a></div>',
              '<div class="card"><a href="https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/stockton-appliance-pickup/">Stockton Appliance Pickup</a></div>',
          ]
          missing = [x for x in additions if x not in s]
          if missing:
              if anchor not in s:
                  raise SystemExit('Riverside County anchor not found')
              s = s.replace(anchor, anchor + '\n' + '\n'.join(missing), 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit finished service hub and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-service-area-links.yml
          git add service-areas/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Link finished California city pages from service hub"
          git push
