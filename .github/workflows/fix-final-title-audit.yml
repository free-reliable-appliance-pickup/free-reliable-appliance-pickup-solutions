name: Fix final title audit issues

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-final-title-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shorten Palm Springs and Rancho Mirage titles
        run: |
          python - <<'PY'
          from pathlib import Path
          fixes = {
              'palm-springs-appliance-pickup/index.html': (
                  'Free Appliance Pickup in Palm Springs | Washer, Dryer & Refrigerator Pickup',
                  'Free Appliance Pickup Palm Springs CA | Appliance Removal'
              ),
              'rancho-mirage-appliance-pickup/index.html': (
                  'Free Appliance Pickup in Rancho Mirage | Washer, Dryer & Refrigerator Pickup',
                  'Free Appliance Pickup Rancho Mirage CA | Appliance Removal'
              )
          }
          for filename, (old, new) in fixes.items():
              p = Path(filename)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'expected title missing in {filename}')
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add palm-springs-appliance-pickup/index.html rancho-mirage-appliance-pickup/index.html
          git diff --cached --quiet || git commit -m "Fix final SEO title issues"
          git push
