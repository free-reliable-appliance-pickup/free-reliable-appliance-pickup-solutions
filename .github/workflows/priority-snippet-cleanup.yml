name: One-Time Priority Snippet Cleanup

on:
  push:
    paths:
      - '.github/workflows/priority-snippet-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean priority page titles and meta descriptions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          updates = {
            'los-angeles-appliance-pickup/index.html': (
              'Free Appliance Pickup Los Angeles CA | Appliance Removal',
              'Free appliance pickup in Los Angeles for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal today.'),
            'orange-county-appliance-pickup/index.html': (
              'Free Appliance Pickup Orange County CA | Appliance Removal',
              'Free appliance pickup in Orange County for qualifying washers, dryers, refrigerators, stoves and freezers. Request appliance removal today.'),
            'portland-appliance-pickup/index.html': (
              'Free Appliance Pickup Portland OR | Appliance Removal',
              'Free appliance pickup in Portland, Oregon for qualifying washers, dryers, refrigerators, stoves and freezers. Request local removal today.'),
            'salem-appliance-pickup/index.html': (
              'Free Appliance Pickup Salem OR | Appliance Removal',
              'Free appliance pickup in Salem, Oregon for qualifying washers, dryers, refrigerators, stoves and freezers. Request local removal today.'),
            'california-appliance-pickup/index.html': (
              'Free Appliance Pickup California | Appliance Removal',
              'Browse California free appliance pickup service areas for qualifying washers, dryers, refrigerators, stoves and freezers. Request pickup online.'),
            'seattle-appliance-pickup/index.html': (
              'Free Appliance Pickup Seattle WA | Appliance Removal',
              'Free appliance pickup in Seattle for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal online.'),
            'vancouver-appliance-pickup/index.html': (
              'Free Appliance Pickup Vancouver WA | Appliance Removal',
              'Free appliance pickup in Vancouver, Washington for qualifying washers, dryers, refrigerators, stoves and freezers. Request local removal.'),
            'phoenix-appliance-pickup/index.html': (
              'Free Appliance Pickup Phoenix AZ | Appliance Removal',
              'Free appliance pickup in Phoenix for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal online.'),
            'las-vegas-appliance-pickup/index.html': (
              'Free Appliance Pickup Las Vegas NV | Appliance Removal',
              'Free appliance pickup in Las Vegas for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal online.'),
            'fontana-appliance-pickup/index.html': (
              'Free Appliance Pickup Fontana CA | Appliance Removal',
              'Free appliance pickup in Fontana for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal online.'),
            'riverside-appliance-pickup/index.html': (
              'Free Appliance Pickup Riverside CA | Appliance Removal',
              'Free appliance pickup in Riverside for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal online.'),
            'salt-lake-city-appliance-pickup/index.html': (
              'Free Appliance Pickup Salt Lake City UT | Removal',
              'Free appliance pickup in Salt Lake City for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal.'),
            'boise-appliance-pickup/index.html': (
              'Free Appliance Pickup Boise ID | Appliance Removal',
              'Free appliance pickup in Boise for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal online.'),
            'service-areas/index.html': (
              'Appliance Pickup Service Areas | Free Reliable Pickup',
              'Browse Free Reliable Appliance Pickup city, county and state service areas and submit a qualifying appliance pickup request online.')
          }

          changed = 0
          for filename, (title, description) in updates.items():
              p = Path(filename)
              if not p.exists():
                  print('Missing:', filename)
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              original = text
              text = re.sub(r'<title>.*?</title>', f'<title>{title}</title>', text, count=1, flags=re.I|re.S)
              text = re.sub(r'<meta\s+name=["\']description["\']\s+content=["\'][^"\']*["\']\s*/?>', f'<meta name="description" content="{description}">', text, count=1, flags=re.I)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed += 1
                  print('Updated:', filename)
          print('Pages updated:', changed)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean priority SEO titles and descriptions'
          git pull --rebase origin main
          git push origin HEAD:main
