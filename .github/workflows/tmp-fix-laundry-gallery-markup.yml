name: Temporary fix laundry gallery markup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-markup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove extra gallery closing tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('washer-dryer-pickup/index.html')
          s=p.read_text()
          old='</figure></div></div><p><a href="#request">Request washer or dryer pickup →</a></p></section>'
          new='</figure></div><p><a href="#request">Request washer or dryer pickup →</a></p></section>'
          if old not in s:
              raise SystemExit('Expected gallery marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit markup fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add washer-dryer-pickup/index.html
          git commit -m "Fix washer dryer gallery markup"
          git push
