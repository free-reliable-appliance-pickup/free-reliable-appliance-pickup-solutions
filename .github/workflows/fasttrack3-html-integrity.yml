name: FastTrack 3 HTML integrity (read only)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - '**/index.html'
      - 'index.html'
      - 'scripts/fasttrack3-html-integrity.py'
      - '.github/workflows/fasttrack3-html-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  html-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report real HTML attributes, IDs and same-page anchor issues
        run: python scripts/fasttrack3-html-integrity.py
