name: Keep Supabase Active

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase keepalive table
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            "https://hutsrafyktcxpgilogdj.supabase.co/rest/v1/keepalive?select=id&limit=1" \
            -o /dev/null
