name: VGM Texas Draft Browser Forms (Read Only)

on:
  pull_request:
    paths:
      - '.github/workflows/vgm-texas-browser-smoke.yml'
      - 'scripts/vgm_texas_browser_smoke.py'
      - 'assets/customer-routing.js'
      - 'assets/paid-removal-choice.js'
      - 'data/cities.json'
      - 'data/market-routing.json'
      - '**/*-pickup/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  texas-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify seven representative TX drafts at desktop/mobile widths
        env:
          VGM_TEXAS_SCREENSHOT_DIR: ${{ runner.temp }}/texas-draft-previews
        run: python scripts/vgm_texas_browser_smoke.py
      - name: Save unpublished Texas mobile/desktop previews for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-draft-visual-previews
          path: ${{ runner.temp }}/texas-draft-previews/*.png
          if-no-files-found: warn
          retention-days: 7
