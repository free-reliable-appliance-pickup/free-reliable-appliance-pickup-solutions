name: Promote Coachella Central Coast Gold Standard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-coachella-central-coast-gold-standard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote Coachella Valley and Central Coast pages
        shell: python
        run: |
          from pathlib import Path
          import re

          cities={
            'palm-springs':('Palm Springs',['cathedral-city','desert-hot-springs','palm-desert'],'Coachella Valley'),
            'palm-desert':('Palm Desert',['rancho-mirage','indian-wells','la-quinta'],'Coachella Valley'),
            'rancho-mirage':('Rancho Mirage',['palm-desert','cathedral-city','palm-springs'],'Coachella Valley'),
            'indian-wells':('Indian Wells',['palm-desert','la-quinta','indio'],'Coachella Valley'),
            'la-quinta':('La Quinta',['indian-wells','indio','palm-desert'],'Coachella Valley'),
            'cathedral-city':('Cathedral City',['palm-springs','rancho-mirage','palm-desert'],'Coachella Valley'),
            'indio':('Indio',['la-quinta','coachella','indian-wells'],'Coachella Valley'),
            'coachella':('Coachella',['indio','la-quinta','palm-desert'],'Coachella Valley'),
            'desert-hot-springs':('Desert Hot Springs',['palm-springs','cathedral-city','palm-desert'],'Coachella Valley'),
            'bermuda-dunes':('Bermuda Dunes',['palm-desert','indio','la-quinta'],'Coachella Valley'),
            'pga-west':('PGA West',['la-quinta','indio','indian-wells'],'Coachella Valley'),
            'coachella-valley':('Coachella Valley',['palm-springs','palm-desert','indio'],'Coachella Valley'),
            'oxnard':('Oxnard',['ventura','santa-barbara','santa-maria'],'Central Coast'),
            'ventura':('Ventura',['oxnard','santa-barbara','santa-maria'],'Central Coast'),
            'santa-barbara':('Santa Barbara',['ventura','oxnard','san-luis-obispo'],'Central Coast'),
            'san-luis-obispo':('San Luis Obispo',['santa-maria','santa-barbara','ventura'],'Central Coast'),
            'santa-maria':('Santa Maria',['san-luis-obispo','santa-barbara','ventura'],'Central Coast'),
            'central-coast':('Central Coast',['oxnard','ventura','santa-barbara'],'Central Coast'),
          }

          appliance=[f'{c}-appliance-pickup' for c in cities]
          laundry_slugs=[c for c in cities if c not in {'bermuda-dunes','pga-west','coachella-valley'}]
          laundry=[f'{c}-washer-dryer-pickup' for c in laundry_slugs]
          failures=[]
          changed=[]

          def dname(slug):
              return cities.get(slug,(slug.replace('-',' ').title(),[],''))[0]

          def parent(kind,region):
              if region=='Coachella Valley':
                  return ('california-washer-dryer-pickup','California Washer & Dryer Pickup') if kind=='laundry' else ('coachella-valley-appliance-pickup','Coachella Valley Appliance Pickup')
              return ('central-coast-washer-dryer-pickup','Central Coast Washer & Dryer Pickup') if kind=='laundry' else ('central-coast-appliance-pickup','Central Coast Appliance Pickup')

          def add_depth(s,slug,name,neighbors,region,kind):
              suffix='washer-dryer-pickup' if kind=='laundry' else 'appliance-pickup'
              service='Washer &amp; Dryer' if kind=='laundry' else 'Appliance'
              links=' · '.join(f'<a href="/{n}-{suffix}/">{dname(n)}</a>' for n in neighbors)
              pslug,pname=parent(kind,region)
              extra=(
                  'For washers, report fill, wash, drain and spin; for dryers, report gas or electric type, tumble and heat.'
                  if kind=='laundry'
                  else
                  'For refrigerators include cooling status; for washers and dryers include tested functions; for stoves and ranges include fuel type and operating condition.'
              )
              block=(
                  f'<section class="local-ranking-depth-20260918 {slug}-{kind}-depth-20260920">'
                  f'<h2>{name} {service} Pickup Access &amp; Local Route Details</h2>'
                  f'<p>{name} pickup requests can involve houses, apartments, condos, rentals, garages and interior rooms. '
                  f'Use the exact pickup address and include floor level, stairs or elevator, gates, parking or loading limits and carrying distance so the removal path can be reviewed before scheduling.</p>'
                  f'<p>Send clear appliance photos and tested condition. {extra} Nearby route pages: {links} · '
                  f'<a href="/{pslug}/">{pname}</a>.</p>'
                  f'</section>'
              )
              req=re.search(r'<section\s+id=["\']request["\'][^>]*>',s,re.I)
              if not req:
                  return None
              return s[:req.start()]+block+s[req.start():]

          for page in appliance+laundry:
              p=Path(page)/'index.html'
              if not p.exists():
                  failures.append(f'{page}: missing page')
                  continue

              slug=page.replace('-washer-dryer-pickup','').replace('-appliance-pickup','')
              name,neighbors,region=cities[slug]
              kind='laundry' if page.endswith('-washer-dryer-pickup') else 'appliance'
              s=p.read_text(encoding='utf-8',errors='replace')
              old=s
              low=s.lower()

              if 'local-ranking-depth-20260918' not in low:
                  m=re.search(r'<section\s+class="([^"]*(?:ranking-depth|local-depth)[^"]*)">',s,re.I)
                  if m:
                      classes=' '.join(dict.fromkeys((m.group(1)+' local-ranking-depth-20260918').split()))
                      s=s[:m.start()]+f'<section class="{classes}">'+s[m.end():]
                  else:
                      s2=add_depth(s,slug,name,neighbors,region,kind)
                      if s2 is None:
                          failures.append(f'{page}: no request section for local depth')
                          continue
                      s=s2

              low=s.lower()
              proof=('major-appliance-pickup-photo' in low or 'real appliance example' in low or 'real-laundry-pickup-' in low)
              if kind=='laundry' and not proof:
                  heading=re.compile(r'<h2>\s*Real Washer\s*&amp;\s*Dryer Photos\s*</h2>',re.I)
                  if heading.search(s) and '<img' in low:
                      s=heading.sub(f'<h2>Real Appliance Examples: {name} Washer &amp; Dryer Pickup</h2>',s,count=1)
                      proof=True

              if not proof:
                  req=re.search(r'<section\s+id=["\']request["\'][^>]*>',s,re.I)
                  if not req:
                      failures.append(f'{page}: no request section for proof')
                      continue
                  if kind=='laundry':
                      proofhtml=(
                          f'<section class="real-appliance-proof"><h2>Real Appliance Examples: {name} Washer &amp; Dryer Pickup</h2>'
                          '<p>Real washer and dryer photos from our appliance work and inventory.</p>'
                          '<div class="photo-grid"><img src="/assets/laundry/real-laundry-pickup-4.jpg" alt="Real washer and dryer pickup example" loading="lazy">'
                          '<img src="/assets/laundry/stacked-laundry-center.jpg" alt="Real stacked washer and dryer example" loading="lazy"></div></section>'
                      )
                  else:
                      proofhtml=(
                          f'<section class="real-appliance-proof"><h2>Real Appliance Example for {name}</h2>'
                          f'<img src="/assets/major-appliance-pickup-photo-2.jpg" alt="Real major appliance pickup example for {name}" loading="lazy" decoding="async" style="max-width:720px;width:100%;height:auto;border-radius:10px"></section>'
                      )
                  s=s[:req.start()]+proofhtml+s[req.start():]

              low=s.lower()
              if 'breadcrumblist' not in low:
                  pslug,pname=parent(kind,region)
                  crumb=(
                      '<script type="application/ld+json">'
                      '{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":['
                      '{"@type":"ListItem","position":1,"name":"Home","item":"https://freereliableappliancepickup.com/"},'
                      f'{{"@type":"ListItem","position":2,"name":"{pname}","item":"https://freereliableappliancepickup.com/{pslug}/"}},'
                      f'{{"@type":"ListItem","position":3,"name":"{name}","item":"https://freereliableappliancepickup.com/{page}/"}}'
                      ']}</script>'
                  )
                  if re.search(r'</head>',s,re.I):
                      s=re.sub(r'</head>',crumb+'</head>',s,count=1,flags=re.I)
                  else:
                      failures.append(f'{page}: missing head for breadcrumb')
                      continue

              low=s.lower()
              checks={
                  'index/follow':bool(re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*index[^"\']*follow',s,re.I)),
                  'canonical':f'https://freereliableappliancepickup.com/{page}/' in low,
                  'title':bool(re.search(r'<title>[^<]{20,}</title>',s,re.I)),
                  'h1':bool(re.search(r'<h1[^>]*>.+?</h1>',s,re.I|re.S)),
                  'depth':'local-ranking-depth-20260918' in low,
                  'proof':('major-appliance-pickup-photo' in low or 'real appliance example' in low or 'real-laundry-pickup-' in low),
                  'branding':'/assets/site-brand.css' in low,
                  'request':('id="request"' in low or "id='request'" in low),
                  'formspree':'https://formspree.io/f/mvzeapzd' in low,
                  'routing':'customer-routing.js' in low,
                  'webpage':('"@type":"webpage"' in low or '"@type": "webpage"' in low),
                  'breadcrumb':'breadcrumblist' in low,
              }
              missing=[k for k,v in checks.items() if not v]
              links=len(re.findall(r'href=["\'](?:\.\./|/)[a-z0-9-]+/',s,re.I))
              if links<3:
                  missing.append('3+ internal links')
              if missing:
                  failures.append(f"{page}: {', '.join(missing)}")
                  continue

              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(page)

          if failures:
              print('FAILURES')
              for f in failures:
                  print('-',f)
              raise SystemExit(1)

          def append(path,slugs):
              p=Path(path)
              lines=[x.strip() for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
              seen=set(lines)
              added=[]
              for slug in slugs:
                  if slug not in seen:
                      lines.append(slug)
                      seen.add(slug)
                      added.append(slug)
              p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
              return added

          aa=append('data/california-seo-model-pages.txt',appliance)
          ww=append('data/california-washer-dryer-seo-model-pages.txt',laundry)
          print('PAGES_CHANGED',len(changed))
          print('APPLIANCE_ADDED',len(aa))
          print('LAUNDRY_ADDED',len(ww))

      - name: Commit Coachella Central Coast promotion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*-appliance-pickup/index.html' '*-washer-dryer-pickup/index.html' data/california-seo-model-pages.txt data/california-washer-dryer-seo-model-pages.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Promote Coachella Central Coast pages to California SEO gold standard"
          git push
