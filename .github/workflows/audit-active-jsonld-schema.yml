name: Audit Active JSON-LD Schema

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - '.github/workflows/audit-active-jsonld-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate active JSON-LD
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html, json, re, sys
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET

          BASE='https://freereliableappliancepickup.com/'
          NS={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          SCRIPT_RE=re.compile(r"<script\b[^>]*type\s*=\s*['\"]application/ld\+json['\"][^>]*>(.*?)</script\s*>",re.I|re.S)

          def file_for(url):
              if url == BASE:
                  return Path('index.html')
              return Path(url[len(BASE):].strip('/'))/'index.html'

          def types(node):
              t=node.get('@type')
              return t if isinstance(t,list) else [t]

          class VisibleText(HTMLParser):
              EXCLUDED={'head','script','style','template','noscript'}
              BLOCK={'p','div','section','h1','h2','h3','h4','br','li','ul','ol','td','tr',
                     'header','footer','main','article','blockquote','table'}
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.skip=0
                  self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag in self.EXCLUDED:
                      self.skip+=1
                  elif not self.skip and tag in self.BLOCK:
                      self.parts.append(' ')
              def handle_endtag(self,tag):
                  if tag in self.EXCLUDED and self.skip:
                      self.skip-=1
                  elif not self.skip and tag in self.BLOCK:
                      self.parts.append(' ')
              def handle_data(self,data):
                  if not self.skip:
                      self.parts.append(data)
              # HTMLParser's default handle_comment ignores comments; attrs never enter handle_data.

          def normalize_text(value):
              return ' '.join(html.unescape(str(value)).split())

          def visible_page_text(value):
              parser=VisibleText()
              parser.feed(value)
              return normalize_text(''.join(parser.parts))

          # Positive: inline markup and whitespace preserve visible sentence.
          assert 'Working washers qualify.' in visible_page_text(
              '<p>Working <strong>washers</strong>   qualify.</p>')
          # Negative: head, attributes, comments and scripts cannot spoof visible FAQ answers.
          assert 'Working washers qualify.' not in visible_page_text(
              '<head><title>Working washers qualify.</title></head>'
              '<p title="Working washers qualify.">Unrelated text</p>'
              '<!-- Working washers qualify. -->'
              '<script>Working washers qualify.</script>')

          # Regression guard for the California laundry pages corrected in PR #1389.
          # Other site pages remain governed by existing JSON-LD checks until separately reviewed.
          VGM_LAUNDRY_FAQ_PAGES={
              'fontana-washer-dryer-pickup', 'upland-washer-dryer-pickup',
              'ontario-washer-dryer-pickup', 'chino-washer-dryer-pickup',
              'chino-hills-washer-dryer-pickup', 'claremont-washer-dryer-pickup',
              'corona-washer-dryer-pickup', 'glendora-washer-dryer-pickup',
              'los-angeles-county-washer-dryer-pickup',
              'orange-county-washer-dryer-pickup', 'pomona-washer-dryer-pickup',
              'redlands-washer-dryer-pickup', 'riverside-washer-dryer-pickup',
              'san-bernardino-washer-dryer-pickup',
              'west-covina-washer-dryer-pickup'
          }

          errors=[]
          checked_pages=0
          checked_scripts=0
          urls=[]
          for sitemap_name in ('sitemap.xml','sitemap-regular-washer-dryer.xml'):
              p=Path(sitemap_name)
              if not p.exists():
                  continue
              root=ET.parse(p).getroot()
              urls.extend(x.text.strip() for x in root.findall('.//s:loc',NS) if x.text)

          for url in sorted(set(urls)):
              if not url.startswith(BASE):
                  continue
              p=file_for(url)
              if not p.exists():
                  continue
              raw=p.read_text(encoding='utf-8',errors='ignore')
              if 'noindex' in raw.lower():
                  continue
              checked_pages += 1
              tm=re.search(r'<title>(.*?)</title>',raw,re.I|re.S)
              title=html.unescape(re.sub(r'\s+',' ',tm.group(1))).strip() if tm else ''

              # For reviewed laundry pages, inspect parsed visible text nodes only.
              # Comments, attributes, scripts, styles and metadata do not count.
              visible_html=visible_page_text(raw) if p.parent.name in VGM_LAUNDRY_FAQ_PAGES else ''
              matches=list(SCRIPT_RE.finditer(raw))
              webpage_count=0
              for m in matches:
                  checked_scripts += 1
                  try:
                      data=json.loads(m.group(1))
                  except Exception as exc:
                      errors.append(f'JSON-LD PARSE ERROR {p}: {exc}')
                      continue

                  stack=[data]
                  while stack:
                      node=stack.pop()
                      if isinstance(node,list):
                          stack.extend(node)
                          continue
                      if not isinstance(node,dict):
                          continue

                      node_types=[str(x).lower() for x in types(node) if x is not None]
                      if 'service' in node_types and 'telephone' in node:
                          errors.append(f'INVALID SERVICE TELEPHONE PROPERTY {p}')

                      if 'faqpage' in node_types and p.parent.name in VGM_LAUNDRY_FAQ_PAGES:
                          for q in node.get('mainEntity', []):
                              if not isinstance(q, dict):
                                  errors.append(f'INVALID FAQ QUESTION {p}')
                                  continue
                              question=html.unescape(str(q.get('name',''))).strip()
                              answer_node=q.get('acceptedAnswer') or {}
                              answer=html.unescape(str(answer_node.get('text',''))).strip() if isinstance(answer_node,dict) else ''
                              if not question or normalize_text(question) not in visible_html:
                                  errors.append(f'FAQ QUESTION NOT VISIBLE {p}: {question!r}')
                              if not answer or normalize_text(answer) not in visible_html:
                                  errors.append(f'FAQ ANSWER NOT VISIBLE {p}: {question!r}')

                      if 'webpage' in node_types:
                          webpage_count += 1
                          if title and node.get('name'):
                              schema_name=html.unescape(str(node.get('name'))).strip()
                              if schema_name != title:
                                  errors.append(f'WEBPAGE NAME/TITLE MISMATCH {p}: {schema_name!r} != {title!r}')

                      stack.extend(node.values())

              if webpage_count > 1:
                  errors.append(f'DUPLICATE WEBPAGE ENTITIES {p}: {webpage_count}')

          if checked_scripts == 0:
              errors.append('NO JSON-LD SCRIPTS DETECTED: audit validated zero structured-data blocks')

          if errors:
              print('\\n'.join(errors))
              sys.exit(1)

          print(f'PASS: {checked_pages} active pages / {checked_scripts} JSON-LD scripts validated')
          PY
