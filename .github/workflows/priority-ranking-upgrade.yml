          sitemap = Path("sitemap.xml")

          namespace = (
              "http://www.sitemaps.org/"
              "schemas/sitemap/0.9"
          )

          ET.register_namespace(
              "",
              namespace
          )

          if sitemap.exists():
              try:
                  tree = ET.parse(
                      sitemap
                  )

                  root = tree.getroot()

              except Exception:
                  root = ET.Element(
                      "{"
                      + namespace
                      + "}urlset"
                  )

                  tree = ET.ElementTree(
                      root
                  )
          else:
              root = ET.Element(
                  "{"
                  + namespace
                  + "}urlset"
              )

              tree = ET.ElementTree(
                  root
              )

          existing = {}

          for url in root.findall(
              "{"
              + namespace
              + "}url"
          ):
              loc = url.find(
                  "{"
                  + namespace
                  + "}loc"
              )

              if (
                  loc is not None
                  and loc.text
              ):
                  existing[
