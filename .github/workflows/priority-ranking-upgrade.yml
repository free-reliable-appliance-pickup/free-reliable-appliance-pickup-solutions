name: Priority Local SEO Upgrade

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  priority-seo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Upgrade priority local SEO
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import date
          import html
          import re
          import xml.etree.ElementTree as ET

          BASE = "https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/"
          TODAY = date.today().isoformat()
          changed = []

          def save(path, text):
              path = Path(path)

              old = (
                  path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
                  if path.exists()
                  else None
              )

              if old != text:
                  path.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  path.write_text(
                      text,
                      encoding="utf-8"
                  )

                  changed.append(str(path))

          def put_in_head(text, value):
              if "</head>" in text.lower():
                  pos = text.lower().find("</head>")
                  return (
                      text[:pos]
                      + value
                      + "\n"
                      + text[pos:]
                  )

              return text

          def set_title(text, title):
              replacement = (
                  "<title>"
                  + html.escape(title)
                  + "</title>"
              )

              if re.search(
                  r"<title\b[^>]*>.*?</title>",
                  text,
                  flags=re.I | re.S
              ):
                  return re.sub(
                      r"<title\b[^>]*>.*?</title>",
                      replacement,
                      text,
                      count=1,
                      flags=re.I | re.S
                  )

              return put_in_head(
                  text,
                  replacement
              )

          def set_description(text, description):
              replacement = (
                  '<meta name="description" content="'
                  + html.escape(
                      description,
                      quote=True
                  )
                  + '">'
              )

              pattern = (
                  r'<meta\s+name=["\']description["\']'
                  r'[^>]*>'
              )

              if re.search(
                  pattern,
                  text,
                  flags=re.I
              ):
                  return re.sub(
                      pattern,
                      replacement,
                      text,
                      count=1,
                      flags=re.I
                  )

              return put_in_head(
                  text,
                  replacement
              )

          def set_robots(text):
              replacement = (
                  '<meta name="robots" '
                  'content="index,follow,'
                  'max-snippet:-1,'
                  'max-image-preview:large,'
                  'max-video-preview:-1">'
              )

              pattern = (
                  r'<meta\s+name=["\']robots["\']'
                  r'[^>]*>'
              )

              if re.search(
                  pattern,
                  text,
                  flags=re.I
              ):
                  return re.sub(
                      pattern,
                      replacement,
                      text,
                      count=1,
                      flags=re.I
                  )

              return put_in_head(
                  text,
                  replacement
              )

          def set_canonical(text, slug):
              url = BASE + slug + "/"

              replacement = (
                  '<link rel="canonical" href="'
                  + url
                  + '">'
              )

              pattern = (
                  r'<link\s+rel=["\']canonical["\']'
                  r'[^>]*>'
              )

              if re.search(
                  pattern,
                  text,
                  flags=re.I
              ):
                  return re.sub(
                      pattern,
                      replacement,
                      text,
                      count=1,
                      flags=re.I
                  )

              return put_in_head(
                  text,
                  replacement
              )

          def local_link(label, slug, current):
              if slug == current:
                  return (
                      "<strong>"
                      + html.escape(label)
                      + "</strong>"
                  )

              target = Path(slug) / "index.html"

              if target.exists():
                  return (
                      '<a href="../'
                      + slug
                      + '/">'
                      + html.escape(label)
                      + "</a>"
                  )

              return html.escape(label)

          def add_local_section(text, data):
              if 'id="priority-local-seo"' in text:
                  return text

              nearby = " · ".join(
                  local_link(
                      label,
                      slug,
                      data["slug"]
                  )
                  for label, slug in data["nearby"]
              )

              neighborhoods = "".join(
                  "<li>"
                  + html.escape(item)
                  + "</li>"
