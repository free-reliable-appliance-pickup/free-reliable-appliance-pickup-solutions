          ]

          for data in pages:
              path = (
                  Path(data["slug"])
                  / "index.html"
              )

              if not path.exists():
                  print(
                      "Skipping missing page:",
                      path
                  )
                  continue

              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              text = set_title(
                  text,
                  data["title"]
              )

              text = set_description(
                  text,
                  data["description"]
              )

              text = set_robots(text)

              text = set_canonical(
                  text,
                  data["slug"]
              )

              text = add_local_section(
                  text,
                  data
              )

              save(
                  path,
                  text
              )

          home = Path("index.html")

          if home.exists():
              text = home.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              if 'id="priority-local-markets"' not in text:
                  block = '''
          <section id="priority-local-markets">

          <h2>Priority Local Appliance Pickup Markets</h2>

          <p>
          Start with one of our strongest local appliance pickup areas.
          Working and reusable appliances receive priority.
          </p>

          <div class="grid">

          <div class="card">
          <h3>
          <a href="los-angeles-appliance-pickup/">
