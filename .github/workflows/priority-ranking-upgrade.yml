              )

              section = f'''
          <section id="priority-local-seo">

          <h2>{html.escape(data["heading"])}</h2>

          <p>
          {html.escape(data["intro"])}
          </p>

          <h3>Local Areas We Review</h3>

          <ul>
          {neighborhoods}
          </ul>

          <p>
          Working and reusable washers, dryers, refrigerators,
          freezers, stoves and ranges receive priority.
          Free pickup is qualification-based and depends on
          condition, access, current demand and scheduling.
          </p>

          <p>
          <strong>Nearby appliance pickup pages:</strong>
          {nearby}
          </p>

          <p>
          <a href="../#request">
          Request Appliance Pickup
          </a>
          </p>

          </section>
          '''

              low = text.lower()

              if "</main>" in low:
                  pos = low.rfind("</main>")

                  return (
                      text[:pos]
                      + section
                      + "\n"
                      + text[pos:]
                  )

              if "</body>" in low:
                  pos = low.rfind("</body>")

                  return (
                      text[:pos]
                      + section
                      + "\n"
                      + text[pos:]
                  )

              return text + section

