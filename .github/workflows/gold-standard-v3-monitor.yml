name: Gold Standard V3 Read-Only Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public site health
        run: python scripts/gold_standard_v3_monitor.py
      - name: Store results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-standard-v3-health
          path: gold-standard-v3-health.json
          retention-days: 14
