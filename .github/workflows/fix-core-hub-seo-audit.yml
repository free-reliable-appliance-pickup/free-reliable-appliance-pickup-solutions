name: Fix core hub SEO audit findings

on:
  push:
    paths:
      - '.github/workflows/fix-core-hub-seo-audit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix hub titles meta descriptions and organization logos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          descriptions = {
              Path('california-appliance-pickup/index.html'): 'Request qualifying free appliance pickup, removal and recycling review across California for washers, dryers, refrigerators, freezers, stoves and ranges.',
              Path('los-angeles-county-appliance-pickup/index.html'): 'Request qualifying free appliance pickup across Los Angeles County for washers, dryers, refrigerators, freezers, stoves and ranges, subject to local coverage.',
              Path('inland-empire-appliance-pickup/index.html'): 'Request qualifying free appliance pickup in the Inland Empire for washers, dryers, refrigerators, freezers, stoves and ranges with local route review.',
              Path('oregon-appliance-pickup/index.html'): 'Request qualifying appliance pickup in Oregon, with approved local pages for Portland, Salem and Keizer and other areas reviewed by route coverage.',
              Path('colorado-appliance-pickup/index.html'): 'Request qualifying appliance pickup in Colorado. Denver and Aurora are established markets; surrounding requests depend on current route coverage.',
              Path('orange-county-appliance-pickup/index.html'): 'Request qualifying free appliance pickup across Orange County, CA for washers, dryers, refrigerators, freezers, stoves and ranges with route review.',
              Path('riverside-county-appliance-pickup/index.html'): 'Request qualifying free appliance pickup across Riverside County, CA for washers, dryers, refrigerators, freezers, stoves and ranges with route review.',
          }

          title_replacements = {
              Path('service-areas/index.html'): (
                  'Nationwide Appliance Pickup Network & Service Areas | Free Reliable Appliance Pickup',
                  'Appliance Pickup Service Areas | Free Reliable Pickup'
              ),
              Path('los-angeles-county-appliance-pickup/index.html'): (
                  'Free Appliance Pickup Los Angeles County | Removal & Recycling',
                  'Free Appliance Pickup Los Angeles County | Removal'
              ),
          }

          logo_paths = {
              Path('california-appliance-pickup/index.html'),
              Path('inland-empire-appliance-pickup/index.html'),
          }
          logo_url = 'https://freereliableappliancepickup.com/file_00000000b7c082308dccc73e5bd3acd2.png'
          provider_prefix = '"provider":{"@type":"Organization","name":"Free Reliable Appliance Pickup",'

          changed = set()
          for path, desc in descriptions.items():
              text = path.read_text()
              new_text, count = re.subn(
                  r'<meta name="description" content="[^"]*">',
                  f'<meta name="description" content="{desc}">',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'Expected one meta description in {path}, found {count}')
              if new_text != text:
                  path.write_text(new_text)
                  changed.add(str(path))

          for path, (old, new) in title_replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected title text not found in {path}')
              new_text = text.replace(old, new)
              if new_text != text:
                  path.write_text(new_text)
                  changed.add(str(path))

          for path in logo_paths:
              text = path.read_text()
              if f'"logo":"{logo_url}"' in text:
                  continue
              if provider_prefix not in text:
                  raise SystemExit(f'Expected provider Organization without logo in {path}')
              text = text.replace(provider_prefix, provider_prefix + f'"logo":"{logo_url}",', 1)
              path.write_text(text)
              changed.add(str(path))

          print('Changed:', ', '.join(sorted(changed)) if changed else 'none')
          PY
      - name: Commit hub audit fixes
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add california-appliance-pickup/index.html los-angeles-county-appliance-pickup/index.html inland-empire-appliance-pickup/index.html oregon-appliance-pickup/index.html colorado-appliance-pickup/index.html orange-county-appliance-pickup/index.html riverside-county-appliance-pickup/index.html service-areas/index.html
          git commit -m 'Fix core hub SEO audit findings'
          git push
