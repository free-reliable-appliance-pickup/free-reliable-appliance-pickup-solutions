name: Test customer routing

on:
  push:
    branches: [main]
    paths:
      - 'assets/customer-routing.js'
      - 'assets/form-traffic-attribution.js'
      - 'eugene-freezer-pickup/index.html'
      - 'eugene-refrigerator-pickup/index.html'
      - 'eugene-washer-dryer-pickup/index.html'
      - 'grants-pass-freezer-pickup/index.html'
      - 'grants-pass-refrigerator-pickup/index.html'
      - 'grants-pass-washer-dryer-pickup/index.html'
      - 'springfield-freezer-pickup/index.html'
      - 'springfield-refrigerator-pickup/index.html'
      - 'springfield-washer-dryer-pickup/index.html'
      - 'data/market-routing.json'
      - 'data/cities.json'
      - 'scripts/test-customer-routing.js'
      - 'scripts/test-form-traffic-attribution.js'
      - '.github/workflows/test-customer-routing.yml'
  pull_request:
    paths:
      - 'assets/customer-routing.js'
      - 'assets/form-traffic-attribution.js'
      - 'eugene-freezer-pickup/index.html'
      - 'eugene-refrigerator-pickup/index.html'
      - 'eugene-washer-dryer-pickup/index.html'
      - 'grants-pass-freezer-pickup/index.html'
      - 'grants-pass-refrigerator-pickup/index.html'
      - 'grants-pass-washer-dryer-pickup/index.html'
      - 'springfield-freezer-pickup/index.html'
      - 'springfield-refrigerator-pickup/index.html'
      - 'springfield-washer-dryer-pickup/index.html'
      - 'data/market-routing.json'
      - 'data/cities.json'
      - 'scripts/test-customer-routing.js'
      - 'scripts/test-form-traffic-attribution.js'
      - '.github/workflows/test-customer-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run customer routing regression tests
        run: node scripts/test-customer-routing.js
      - name: Verify Formspree referral labels without customer data
        run: node scripts/test-form-traffic-attribution.js
