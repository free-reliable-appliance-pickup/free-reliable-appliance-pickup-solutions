name: Trim About page search snippet

on:
  push:
    paths:
      - '.github/workflows/trim-about-search-snippet.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tighten About page title and description
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('about/index.html')
          text = path.read_text()

          old_title = 'About Our Nationwide Appliance Pickup Network | Free Reliable Appliance Pickup'
          new_title = 'About Free Reliable Appliance Pickup | Nationwide Network'
          old_desc = 'Learn how Free Reliable Appliance Pickup operates one nationwide request network with direct operations and local appliance pickup partners in supported markets.'
          new_desc = 'Learn how Free Reliable Appliance Pickup reviews appliance requests and coordinates direct operations or local pickup partners across supported U.S. markets.'

          if old_title not in text:
              raise SystemExit('Expected About title text not found')
          if old_desc not in text:
              raise SystemExit('Expected About description text not found')

          text = text.replace(old_title, new_title)
          text = text.replace(old_desc, new_desc)
          path.write_text(text)
          print('Updated About page search and social snippet metadata')
          PY
      - name: Commit About page snippet cleanup
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add about/index.html
          git commit -m 'Tighten About page search snippet'
          git push
