name: Concentrate Indexable Location Pages

on:
  push:
    paths:
      - '.github/workflows/concentrate-indexable-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce doorway-page footprint
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Keep broad state hubs plus only the few city markets with established
          # direct operating coverage. Recruiting/request-only regions stay useful
          # for customer routing but remain noindex until coverage is established.
          KEEP={
            'california-appliance-pickup','oregon-appliance-pickup','washington-appliance-pickup',
            'arizona-appliance-pickup','colorado-appliance-pickup','nevada-appliance-pickup',
            'utah-appliance-pickup','idaho-appliance-pickup',
            'portland-appliance-pickup','salem-appliance-pickup',
            'denver-appliance-pickup','aurora-appliance-pickup'
          }
          # Informational guides can legitimately end in -appliance-pickup without
          # being geographic doorway pages. Never classify these as location pages.
          INFORMATIONAL={
            'landlord-property-manager-appliance-pickup'
          }
          RECRUITING={
            'inland-empire-appliance-pickup','orange-county-appliance-pickup',
            'riverside-county-appliance-pickup','los-angeles-county-appliance-pickup',
            'central-coast-appliance-pickup','central-valley-appliance-pickup',
            'san-diego-county-appliance-pickup','sf-bay-area-appliance-pickup',
            'phoenix-metro-appliance-pickup','las-vegas-valley-appliance-pickup',
            'puget-sound-appliance-pickup','treasure-valley-appliance-pickup',
            'wasatch-front-appliance-pickup'
          }

          noindexed=[]
          for p in Path('.').glob('*/index.html'):
              slug=p.parent.name
              if not slug.endswith('-appliance-pickup') or slug in KEEP or slug in INFORMATIONAL:
                  continue

              s=p.read_text(encoding='utf-8',errors='ignore')
              old=s
              tag='<meta name="robots" content="noindex, follow">'
              r=re.compile(r'<meta\s+name=["\']robots["\'][^>]*>',re.I)
              if r.search(s):
                  s=r.sub(tag,s,count=1)
              else:
                  h=re.search(r'<head[^>]*>',s,re.I)
                  if h:
                      s=s[:h.end()]+'\n'+tag+s[h.end():]

              g=re.compile(r'<meta\s+name=["\']googlebot["\'][^>]*>',re.I)
              if g.search(s):
                  s=g.sub('<meta name="googlebot" content="noindex, follow">',s,count=1)

              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  noindexed.append(slug)

          # Do not funnel ranking signals from approved/indexable pages into
          # recruiting-only location pages. Keep the visible region names when
          # useful, but remove the hyperlink until real coverage is promoted.
          unlinked=[]
          anchor_re=re.compile(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',re.I|re.S)
          html=[Path('index.html')]+list(Path('.').glob('*/index.html'))
          for p in html:
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8',errors='ignore')
              if 'noindex' in s.lower():
                  continue
              old=s
              def repl(m):
                  href=m.group(1).lower()
                  if any(slug in href for slug in RECRUITING):
                      return m.group(2)
                  return m.group(0)
              s=anchor_re.sub(repl,s)
              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  unlinked.append(str(p))

          # Keep homepage language and structured data aligned with the operational
          # routing model. Regional numbers route requests; they do not by themselves
          # prove established direct service throughout every named recruiting region.
          homepage=Path('index.html')
          if homepage.exists():
              s=homepage.read_text(encoding='utf-8',errors='ignore')
              old=s
              s=s.replace(
                '<p>Priority markets use regional phone numbers and local service pages so customers can submit appliance condition, photos, city or ZIP code and access information to the correct coverage area.</p>',
                '<p>Priority markets use regional request routing and coverage resources so customers can submit appliance condition, photos, city or ZIP code and access information for the correct review path.</p>'
              )
              s=s.replace(
                '<p>Find your regional contact and pickup information below. Availability depends on your city, appliance condition and the local team’s current route.</p>',
                '<p>Find regional request-routing information below. Established local operations are identified separately; other priority regions remain subject to partner availability and request review.</p>'
              )
              s=s.replace(
                '<!-- Southern California coverage --><section id="southern-california"><h2>Southern California Appliance Pickup Areas</h2><p>Browse San Bernardino County, Inland Empire, Riverside County, Orange County, San Gabriel Valley and Los Angeles County service hubs.</p>',
                '<!-- Southern California coverage --><section id="southern-california"><h2>Southern California Appliance Pickup Request Areas</h2><p>These Southern California regions are part of our request-routing network. Listing a region does not mean direct pickup is established in every city; availability is confirmed after review.</p>'
              )
              # Remove region-specific areaServed claims from contactPoint schema.
              # The organization-level U.S. areaServed remains accurate for nationwide request intake.
              s=re.sub(
                r'\{"@type":"ContactPoint","contactType":"customer service","telephone":"(\+1-[0-9-]+)","areaServed":\[[^\]]*\]\}',
                r'{"@type":"ContactPoint","contactType":"pickup request routing","telephone":"\1"}',
                s
              )
              if s!=old:
                  homepage.write_text(s,encoding='utf-8')

          print('NOINDEXED_LOCATION_PAGES',len(noindexed))
          print('\n'.join(noindexed))
          print('UNLINKED_INDEXABLE_PAGES',len(unlinked))
          print('\n'.join(unlinked))
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '*/*.html' || true
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m "Reduce doorway-page footprint and tighten coverage claims"
          git push
