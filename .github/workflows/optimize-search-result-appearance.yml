name: Optimize Search Result Appearance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-search-result-appearance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-search-result-appearance
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Google text, image, WebSite and breadcrumb signals
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path
          import html as htmlmod
          import json
          import re
          import xml.etree.ElementTree as ET

          BASE = 'https://freereliableappliancepickup.com/'
          SITE_NAME = 'Free Reliable Appliance Pickup'
          LOGO = BASE + 'file_00000000b7c082308dccc73e5bd3acd2.png'
          NS = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}

          def file_for(url):
              if url == BASE:
                  return Path('index.html'), ''
              slug = url[len(BASE):].strip('/')
              return Path(slug) / 'index.html', slug

          def get_attr(tag, attr):
              m = re.search(r'\b' + re.escape(attr) + r'\s*=\s*(["\'])(.*?)\1', tag, re.I | re.S)
              return htmlmod.unescape(m.group(2).strip()) if m else ''

          def find_meta(raw, *, name=None, prop=None):
              for tag in re.findall(r'<meta\b[^>]*>', raw, re.I | re.S):
                  if name and get_attr(tag, 'name').lower() == name.lower():
                      return tag
                  if prop and get_attr(tag, 'property').lower() == prop.lower():
                      return tag
              return None

          def find_link(raw, rel):
              for tag in re.findall(r'<link\b[^>]*>', raw, re.I | re.S):
                  if rel.lower() in get_attr(tag, 'rel').lower().split():
                      return tag
              return None

          def insert_head(raw, block):
              if re.search(r'</head\s*>', raw, re.I):
                  return re.sub(r'</head\s*>', block.rstrip() + '\n</head>', raw, count=1, flags=re.I)
              return raw

          root = ET.parse('sitemap.xml').getroot()
          urls = [x.text.strip() for x in root.findall('.//s:loc', NS) if x.text and x.text.strip().startswith(BASE)]
          changed = []

          for url in urls:
              p, slug = file_for(url)
              if not p.exists():
                  continue

              raw = p.read_text(encoding='utf-8', errors='ignore')
              original = raw

              title_match = re.search(r'<title\b[^>]*>(.*?)</title\s*>', raw, re.I | re.S)
              title = htmlmod.unescape(re.sub(r'\s+', ' ', title_match.group(1)).strip()) if title_match else SITE_NAME

              desc_tag = find_meta(raw, name='description')
              description = get_attr(desc_tag, 'content') if desc_tag else ''

              canonical_tag = find_link(raw, 'canonical')
              canonical = get_attr(canonical_tag, 'href') if canonical_tag else url

              robot_tag = find_meta(raw, name='robots')
              robot = '<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">'
              if robot_tag:
                  raw = raw.replace(robot_tag, robot, 1)
              else:
                  raw = insert_head(raw, robot)

              if not find_link(raw, 'icon'):
                  raw = insert_head(raw, '<link rel="icon" type="image/png" href="' + LOGO + '">')

              existing_og_image = find_meta(raw, prop='og:image')
              page_num = 1 + (sum(ord(c) for c in slug) % 3 if slug else 1)
              image = get_attr(existing_og_image, 'content') if existing_og_image else BASE + f'assets/major-appliance-pickup-photo-{page_num}.jpg'

              additions = []
              if not find_meta(raw, prop='og:site_name'):
                  additions.append(f'<meta property="og:site_name" content="{SITE_NAME}">')
              if not find_meta(raw, prop='og:type'):
                  additions.append('<meta property="og:type" content="website">')
              if not find_meta(raw, prop='og:url'):
                  additions.append(f'<meta property="og:url" content="{htmlmod.escape(canonical, quote=True)}">')
              if not find_meta(raw, prop='og:title'):
                  additions.append(f'<meta property="og:title" content="{htmlmod.escape(title, quote=True)}">')
              if description and not find_meta(raw, prop='og:description'):
                  additions.append(f'<meta property="og:description" content="{htmlmod.escape(description, quote=True)}">')
              if not existing_og_image:
                  additions.append(f'<meta property="og:image" content="{htmlmod.escape(image, quote=True)}">')
                  additions.append('<meta property="og:image:alt" content="Real major household appliance handled by Free Reliable Appliance Pickup">')
              if not find_meta(raw, name='twitter:card'):
                  additions.append('<meta name="twitter:card" content="summary_large_image">')
              if not find_meta(raw, name='twitter:image'):
                  additions.append(f'<meta name="twitter:image" content="{htmlmod.escape(image, quote=True)}">')
              if additions:
                  raw = insert_head(raw, '\n'.join(additions))

              # Every active page should explicitly connect to the domain-level WebSite entity.
              if '#website' not in raw.lower():
                  webpage = {
                      '@context': 'https://schema.org',
                      '@type': 'WebPage',
                      '@id': canonical + '#webpage',
                      'url': canonical,
                      'name': title,
                      'isPartOf': {'@id': BASE + '#website'},
                      'primaryImageOfPage': {'@type': 'ImageObject', 'url': image},
                  }
                  if description:
                      webpage['description'] = description
                  raw = insert_head(raw, '<script type="application/ld+json">' + json.dumps(webpage, ensure_ascii=False, separators=(',', ':')) + '</script>')

              # Active market pages get a simple breadcrumb trail even when they were added later.
              if slug.endswith('-appliance-pickup') and 'breadcrumb' not in raw.lower():
                  crumbs = {
                      '@context': 'https://schema.org',
                      '@type': 'BreadcrumbList',
                      'itemListElement': [
                          {'@type': 'ListItem', 'position': 1, 'name': 'Home', 'item': BASE},
                          {'@type': 'ListItem', 'position': 2, 'name': 'Service Areas', 'item': BASE + 'service-areas/'},
                          {'@type': 'ListItem', 'position': 3, 'name': title, 'item': canonical},
                      ],
                  }
                  raw = insert_head(raw, '<script type="application/ld+json">' + json.dumps(crumbs, ensure_ascii=False, separators=(',', ':')) + '</script>')

              if slug == '' and not re.search(r'"@type"\s*:\s*"WebSite"', raw, re.I):
                  website = {
                      '@context': 'https://schema.org',
                      '@type': 'WebSite',
                      '@id': BASE + '#website',
                      'url': BASE,
                      'name': SITE_NAME,
                      'alternateName': ['Reliable Appliance Pickup', 'Free Reliable Appliance Pickup & Removal'],
                  }
                  raw = insert_head(raw, '<script type="application/ld+json">' + json.dumps(website, separators=(',', ':')) + '</script>')

              if raw != original:
                  p.write_text(raw, encoding='utf-8')
                  changed.append(str(p))

          print('ACTIVE_SITEMAP_URLS', len(urls))
          print('UPDATED_PAGES', len(changed))
          for item in changed:
              print(' -', item)
          PY

          git add index.html '*/index.html'
          if git diff --cached --quiet; then
            echo 'No page changes needed.'
            exit 0
          fi

          git commit -m "Normalize active pages for Google search appearance"
          git pull --rebase origin main || true
          git push origin HEAD:main
