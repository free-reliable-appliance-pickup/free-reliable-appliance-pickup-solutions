name: Finish priority city SEO

on:
  push:
    paths:
      - '.github/workflows/finish-priority-seo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish-priority-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve remaining priority pages
        shell: python
        run: |
          from pathlib import Path
          import json, re

          root = Path('.')
          base = 'https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/'

          pages = {
              'salem-appliance-pickup/index.html': {
                  'city':'Salem','state':'Oregon','phone':'503-868-4455','tel':'+15038684455','image':'assets/major-appliance-pickup-photo-2.jpg',
                  'local':'Salem, West Salem, Keizer, Turner, Stayton, Silverton, Dallas, Monmouth, Independence and Woodburn',
                  'statepage':'oregon-appliance-pickup/'},
              'aurora-appliance-pickup/index.html': {
                  'city':'Aurora','state':'Colorado','phone':'720-604-7498','tel':'+17206047498','image':'assets/major-appliance-pickup-photo-1.jpg',
                  'local':'Central Aurora, Aurora Hills, Meadow Hills, Heather Gardens, Seven Hills, Southlands, Aurora Highlands and nearby Denver-metro communities',
                  'statepage':'colorado-appliance-pickup/'},
              'los-angeles-appliance-pickup/index.html': {
                  'city':'Los Angeles','state':'California','phone':'310-774-4304','tel':'+13107744304','image':'assets/major-appliance-pickup-photo-3.jpg',
                  'local':'Hollywood, North Hollywood, Van Nuys, Sherman Oaks, Northridge, Koreatown, Silver Lake, Echo Park, West Los Angeles, Mar Vista and Venice',
                  'statepage':'california-appliance-pickup/'},
              'palm-desert-appliance-pickup/index.html': {
                  'city':'Palm Desert','state':'California','phone':'909-375-6685','tel':'+19093756685','image':'assets/major-appliance-pickup-photo-2.jpg',
                  'local':'Palm Desert, Rancho Mirage, Indian Wells, La Quinta, Bermuda Dunes, Cathedral City and nearby Coachella Valley communities',
                  'statepage':'california-appliance-pickup/'},
              'palm-springs-appliance-pickup/index.html': {
                  'city':'Palm Springs','state':'California','phone':'909-375-6685','tel':'+19093756685','image':'assets/major-appliance-pickup-photo-3.jpg',
                  'local':'Palm Springs, Cathedral City, Rancho Mirage, Palm Desert and nearby Coachella Valley communities',
                  'statepage':'california-appliance-pickup/'},
              'rancho-mirage-appliance-pickup/index.html': {
                  'city':'Rancho Mirage','state':'California','phone':'909-375-6685','tel':'+19093756685','image':'assets/major-appliance-pickup-photo-1.jpg',
                  'local':'Rancho Mirage, Palm Desert, Palm Springs, Cathedral City, Indian Wells and nearby Coachella Valley communities',
                  'statepage':'california-appliance-pickup/'},
              'la-quinta-appliance-pickup/index.html': {
                  'city':'La Quinta','state':'California','phone':'909-375-6685','tel':'+19093756685','image':'assets/major-appliance-pickup-photo-2.jpg',
                  'local':'La Quinta, Indian Wells, Palm Desert, Bermuda Dunes, Indio and nearby Coachella Valley communities',
                  'statepage':'california-appliance-pickup/'},
              'cathedral-city-appliance-pickup/index.html': {
                  'city':'Cathedral City','state':'California','phone':'909-375-6685','tel':'+19093756685','image':'assets/major-appliance-pickup-photo-3.jpg',
                  'local':'Cathedral City, Palm Springs, Rancho Mirage, Palm Desert and nearby Coachella Valley communities',
                  'statepage':'california-appliance-pickup/'},
              'indio-appliance-pickup/index.html': {
                  'city':'Indio','state':'California','phone':'909-375-6685','tel':'+19093756685','image':'assets/major-appliance-pickup-photo-1.jpg',
                  'local':'Indio, La Quinta, Bermuda Dunes, Palm Desert, Coachella and nearby eastern Coachella Valley communities',
                  'statepage':'california-appliance-pickup/'},
              'stockton-appliance-pickup/index.html': {
                  'city':'Stockton','state':'California','phone':'310-774-4304','tel':'+13107744304','image':'assets/major-appliance-pickup-photo-2.jpg',
                  'local':'Stockton and nearby San Joaquin County communities, with exact coverage confirmed by address or ZIP code',
                  'statepage':'california-appliance-pickup/'}
          }

          changed = []
          for rel, d in pages.items():
              p = root / rel
              if not p.exists():
                  print('skip missing', rel)
                  continue
              html = p.read_text(encoding='utf-8')
              original = html
              page_url = base + rel.replace('index.html','')
              image_url = base + d['image']

              # Replace logo-only OG image with a real appliance image where applicable.
              html = re.sub(
                  r'<meta property="og:image" content="[^"]*free-reliable-appliance-pickup-logo\.svg">',
                  f'<meta property="og:image" content="{image_url}">', html, count=1)

              if 'property="og:image"' not in html:
                  html = html.replace('</head>', f'<meta property="og:image" content="{image_url}">\n<meta property="og:image:alt" content="Real major household appliance handled by Free Reliable Appliance Pickup in {d["city"]}">\n</head>', 1)

              if 'name="twitter:card"' not in html:
                  html = html.replace('</head>', f'<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:image" content="{image_url}">\n</head>', 1)

              marker = 'priority-seo-finish-2026'
              if marker not in html:
                  image_schema = {
                      '@context':'https://schema.org',
                      '@type':'ImageObject',
                      'contentUrl':image_url,
                      'url':image_url,
                      'caption':f'Real major household appliance example for Free Reliable Appliance Pickup service information in {d["city"]}, {d["state"]}.',
                      'representativeOfPage':True
                  }
                  schema_tag = '<script type="application/ld+json">' + json.dumps(image_schema, separators=(',',':')) + '</script>\n'
                  html = html.replace('</head>', schema_tag + '</head>', 1)

                  section = f'''\n<section id="{marker}" class="priority-city-details" style="max-width:1050px;margin:22px auto;padding:24px 20px;background:#fff;border:1px solid #d7e5dc;border-radius:12px">\n<h2>Free Appliance Pickup Details for {d['city']}, {d['state']}</h2>\n<p>We review qualifying appliance pickup requests in {d['local']}. Working and reusable washers, dryers, refrigerators, freezers, stoves and ranges receive priority. Free pickup is qualification-based and depends on appliance condition, access, current demand, route coverage and scheduling.</p>\n<h3>Send Photos and Condition Details</h3>\n<p>For faster review, send one clear full-appliance photo plus the model label when available. For refrigerators and freezers, include an interior photo and tell us whether the unit maintains temperature. For washers and dryers, describe each machine separately and tell us whether the washer fills, drains and spins and whether the dryer heats and tumbles.</p>\n<h3>Pickup Access Matters</h3>\n<p>Tell us whether the appliance is in a garage, driveway, first floor, upper floor, basement or outside. Include stairs, elevators, narrow doors, tight hallways, gates and parking or loading restrictions before scheduling.</p>\n<p><strong>Call or text <a href="tel:{d['tel']}">{d['phone']}</a></strong> between 8:00 AM and 8:00 PM, Monday through Sunday. You can also review <a href="{base}{d['statepage']}">{d['state']} appliance pickup service areas</a>, <a href="{base}free-pickup-qualification/">free pickup qualifications</a>, and <a href="{base}how-appliance-pickup-works/">how appliance pickup works</a>.</p>\n<figure style="margin:24px 0 0;max-width:720px">\n<img src="{base}{d['image']}" alt="Real major household appliance example for appliance pickup in {d['city']}, {d['state']}" decoding="async" style="width:100%;height:auto;border-radius:10px">\n<figcaption>Real appliance photo from our work and inventory. It is not a stock image and does not guarantee pickup; every request is reviewed for eligibility.</figcaption>\n</figure>\n</section>\n'''
                  if '</main>' in html:
                      html = html.replace('</main>', section + '</main>', 1)
                  elif '<footer' in html:
                      html = html.replace('<footer', section + '<footer', 1)
                  else:
                      html = html.replace('</body>', section + '</body>', 1)

              if html != original:
                  p.write_text(html, encoding='utf-8')
                  changed.append(rel)
                  print('updated', rel)
              else:
                  print('no change', rel)

          print('changed pages:', len(changed))

      - name: Commit improvements
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add salem-appliance-pickup aurora-appliance-pickup los-angeles-appliance-pickup palm-desert-appliance-pickup palm-springs-appliance-pickup rancho-mirage-appliance-pickup la-quinta-appliance-pickup cathedral-city-appliance-pickup indio-appliance-pickup stockton-appliance-pickup 2>/dev/null || true
          git commit -m "Finish remaining priority city SEO and image signals"
          git push
