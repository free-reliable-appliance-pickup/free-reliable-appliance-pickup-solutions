name: Audit Competitor Gap Strategy

on:
  push:
    branches: [main]
    paths:
      - '**/index.html'
      - 'sitemap.xml'
      - 'scripts/audit-competitor-gap.py'
      - '.github/workflows/audit-competitor-gap.yml'
  pull_request:
    paths:
      - '**/index.html'
      - 'sitemap.xml'
      - 'scripts/audit-competitor-gap.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Score priority city pages against competitor-gap playbook
        run: python3 scripts/audit-competitor-gap.py
