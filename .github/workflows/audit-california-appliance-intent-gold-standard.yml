name: Audit California People-First SEO Standard

on:
  push:
    branches: [main]
    paths:
      - 'data/california-appliance-intent-gold-standard-pages.txt'
      - 'data/california-appliance-intent-priority-city-pages.txt'
      - 'southern-california-washer-dryer-pickup/**'
      - 'southern-california-refrigerator-pickup/**'
      - 'southern-california-freezer-pickup/**'
      - 'southern-california-stove-oven-pickup/**'
      - 'washer-dryer-pickup/**'
      - 'refrigerator-pickup/**'
      - 'freezer-pickup/**'
      - 'stove-oven-pickup/**'
      - 'california-appliance-pickup/**'
      - 'san-gabriel-valley-appliance-pickup/**'
      - 'inland-empire-appliance-pickup/**'
      - 'orange-county-appliance-pickup/**'
      - 'riverside-county-appliance-pickup/**'
      - 'san-bernardino-county-appliance-pickup/**'
      - 'los-angeles-county-appliance-pickup/**'
      - 'southern-california-appliance-pickup/**'
      - '*-appliance-pickup/**'
      - 'sitemap.xml'
      - '.github/workflows/audit-california-appliance-intent-gold-standard.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit California people-first SEO layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys, xml.etree.ElementTree as ET

          BASE='https://freereliableappliancepickup.com/'
          gold_slugs=[x.strip() for x in Path('data/california-appliance-intent-gold-standard-pages.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          priority_city_slugs=[x.strip() for x in Path('data/california-appliance-intent-priority-city-pages.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          regional_hubs=[
            'san-gabriel-valley-appliance-pickup',
            'inland-empire-appliance-pickup',
            'orange-county-appliance-pickup',
            'riverside-county-appliance-pickup',
            'san-bernardino-county-appliance-pickup',
            'los-angeles-county-appliance-pickup',
          ]
          socal_parent_slug='southern-california-appliance-pickup'
          failures=[]
          seen_titles={}
          seen_h1={}

          root=ET.parse('sitemap.xml').getroot()
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          sitemap_urls={x.text.strip() for x in root.findall('.//sm:loc',ns) if x.text}

          def clean_text(s):
              s=re.sub(r'<script\b[\s\S]*?</script>',' ',s,flags=re.I)
              s=re.sub(r'<style\b[\s\S]*?</style>',' ',s,flags=re.I)
              s=re.sub(r'<[^>]+>',' ',s)
              return ' '.join(s.split())

          def page_data(slug):
              p=Path(slug)/'index.html'
              if not p.exists():
                  failures.append(f'{slug}: missing page')
                  return None
              raw=p.read_text(encoding='utf-8',errors='replace')
              low=raw.lower()
              title_m=re.search(r'<title>(.*?)</title>',raw,re.I|re.S)
              title=clean_text(title_m.group(1)) if title_m else ''
              desc_m=re.search(r'<meta\s+name=["\']description["\']\s+content=["\']([^"\']*)',raw,re.I)
              desc=desc_m.group(1).strip() if desc_m else ''
              h1s=re.findall(r'<h1\b[^>]*>(.*?)</h1>',raw,re.I|re.S)
              h1=clean_text(h1s[0]) if len(h1s)==1 else ''
              internal=set()
              for href in re.findall(r'href=["\']([^"\']+)["\']',raw,re.I):
                  if href.startswith('/'):
                      internal.add(href.split('#',1)[0].split('?',1)[0].rstrip('/') or '/')
              dated_classes=re.findall(r'class=["\'][^"\']*\b20\d{6}\b[^"\']*["\']',raw,re.I)
              text=clean_text(raw).lower()
              return dict(raw=raw,low=low,title=title,desc=desc,h1s=h1s,h1=h1,internal=internal,dated_classes=dated_classes,text=text)

          def common_checks(slug, d, require_parent=True):
              expected=BASE+slug+'/'
              robots=re.search(r'<meta\b[^>]*\bname=["\']robots["\'][^>]*>',d['raw'],re.I)
              if robots and 'noindex' in robots.group(0).lower():
                  failures.append(f'{slug}: noindex')
              canonicals=re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',d['raw'],re.I)
              if canonicals != [expected]:
                  failures.append(f'{slug}: canonical mismatch {canonicals}')
              if not d['title']:
                  failures.append(f'{slug}: missing title')
              if not d['desc']:
                  failures.append(f'{slug}: missing meta description')
              if len(d['h1s']) != 1:
                  failures.append(f'{slug}: expected one H1, found {len(d["h1s"])}')
              if d['title']:
                  if d['title'] in seen_titles:
                      failures.append(f'{slug}: duplicate title with {seen_titles[d["title"]]}')
                  seen_titles[d['title']]=slug
              if d['h1']:
                  if d['h1'] in seen_h1:
                      failures.append(f'{slug}: duplicate H1 with {seen_h1[d["h1"]]}')
                  seen_h1[d['h1']]=slug
              for required in ['"@type":"Service"','"@type":"BreadcrumbList"','"@type":"WebPage"']:
                  if required.lower() not in d['low'].replace(' ',''):
                      failures.append(f'{slug}: missing schema {required}')
              if 'https://formspree.io/f/mvzeapzd' not in d['raw']:
                  failures.append(f'{slug}: missing customer request form endpoint')
              if not re.search(r'<img\b[^>]+alt=["\'][^"\']+["\']',d['raw'],re.I):
                  failures.append(f'{slug}: missing meaningful image alt text')
              if d['dated_classes']:
                  failures.append(f'{slug}: dated SEO class marker still present')
              for phrase in ['this page owns','searches belong','search intent','intent owner','primary page for local searches']:
                  if phrase in d['text']:
                      failures.append(f'{slug}: search-engine-facing wording present: {phrase}')
              if len(d['internal']) > 85:
                  failures.append(f'{slug}: {len(d["internal"])} unique internal targets exceeds link budget 85')
              if expected not in sitemap_urls:
                  failures.append(f'{slug}: missing from sitemap')
              if require_parent and not any(f'/{hub}/' in d['low'] for hub in regional_hubs+[socal_parent_slug]):
                  failures.append(f'{slug}: missing regional parent link')

          for slug in gold_slugs:
              d=page_data(slug)
              if not d: continue
              common_checks(slug,d,require_parent=True)
              if 'free-pickup-qualification/' not in d['low']:
                  failures.append(f'{slug}: missing qualification guide link')
              if 'aria-label="breadcrumb"' not in d['low'] and 'seo-breadcrumb' not in d['low']:
                  failures.append(f'{slug}: missing visible breadcrumb')
              for field_name in ['name="brand_model"','name="preferred_window"']:
                  if field_name not in d['low']:
                      failures.append(f'{slug}: missing intake field {field_name}')

          # Regional hubs should route users to cities and useful appliance guides,
          # not repeat every city/appliance keyword on every page.
          for slug in regional_hubs:
              d=page_data(slug)
              if not d: continue
              common_checks(slug,d,require_parent=False)
              city_links=[x for x in d['internal'] if x.endswith('-appliance-pickup') and x.strip('/') != slug]
              if len(city_links) < 3:
                  failures.append(f'{slug}: fewer than 3 useful city/service links')
              if slug not in ['san-bernardino-county-appliance-pickup','los-angeles-county-appliance-pickup']:
                  if f'/{socal_parent_slug}/' not in d['low']:
                      failures.append(f'{slug}: missing Southern California parent link')

          # Priority city pages: protect clarity and prevent old programmatic footprints.
          for slug in priority_city_slugs:
              d=page_data(slug)
              if not d: continue
              common_checks(slug,d,require_parent=True)
              if len(d['text'].split()) > 2200:
                  failures.append(f'{slug}: page exceeds 2200 visible words; review for repetition')
              if 'tel:' not in d['low'] and 'sms:' not in d['low']:
                  failures.append(f'{slug}: missing direct contact path')

          # Parent hierarchy should remain crawlable without forcing every child to
          # cross-link to every sibling.
          ca=Path('california-appliance-pickup/index.html').read_text(encoding='utf-8',errors='replace').lower()
          if socal_parent_slug+'/' not in ca:
              failures.append('california-appliance-pickup: missing Southern California parent link')
          socal=Path(socal_parent_slug)/'index.html'
          if socal.exists():
              low=socal.read_text(encoding='utf-8',errors='replace').lower()
              for slug in regional_hubs:
                  if slug+'/' not in low:
                      failures.append(f'{socal_parent_slug}: missing regional child link {slug}')
          else:
              failures.append(f'{socal_parent_slug}: missing parent page')

          print('GOLD_INTENT_PAGES',len(gold_slugs))
          print('REGIONAL_HUBS',len(regional_hubs))
          print('PRIORITY_CITY_PAGES',len(priority_city_slugs))
          if failures:
              print('FAILURES')
              for item in failures:
                  print('-',item)
              sys.exit(1)
          print('PASS: California people-first SEO layer meets technical, hierarchy, conversion, uniqueness and anti-template requirements.')
          PY
