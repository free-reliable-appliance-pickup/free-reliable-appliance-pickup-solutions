name: Audit California Appliance Intent Gold Standard

on:
  push:
    branches: [main]
    paths:
      - 'data/california-appliance-intent-gold-standard-pages.txt'
      - 'data/california-appliance-intent-priority-city-pages.txt'
      - 'southern-california-washer-dryer-pickup/**'
      - 'southern-california-refrigerator-pickup/**'
      - 'southern-california-freezer-pickup/**'
      - 'southern-california-stove-oven-pickup/**'
      - 'washer-dryer-pickup/**'
      - 'refrigerator-pickup/**'
      - 'freezer-pickup/**'
      - 'stove-oven-pickup/**'
      - 'california-appliance-pickup/**'
      - 'southern-california-appliance-pickup/**'
      - 'pomona-appliance-pickup/**'
      - 'huntington-beach-appliance-pickup/**'
      - 'irvine-appliance-pickup/**'
      - 'pasadena-appliance-pickup/**'
      - 'rancho-cucamonga-appliance-pickup/**'
      - 'chino-appliance-pickup/**'
      - 'riverside-appliance-pickup/**'
      - 'ontario-appliance-pickup/**'
      - 'west-covina-appliance-pickup/**'
      - 'mission-viejo-appliance-pickup/**'
      - 'costa-mesa-appliance-pickup/**'
      - 'rowland-heights-appliance-pickup/**'
      - 'sitemap.xml'
      - '.github/workflows/audit-california-appliance-intent-gold-standard.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit California appliance-intent layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys, xml.etree.ElementTree as ET

          BASE='https://freereliableappliancepickup.com/'
          list_file=Path('data/california-appliance-intent-gold-standard-pages.txt')
          slugs=[x.strip() for x in list_file.read_text(encoding='utf-8').splitlines() if x.strip()]
          priority_city_file=Path('data/california-appliance-intent-priority-city-pages.txt')
          priority_city_slugs=[x.strip() for x in priority_city_file.read_text(encoding='utf-8').splitlines() if x.strip()]
          failures=[]
          seen_titles={}
          seen_desc={}
          seen_h1={}

          root=ET.parse('sitemap.xml').getroot()
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          sitemap_urls={x.text.strip() for x in root.findall('.//sm:loc',ns) if x.text}

          all_socal=set(slugs)
          socal_parent_slug='southern-california-appliance-pickup'

          def text_value(pattern, s):
              m=re.search(pattern,s,re.I|re.S)
              return re.sub(r'<[^>]+>',' ',m.group(1)).strip() if m else ''

          for slug in slugs:
              p=Path(slug)/'index.html'
              if not p.exists():
                  failures.append(f'{slug}: missing page')
                  continue
              s=p.read_text(encoding='utf-8',errors='replace')
              low=s.lower()
              expected=BASE+slug+'/'

              robots=re.search(r'<meta\b[^>]*\bname=["\']robots["\'][^>]*>',s,re.I)
              if robots and 'noindex' in robots.group(0).lower():
                  failures.append(f'{slug}: noindex')

              canonicals=re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',s,re.I)
              if canonicals != [expected]:
                  failures.append(f'{slug}: canonical mismatch {canonicals}')

              title=text_value(r'<title>(.*?)</title>',s)
              desc=(re.search(r'<meta\s+name=["\']description["\']\s+content=["\']([^"\']*)',s,re.I) or [None,''])[1].strip()
              h1s=re.findall(r'<h1\b[^>]*>(.*?)</h1>',s,re.I|re.S)
              h1=' '.join(re.sub(r'<[^>]+>',' ',h1s[0]).split()) if len(h1s)==1 else ''

              if not title: failures.append(f'{slug}: missing title')
              if not desc: failures.append(f'{slug}: missing meta description')
              if len(h1s)!=1: failures.append(f'{slug}: expected one H1, found {len(h1s)}')

              for label,val,seen in [('title',title,seen_titles),('meta description',desc,seen_desc),('H1',h1,seen_h1)]:
                  if val:
                      if val in seen: failures.append(f'{slug}: duplicate {label} with {seen[val]}')
                      seen[val]=slug

              for required in ['"@type":"Service"','"@type":"FAQPage"','"@type":"BreadcrumbList"','"@type":"WebPage"']:
                  if required.lower() not in low.replace(' ',''):
                      failures.append(f'{slug}: missing schema {required}')
              for breadcrumb_parent in ['https://freereliableappliancepickup.com/california-appliance-pickup/','https://freereliableappliancepickup.com/southern-california-appliance-pickup/']:
                  if breadcrumb_parent not in s:
                      failures.append(f'{slug}: missing California breadcrumb parent {breadcrumb_parent}')

              if 'https://formspree.io/f/mvzeapzd' not in s:
                  failures.append(f'{slug}: missing customer request form endpoint')
              if 'free-pickup-qualification/' not in low:
                  failures.append(f'{slug}: missing qualification link')
              if 'socal-trust-strip-20260923' not in low:
                  failures.append(f'{slug}: missing trust strip')
              for trust_phrase in ['free to submit','no account required','photo-first review','local route review']:
                  if trust_phrase not in low:
                      failures.append(f'{slug}: missing trust signal {trust_phrase}')
              if 'how fast can' not in low:
                  failures.append(f'{slug}: missing pickup-timing FAQ')
              if 'socal-network-model-20260923' not in low:
                  failures.append(f'{slug}: missing network-model section')
              if 'socal-pickup-prep-20260923' not in low:
                  failures.append(f'{slug}: missing appliance-specific pickup preparation')
              if 'socal-request-flow-20260923' not in low:
                  failures.append(f'{slug}: missing request flow')
              for field_name in ['name="brand_model"','name="preferred_window"']:
                  if field_name not in low:
                      failures.append(f'{slug}: missing intake field {field_name}')
              for network_phrase in ['independent local pickup professionals','company-owned storefront or local branch']:
                  if network_phrase not in low:
                      failures.append(f'{slug}: missing network transparency {network_phrase}')

              imgs=re.findall(r'<img\b[^>]*>',s,re.I)
              if not imgs:
                  failures.append(f'{slug}: missing image')
              else:
                  hero=imgs[0].lower()
                  if 'alt=' not in hero or 'width=' not in hero or 'height=' not in hero:
                      failures.append(f'{slug}: hero missing alt/width/height')

              internal=set(re.findall(r'href=["\'](?:https://freereliableappliancepickup\.com)?/([^"\'#?]+)/?',s,re.I))
              if len(internal)<10:
                  failures.append(f'{slug}: fewer than 10 useful internal destinations')

              if socal_parent_slug+'/' not in low:
                  failures.append(f'{slug}: missing link to Southern California parent')
              for other in sorted(all_socal-{slug}):
                  if other+'/' not in low:
                      failures.append(f'{slug}: missing cross-link to {other}')

              if expected not in sitemap_urls:
                  failures.append(f'{slug}: missing from sitemap')

          ca=Path('california-appliance-pickup/index.html').read_text(encoding='utf-8',errors='replace').lower()
          if socal_parent_slug+'/' not in ca:
              failures.append('california-appliance-pickup: missing link to Southern California parent')
          for slug in slugs:
              if slug+'/' not in ca:
                  failures.append(f'california-appliance-pickup: missing link to {slug}')

          socal_parent=(Path(socal_parent_slug)/'index.html').read_text(encoding='utf-8',errors='replace').lower()
          for slug in slugs:
              if slug+'/' not in socal_parent:
                  failures.append(f'{socal_parent_slug}: missing child link to {slug}')
          for trust_phrase in ['free to submit','no account required','photo-first review']:
              if trust_phrase not in socal_parent:
                  failures.append(f'{socal_parent_slug}: missing trust signal {trust_phrase}')
          if 'how fast can' not in socal_parent:
              failures.append(f'{socal_parent_slug}: missing pickup-timing FAQ')
          if 'socal-network-model-20260923' not in socal_parent:
              failures.append(f'{socal_parent_slug}: missing network-model section')
          if 'socal-commercial-property-20260923' not in socal_parent:
              failures.append(f'{socal_parent_slug}: missing landlord/commercial layer')
          if 'socal-parent-request-flow-20260923' not in socal_parent:
              failures.append(f'{socal_parent_slug}: missing parent request flow')
          for field_name in ['name="brand_model"','name="preferred_window"']:
              if field_name not in socal_parent:
                  failures.append(f'{socal_parent_slug}: missing intake field {field_name}')
          for commercial_link in ['landlord-property-manager-appliance-pickup/','commercial-appliance-pickup/']:
              if commercial_link not in socal_parent:
                  failures.append(f'{socal_parent_slug}: missing commercial link {commercial_link}')
          for network_phrase in ['independent local pickup professionals','company-owned storefront or local branch']:
              if network_phrase not in socal_parent:
                  failures.append(f'{socal_parent_slug}: missing network transparency {network_phrase}')

          authority={
            'washer-dryer-pickup':'southern-california-washer-dryer-pickup',
            'refrigerator-pickup':'southern-california-refrigerator-pickup',
            'freezer-pickup':'southern-california-freezer-pickup',
            'stove-oven-pickup':'southern-california-stove-oven-pickup',
          }
          for parent,child in authority.items():
              s=(Path(parent)/'index.html').read_text(encoding='utf-8',errors='replace').lower()
              if child+'/' not in s:
                  failures.append(f'{parent}: missing link to {child}')

          for city_slug in priority_city_slugs:
              p=Path(city_slug)/'index.html'
              if not p.exists():
                  failures.append(f'{city_slug}: missing priority city page')
                  continue
              low=p.read_text(encoding='utf-8',errors='replace').lower()
              if 'socal-appliance-intent-20260923' not in low:
                  failures.append(f'{city_slug}: missing Southern California appliance-intent block')
              if 'city-network-model-20260923' not in low:
                  failures.append(f'{city_slug}: missing city network-model note')
              if 'how soon can appliance pickup be arranged in' not in low:
                  failures.append(f'{city_slug}: missing city timing FAQ')
              for audience_phrase in ['landlord','property manager']:
                  if audience_phrase not in low:
                      failures.append(f'{city_slug}: missing city audience coverage {audience_phrase}')
              if 'how soon can appliance pickup be arranged' not in low:
                  failures.append(f'{city_slug}: missing city pickup-timing FAQ')
              for audience_phrase in ['landlord','property manager']:
                  if audience_phrase not in low:
                      failures.append(f'{city_slug}: missing priority audience {audience_phrase}')
              for network_phrase in ['independent local pickup professionals','company-owned storefront or local branch']:
                  if network_phrase not in low:
                      failures.append(f'{city_slug}: missing city network transparency {network_phrase}')
              for hub_slug in slugs:
                  if hub_slug+'/' not in low:
                      failures.append(f'{city_slug}: missing backlink to {hub_slug}')

          print('PRIORITY_CITY_CLUSTER_PAGES',len(priority_city_slugs))
          print('CALIFORNIA_APPLIANCE_INTENT_GOLD_STANDARD_PAGES',len(slugs))
          if failures:
              print('FAILURES')
              for f in failures: print('-',f)
              sys.exit(1)
          print('PASS: California appliance-intent layer meets the gold-standard architecture, schema, conversion, sitemap and internal-link requirements.')
          PY
