name: Optimize Oversized Active Heroes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-oversized-active-heroes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Create web derivatives and patch exact active hero references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re

          sources = {
              '20240806_153155.jpg': 'assets/optimized/20240806_153155-1600.jpg',
              '20240417_112815-1.jpg': 'assets/optimized/20240417_112815-1-1600.jpg',
              '20241112_145206.jpg': 'assets/optimized/20241112_145206-1600.jpg',
              '20250923_151633.jpg': 'assets/optimized/20250923_151633-1600.jpg',
              '20250801_160150_HDR.jpg': 'assets/optimized/20250801_160150_HDR-1600.jpg',
              '20250728_145218.jpg': 'assets/optimized/20250728_145218-1600.jpg',
              '20250804_103926.jpg': 'assets/optimized/20250804_103926-1600.jpg',
              '20230206_101140-1.jpg': 'assets/optimized/20230206_101140-1-1600.jpg',
          }

          pages = {
              'california-appliance-pickup/index.html': '20240806_153155.jpg',
              'redlands-appliance-pickup/index.html': '20240806_153155.jpg',
              'huntington-park-appliance-pickup/index.html': '20240806_153155.jpg',
              'hillsboro-appliance-pickup/index.html': '20240417_112815-1.jpg',
              'rancho-mirage-appliance-pickup/index.html': '20240417_112815-1.jpg',
              'idaho-appliance-pickup/index.html': '20241112_145206.jpg',
              'los-angeles-county-appliance-pickup/index.html': '20241112_145206.jpg',
              'puget-sound-appliance-pickup/index.html': '20250923_151633.jpg',
              'alhambra-appliance-pickup/index.html': '20250923_151633.jpg',
              'rancho-santa-margarita-appliance-pickup/index.html': '20250801_160150_HDR.jpg',
              'anaheim-hills-appliance-pickup/index.html': '20250801_160150_HDR.jpg',
              'redondo-beach-appliance-pickup/index.html': '20250728_145218.jpg',
              'imperial-beach-appliance-pickup/index.html': '20250728_145218.jpg',
              'highland-appliance-pickup/index.html': '20250804_103926.jpg',
              'aliso-viejo-appliance-pickup/index.html': '20250804_103926.jpg',
              'poway-appliance-pickup/index.html': '20230206_101140-1.jpg',
          }

          outdir = Path('assets/optimized')
          outdir.mkdir(parents=True, exist_ok=True)

          for src_name, dest_name in sources.items():
              src = Path(src_name)
              dest = Path(dest_name)
              if not src.is_file():
                  raise SystemExit(f'MISSING SOURCE {src}')
              with Image.open(src) as im:
                  im = ImageOps.exif_transpose(im)
                  if im.mode not in ('RGB','L'):
                      im = im.convert('RGB')
                  if im.mode == 'L':
                      im = im.convert('RGB')
                  if im.width > 1600:
                      height = round(im.height * 1600 / im.width)
                      im = im.resize((1600, height), Image.Resampling.LANCZOS)
                  im.save(dest, 'JPEG', quality=88, optimize=True, progressive=True)
              size = dest.stat().st_size
              if size >= 1_500_000:
                  raise SystemExit(f'OPTIMIZED FILE STILL TOO LARGE {dest}: {size}')
              print('OPTIMIZED', src, '->', dest, size)

          for page_name, src_name in pages.items():
              page = Path(page_name)
              raw = page.read_text(encoding='utf-8')
              dest = '/' + sources[src_name]
              pattern = re.compile(r'(?P<prefix><img\b[^>]*\bsrc=["\'])/' + re.escape(src_name) + r'(?:\?[^"\']*)?(?P<suffix>["\'][^>]*\bfetchpriority=["\']high["\'][^>]*>)', re.I)
              updated, count = pattern.subn(lambda m: m.group('prefix') + dest + m.group('suffix'), raw, count=1)
              if count != 1:
                  # Handle pages where fetchpriority appears before src.
                  pattern2 = re.compile(r'(?P<prefix><img\b[^>]*\bfetchpriority=["\']high["\'][^>]*\bsrc=["\'])/' + re.escape(src_name) + r'(?:\?[^"\']*)?(?P<suffix>["\'][^>]*>)', re.I)
                  updated, count = pattern2.subn(lambda m: m.group('prefix') + dest + m.group('suffix'), raw, count=1)
              if count != 1:
                  raise SystemExit(f'EXPECTED ONE HERO REFERENCE in {page_name} for {src_name}, got {count}')
              page.write_text(updated, encoding='utf-8')
              print('PATCHED', page_name, '->', dest)
          PY
      - name: Verify stricter active hero audit
        run: python scripts/audit-active-page-images.py
      - name: Commit optimized derivatives
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/optimized/*.jpg */index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Optimize oversized active hero images"
          git push
