name: Add City Specific Utility

on:
  push:
    paths:
      - '.github/workflows/add-city-specific-utility.yml'

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add verified city-specific sections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          sections = {
          'cathedral-city-appliance-pickup': '''
          <section id="cathedral-city-disposal-options" class="local-city-resource">
          <h2>Cathedral City Appliance Disposal Options</h2>
          <p>Our pickup service is intended for qualifying reusable major appliances. If an appliance does not qualify, Cathedral City has a separate municipal bulky-item option. The City directs residents to Burrtec for scheduled bulky-item pickup and says up to four scheduled items can be collected in a week. The City's guidance includes large appliances and refrigerators among bulky items.</p>
          <p>Cathedral City also warns against leaving unwanted household items at the curb before a scheduled collection. Its code-compliance guidance says bulky items should be scheduled first and placed out on the morning of pickup. That makes scheduling especially important when a refrigerator, washer, dryer or range cannot be accepted through our reuse-focused service.</p>
          <p>For residents who prefer self-haul, Cathedral City's Environmental Programs page also identifies the Edom Hill Recycling and Transfer Facility as a local refuse-disposal resource. Always confirm current hours, fees and material rules before transporting an appliance.</p>
          <p><a href="https://www.cathedralcity.gov/departments/community-economic-development-department/code-compliance/common-code-violations" rel="noopener">Cathedral City bulky-item and curb guidance</a> · <a href="https://www.cathedralcity.gov/departments/public-works/environmental/environmental-programs" rel="noopener">Cathedral City Environmental Programs</a></p>
          </section>
          ''',
          'la-quinta-appliance-pickup': '''
          <section id="la-quinta-disposal-options" class="local-city-resource">
          <h2>La Quinta Bulky Appliance Alternative</h2>
          <p>For a major appliance that does not qualify for our pickup, La Quinta publishes a separate resident bulky-item option through Burrtec. The City says bulky-item service covers items too large for the regular trash barrel, including appliances, and currently allows eligible residents up to four pieces per week at no charge when the pickup is scheduled.</p>
          <p>La Quinta's code-compliance information also says discarded furniture and appliances should not be stored where they are visible from the public right-of-way. Residents should schedule the city's bulky-item service rather than placing an appliance out without an appointment. The City also encourages reuse or donation when an item remains in good condition.</p>
          <p>This gives La Quinta households two different paths: contact us first for a qualifying reusable refrigerator, washer, dryer, range or freezer, or use the City's current bulky-item program when the appliance is not a fit for reuse. Confirm the City's current eligibility and scheduling rules before set-out.</p>
          <p><a href="https://www.laquintaca.gov/residents/local-utilities/public-utility-emergencies" rel="noopener">Official La Quinta bulky-item information</a> · <a href="https://www.laquintaca.gov/business/safety/animal-control-code-compliance/code-compliance-information" rel="noopener">La Quinta code-compliance guidance</a></p>
          </section>
          ''',
          'rancho-mirage-appliance-pickup': '''
          <section id="rancho-mirage-disposal-options" class="local-city-resource">
          <h2>Rancho Mirage Appliance Disposal Alternative</h2>
          <p>Rancho Mirage uses Burrtec for municipal solid-waste and recycling services. City planning documents identify bulky-item pickup, electronic-waste service, household-hazardous-waste service and used-motor-oil programs among the residential services available through the City's waste contractor.</p>
          <p>That municipal option is different from our reuse-focused appliance pickup. If your refrigerator, washer, dryer, stove or freezer is still working or otherwise qualifies, send us the condition and access details first. If it does not qualify, Rancho Mirage residents can check Burrtec's current bulky-item requirements and appointment availability instead of leaving the appliance unscheduled at the curb.</p>
          <p>Rancho Mirage's General Plan also identifies the Edom Hill Transfer Station in nearby Cathedral City as the transfer facility used for much of the area's solid waste. Residents considering self-haul should verify current public access, fees and accepted materials directly with the facility before transporting an appliance.</p>
          <p><a href="https://ranchomirageca.gov/CITY%20STAFF%20USE%20THIS%20FILE/Department%20Files/Planning/General%20Plan/RM%20General%20Plan%20Final%20-%20Pages%20Version%20with%20HE%20Update.pdf" rel="noopener">City of Rancho Mirage General Plan — solid waste services</a></p>
          </section>
          ''',
          'palmdale-appliance-pickup': '''
          <section id="palmdale-local-disposal" class="local-city-resource">
          <h2>Palmdale Bulky Appliance and Landfill Options</h2>
          <p>If an appliance does not qualify for our reuse-focused pickup, Palmdale publishes several local disposal options. The City says residential customers can schedule four no-charge bulky-item pickups per year through WM, with up to four items per pickup. Palmdale also publishes bulky-item rules for apartments, condos and townhomes, which can be useful when a pickup requires property-manager coordination.</p>
          <p>The City's disposal guidance also lists the Palmdale Landfill on City Ranch Road and explains separate mattress drop-off options for residents. These alternatives matter when a nonworking appliance, oversized item or mixed junk load does not meet our qualification rules.</p>
          <p>For our service, send the appliance condition and access details before moving it outside. For the municipal option, verify WM's current scheduling, item limits and preparation rules with the City before placing anything at the curb.</p>
          <p><a href="https://www.cityofpalmdaleca.gov/1168/Illegal-Dumping" rel="noopener">Official City of Palmdale disposal and bulky-item guidance</a></p>
          </section>
          ''',
          'lancaster-appliance-pickup': '''
          <section id="lancaster-local-disposal" class="local-city-resource">
          <h2>Lancaster Bulky Appliance and Landfill Options</h2>
          <p>Lancaster has its own waste-service alternatives for appliances that do not qualify for our pickup. The City says residential WM customers with accounts in good standing can receive four curbside bulky-item pickups per year, with up to four items per pickup. Appliances and electronic waste are listed among the accepted bulky-item categories.</p>
          <p>Lancaster also provides eligible residential customers two electronic landfill vouchers per year for the Lancaster Landfill &amp; Recycling Center at 600 E. Avenue F. The City's current page explains that the vouchers can cover household trash, bulky items and green waste within its stated limits. That is a different option from Palmdale's local disposal system and gives Lancaster residents a city-specific fallback when reuse pickup is not appropriate.</p>
          <p>Contact us first for qualifying reusable major appliances. For City/WM service or landfill use, confirm current eligibility, appointment timing, voucher rules and accepted materials before moving the item.</p>
          <p><a href="https://www.cityoflancasterca.org/our-city/about-us/sustainability/green-practices/illegal-dumping-proper-waste-disposal/free-dump-days" rel="noopener">Official City of Lancaster bulky-item and landfill information</a></p>
          </section>
          ''',
          'fresno-appliance-pickup': '''
          <section id="fresno-local-disposal" class="local-city-resource">
          <h2>Fresno Bulky-Item and Appliance Disposal Alternatives</h2>
          <p>City of Fresno solid-waste customers have municipal options when an appliance or bulky item does not qualify for our reuse pickup. Fresno's current One-Time Bulky Item Pickup program allows eligible residential customers in good standing to request one no-extra-cost bulky-item collection within a one-year period. Requests can be started through Fresno 311, the City's published phone number, or the FresGO app, with the City confirming the scheduled collection date.</p>
          <p>Fresno also holds Free Dump events for eligible City solid-waste customers, and the City's residential-services information lists appliances among the accepted event materials. Event dates and eligibility can change, so residents should verify the current schedule and identification requirements on the City's site before loading an appliance.</p>
          <p>Our service is a separate option for qualifying reusable refrigerators, washers, dryers, stoves and freezers. Sending condition and access details first can avoid moving a heavy appliance unnecessarily.</p>
          <p><a href="https://www.fresno.gov/publicutilities/trash-disposal-recycling/residential-services/one-time-bulky-item-pickup/" rel="noopener">Fresno One-Time Bulky Item Pickup</a> · <a href="https://www.fresno.gov/publicutilities/trash-disposal-recycling/residential-services/" rel="noopener">Fresno residential disposal services</a></p>
          </section>
          ''',
          'sacramento-appliance-pickup': '''
          <section id="sacramento-local-disposal" class="local-city-resource">
          <h2>Sacramento's Separate Appliance Collection Program</h2>
          <p>Sacramento has a particularly specific municipal fallback for appliances that do not qualify for our pickup. The City says residential collection customers can schedule two appliance-and-e-waste appointments per calendar year at no charge, separate from its household-junk appointments. The appliance program currently allows up to two appliances per appointment.</p>
          <p>The City's accepted-appliance list includes refrigerators, freezers, washing machines, dryers, stoves/ranges, ovens and dishwashers, among other household equipment. Sacramento also publishes placement rules: scheduled appliances should be visible and easy to access, and the City tells customers not to set materials out too early. Multi-family properties not served by the City's residential collection system may need to work through the landlord, property manager or commercial hauler.</p>
          <p>Our pickup remains the first option for qualifying reusable major appliances. If the item does not qualify, Sacramento's appliance-specific 311 program is a useful city alternative.</p>
          <p><a href="https://www.cityofsacramento.gov/public-works/recycling-solid-waste/Collectionservices/service_requests/appliance_pickup" rel="noopener">Official Sacramento appliance and e-waste pickup information</a></p>
          </section>
          '''
          }

          changed=[]
          for slug, section in sections.items():
              p=Path(slug)/'index.html'
              if not p.exists():
                  continue
              text=p.read_text(encoding='utf-8',errors='ignore')
              section_id=section.split('id="',1)[1].split('"',1)[0]
              if f'id="{section_id}"' in text:
                  continue
              if '<section id="request"' in text:
                  text=text.replace('<section id="request"',section+'\n<section id="request"',1)
              elif '</main>' in text:
                  text=text.replace('</main>',section+'\n</main>',1)
              else:
                  text=text.replace('</body>',section+'\n</body>',1)
              p.write_text(text,encoding='utf-8')
              changed.append(slug)

          print('CITY_SPECIFIC_PAGES_UPDATED',len(changed))
          for slug in changed: print('UPDATED',slug)
          PY

      - name: Commit city-specific improvements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cathedral-city-appliance-pickup/index.html la-quinta-appliance-pickup/index.html rancho-mirage-appliance-pickup/index.html palmdale-appliance-pickup/index.html lancaster-appliance-pickup/index.html fresno-appliance-pickup/index.html sacramento-appliance-pickup/index.html
          if git diff --cached --quiet; then
            echo "No content changes needed"
            exit 0
          fi
          git commit -m "Differentiate high-similarity city service pages"
          git push
