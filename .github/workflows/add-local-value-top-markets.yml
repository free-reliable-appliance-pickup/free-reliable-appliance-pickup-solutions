name: Add unique local value to top markets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-local-value-top-markets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve-local-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add city-specific request guidance
        run: |
          python - <<'PY'
          from pathlib import Path
          sections = {
              'las-vegas-appliance-pickup/index.html': '<section id="las-vegas-request-details">\n<h2>Las Vegas Pickup Details That Help Us Review Your Request</h2>\n<p>If the appliance is in a gated community, condominium or high-rise, include gate or concierge instructions, elevator availability, loading-area rules and where the pickup vehicle can legally stop. If an elevator must be reserved, tell us before scheduling.</p>\n<p>For refrigerators and freezers, send an interior photo and tell us whether the unit is currently cooling. For washers and dryers, tell us whether the washer fills, drains and spins, whether the dryer heats and tumbles, and whether the dryer is gas or electric.</p>\n<p>If you have several appliances, list the working condition of each item separately. That helps us review whether the overall load meets the free-pickup qualification before a route is arranged.</p>\n</section>\n',
              'phoenix-appliance-pickup/index.html': '<section id="phoenix-request-details">\n<h2>Phoenix Pickup Details That Help Us Review Your Request</h2>\n<p>If the appliance is in a garage, side yard, gated community, apartment or rental property, include the exact access route, gate instructions, floor level, stairs and parking limitations. Tell us about narrow doors or any appliance door that may need to be removed for safe movement.</p>\n<p>For refrigerators and freezers, send an interior photo and confirm whether the appliance is maintaining temperature. For washers, tell us whether the machine fills, drains and spins. For dryers, include whether it is gas or electric and whether it heats and tumbles.</p>\n<p>For multiple-appliance requests, give the condition of every appliance separately so the working share of the load can be reviewed before pickup is scheduled.</p>\n</section>\n',
              'seattle-appliance-pickup/index.html': '<section id="seattle-request-details">\n<h2>Seattle Pickup Details That Help Us Review Your Request</h2>\n<p>For apartments, condominiums and multi-unit properties, include the floor level, elevator access, any elevator reservation requirement, loading-zone or parking restrictions and the route from the appliance to the pickup vehicle. For houses, tell us about basement stairs, exterior steps and narrow doorways.</p>\n<p>For refrigerators and freezers, send an interior photo and tell us whether the unit is currently cooling. For washers and dryers, include basic operating details and whether the dryer is gas or electric.</p>\n<p>If several appliances are being removed, list each appliance and its condition separately. Accurate access and condition details help avoid a wasted trip and make qualification review faster.</p>\n</section>\n'
          }
          anchor = '<section class="real-appliance-proof">'
          for filename, section in sections.items():
              p = Path(filename)
              s = p.read_text()
              section_id = section.split('id="', 1)[1].split('"', 1)[0]
              if f'id="{section_id}"' not in s:
                  if anchor not in s:
                      raise SystemExit(f'anchor missing in {filename}')
                  p.write_text(s.replace(anchor, section + '\n' + anchor, 1))
          PY
      - name: Commit local-value improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add las-vegas-appliance-pickup/index.html phoenix-appliance-pickup/index.html seattle-appliance-pickup/index.html
          git diff --cached --quiet || git commit -m "Add unique local guidance to top market pages"
          git push
