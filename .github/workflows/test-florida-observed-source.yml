name: Test Florida Formspree Observed Traffic Source
on:
  pull_request:
    paths:
      - 'assets/customer-routing.js'
      - 'tests/test-florida-observed-source.cjs'
      - '.github/workflows/test-florida-observed-source.yml'
  push:
    branches: [main]
    paths:
      - 'assets/customer-routing.js'
      - 'tests/test-florida-observed-source.cjs'
      - '.github/workflows/test-florida-observed-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/customer-routing.js
      - run: node tests/test-florida-observed-source.cjs
