name: Safe Technical Auto Repair
on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: safe-technical-autorepair
  cancel-in-progress: false
jobs:
  safe-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check intended 6 AM Pacific maintenance slot
        id: pacific
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import os

          if os.environ.get('EVENT_NAME') != 'schedule':
              allowed = True
          else:
              cron = os.environ.get('SCHEDULE_CRON', '')
              parts = cron.split()
              if len(parts) != 5 or not parts[0].isdigit() or not parts[1].isdigit():
                  raise SystemExit('Missing scheduled cron slot; refusing unverified maintenance')
              minute, hour = int(parts[0]), int(parts[1])
              if not (0 <= minute <= 59 and 0 <= hour <= 23):
                  raise SystemExit('Invalid scheduled cron slot')
              nominal = datetime.now(timezone.utc).replace(
                  hour=hour, minute=minute, second=0, microsecond=0)
              local = nominal.astimezone(ZoneInfo('America/Los_Angeles'))
              allowed = (local.hour, local.minute) == (6, 0)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run={str(allowed).lower()}\n")
          print(f"Scheduled cron: {os.environ.get('SCHEDULE_CRON')}; run safe maintenance: {allowed}")
          PY
      - uses: actions/checkout@v4
      - name: Apply allowlisted non-content fixes
        if: steps.pacific.outputs.run == 'true'
        run: python3 scripts/safe-technical-autorepair.py
      - name: Validate fixer is idempotent
        if: steps.pacific.outputs.run == 'true'
        run: python3 scripts/safe-technical-autorepair.py --check
      - name: Run available SEO and routing safety checks
        if: steps.pacific.outputs.run == 'true'
        run: |
          python3 scripts/audit-priority-pickup-forms.py
      - name: Write daily maintenance report
        if: always() && steps.pacific.outputs.run == 'true'
        run: |
          mkdir -p maintenance-reports
          {
            echo '# Daily website maintenance report'
            echo "Date (Pacific): $(TZ=America/Los_Angeles date +%F)"
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Status of repair checks: ${{ job.status }}"
            echo 'Automated changes require PR review; no SEO-sensitive changes are auto-merged.'
          } > maintenance-reports/daily-report.md
          cat maintenance-reports/daily-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload daily report
        if: always() && steps.pacific.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-maintenance-report
          path: maintenance-reports/daily-report.md
          retention-days: 30
      - name: Open or update a reviewable repair PR
        if: steps.pacific.outputs.run == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/safe-technical-repairs
          delete-branch: true
          commit-message: 'technical-fix: normalize valid US telephone links'
          title: 'Automated safe repair: normalize telephone links'
          body: |
            Generated by the daily safe technical auto-repair workflow.
            Only normalizes existing 10/11-digit US telephone href values.
            Visible copy, phone digits, canonical URLs, SEO content and service coverage are unchanged.
            Requires review and passing repository checks before merge.
          add-paths: |
            **/*.html
