name: Wire Customer Routing Into Live Pickup Forms

on:
  workflow_dispatch:
  push:
    paths:
      - '*.html'
      - '**/*.html'
      - 'assets/customer-routing.js'
      - '.github/workflows/wire-customer-routing.yml'

permissions:
  contents: write

jobs:
  wire-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add routing helper only to customer pickup form pages
        shell: python
        run: |
          from pathlib import Path
          import re

          routing_tag = re.compile(
              r'<script\b[^>]*\bsrc=["\'][^"\']*assets/customer-routing\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>',
              re.I,
          )
          changed = []

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              lower = text.lower()

              is_formspree = 'formspree.io' in lower
              has_city = 'name="city"' in lower or "name='city'" in lower or 'name="pickup_city"' in lower or "name='pickup_city'" in lower
              has_state = 'name="state"' in lower or "name='state'" in lower or 'name="pickup_state"' in lower or "name='pickup_state'" in lower
              has_appliance = 'name="appliance"' in lower or "name='appliance'" in lower or 'name="appliance type"' in lower or "name='appliance type'" in lower

              if not (is_formspree and has_city and has_state and has_appliance):
                  continue
              if routing_tag.search(text) or '</head>' not in lower:
                  continue

              depth = len(path.parent.parts)
              src = ('../' * depth) + 'assets/customer-routing.js'
              script = f'<script src="{src}" defer></script>'
              idx = lower.index('</head>')
              text = text[:idx] + script + '\n' + text[idx:]
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print(f'Routing helper added to {len(changed)} page(s).')
          for item in changed:
              print(' -', item)

      - name: Verify every customer pickup form loads routing helper exactly once
        shell: python
        run: |
          from pathlib import Path
          import re

          routing_tag = re.compile(
              r'<script\b[^>]*\bsrc=["\'][^"\']*assets/customer-routing\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>',
              re.I,
          )
          missing = []
          duplicates = []
          detected = []

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              lower = text.lower()
              target = (
                  'formspree.io' in lower and
                  ('name="city"' in lower or "name='city'" in lower or 'name="pickup_city"' in lower or "name='pickup_city'" in lower) and
                  ('name="state"' in lower or "name='state'" in lower or 'name="pickup_state"' in lower or "name='pickup_state'" in lower) and
                  ('name="appliance"' in lower or "name='appliance'" in lower or 'name="appliance type"' in lower or "name='appliance type'" in lower)
              )
              if not target:
                  continue
              detected.append(str(path))
              count = len(routing_tag.findall(text))
              if count == 0:
                  missing.append(str(path))
              elif count > 1:
                  duplicates.append(f'{path} ({count} loads)')

          if missing:
              raise SystemExit('Missing routing helper: ' + ', '.join(missing))
          if duplicates:
              raise SystemExit('Duplicate routing helper loads: ' + ', '.join(duplicates))
          if not detected:
              raise SystemExit('No customer pickup forms detected; wiring audit cannot pass silently')
          print(f'PASS: all {len(detected)} detected customer pickup forms load routing exactly once.')

      - name: Confirm this workflow never changes premium hero photos
        shell: python
        run: |
          from pathlib import Path
          text = Path('.github/workflows/wire-customer-routing.yml').read_text(encoding='utf-8')
          forbidden = [
              'premium hero files updated',
              'data-premium-hero-lock',
              'complete_sets = [',
              'Normalize premium washer dryer set heroes',
          ]
          hits = [item for item in forbidden if item in text]
          if hits:
              raise SystemExit('Hero-replacement logic returned to routing workflow: ' + ', '.join(hits))
          print('PASS: customer-routing workflow does not rewrite city hero photos.')

      - name: Commit routing wiring only
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No routing changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' '**/*.html'
          git commit -m 'Wire customer routing helper only'
          git push
