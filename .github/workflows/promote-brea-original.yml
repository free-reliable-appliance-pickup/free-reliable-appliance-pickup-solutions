name: Promote Brea original full-resolution hero

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/promote-brea-original.yml'

permissions:
  contents: write

concurrency:
  group: promote-brea-original
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock exact Brea original
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          route = '/brea-washer-dryer-pickup/'
          page = Path('brea-washer-dryer-pickup/index.html')
          image_rel = 'assets/laundry/original-user-heroes/1000274887(2).jpg'
          image = Path(image_rel)
          expected_sha = 'c46b3397a6471dc81141dec83546d7735ce4ed6f19bc5105bdf2d07fea968cbe'
          if not image.is_file():
              raise SystemExit('Missing Brea original')
          raw = image.read_bytes()
          if len(raw) != 166610 or hashlib.sha256(raw).hexdigest() != expected_sha:
              raise SystemExit('Brea original bytes do not match recovered Library original')

          text = page.read_text(encoding='utf-8')
          absolute = 'https://freereliableappliancepickup.com/' + image_rel + '?original-fullres=20260917h'
          relative = '/' + image_rel + '?original-fullres=20260917h'

          def one(pattern, repl, label, flags=0):
              global text
              text2, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              text = text2

          one(r'(<meta\s+property="og:image"\s+content=")[^"]*(")', lambda m:m.group(1)+absolute+m.group(2), 'og:image')
          one(r'(<meta\s+name="twitter:image"\s+content=")[^"]*(")', lambda m:m.group(1)+absolute+m.group(2), 'twitter:image')
          one(r'("primaryImageOfPage"\s*:\s*\{[^{}]*?"url"\s*:\s*")[^"]*(")', lambda m:m.group(1)+absolute+m.group(2), 'primaryImage', flags=re.S)
          one(r'(<div\s+class="site-hero-art"><img\s+src=")[^"]*(")', lambda m:m.group(1)+relative+m.group(2), 'visible hero')
          one(r'(<script[^>]*data-premium-hero-lock="1"[^>]*>.*?var\s+s=")[^"]*(")', lambda m:m.group(1)+relative+m.group(2), 'hero lock', flags=re.S)
          page.write_text(text, encoding='utf-8')

          manifest_path = Path('assets/premium-user-heroes.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest[route] = {
              'src': image_rel,
              'alt': 'Real washer and dryer set provided for Brea pickup service',
              'source_status': 'original-full-resolution-manual',
              'original_width': 1152,
              'original_height': 1536,
              'original_size_bytes': 166610,
              'original_sha256': expected_sha,
              'recovered_from_set': 80,
              'recovered_phone_filename': '1000274887(2).jpg',
              'manual_assignment': True
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          pending_path = Path('assets/laundry/pending-manual-hero-verification.json')
          pending = json.loads(pending_path.read_text(encoding='utf-8'))
          pending['pending_routes'] = [x for x in pending.get('pending_routes', []) if x.get('route') != route]
          pending_path.write_text(json.dumps(pending, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          reread = page.read_text(encoding='utf-8')
          if reread.count(absolute) < 3 or reread.count(relative) < 2:
              raise SystemExit('Brea page is not locked in all static image locations')
          print('Brea full-resolution hero locked successfully.')
          PY

      - name: Commit Brea promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brea-washer-dryer-pickup/index.html assets/premium-user-heroes.json assets/laundry/pending-manual-hero-verification.json
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Restore Brea original full-resolution hero'
            git push
          fi
