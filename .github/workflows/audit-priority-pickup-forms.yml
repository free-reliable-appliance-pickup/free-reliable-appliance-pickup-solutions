name: Audit Priority Pickup Forms

on:
  push:
    branches: [main]
    paths:
      - '**/*-appliance-pickup/index.html'
      - '**/*-washer-dryer-pickup/index.html'
      - '**/*-refrigerator-pickup/index.html'
      - '**/*-freezer-pickup/index.html'
      - '**/*-stove-oven-pickup/index.html'
      - 'scripts/audit-priority-pickup-forms.py'
      - 'scripts/audit-priority-intake-contract.py'
      - '.github/workflows/audit-priority-pickup-forms.yml'
  pull_request:
    paths:
      - '**/*-appliance-pickup/index.html'
      - '**/*-washer-dryer-pickup/index.html'
      - '**/*-refrigerator-pickup/index.html'
      - '**/*-freezer-pickup/index.html'
      - '**/*-stove-oven-pickup/index.html'
      - 'scripts/audit-priority-pickup-forms.py'
      - 'scripts/audit-priority-intake-contract.py'
      - '.github/workflows/audit-priority-pickup-forms.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-priority-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate condition and access intake
        run: python3 scripts/audit-priority-pickup-forms.py
      - name: Self-test general pickup form contract guard
        run: python3 scripts/audit-priority-intake-contract.py --self-test
      - name: Validate general pickup form attribution contract
        run: python3 scripts/audit-priority-intake-contract.py
