name: Trim landlord page meta description

on:
  push:
    paths:
      - '.github/workflows/trim-landlord-meta.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shorten landlord page meta description
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('landlord-property-manager-appliance-pickup/index.html')
          text = path.read_text()
          old = 'Appliance pickup for landlords and property managers handling turnovers, replacements and multiple units. Submit photos, condition and access details for review.'
          new = 'Appliance pickup for landlords and property managers handling turnovers, replacements and multiple units. Submit photos, condition and access for review.'
          if old not in text:
              raise SystemExit('Expected current landlord meta description not found')
          path.write_text(text.replace(old, new, 1))
          print('Updated landlord page meta description to 153 characters')
          PY
      - name: Commit landlord meta cleanup
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add landlord-property-manager-appliance-pickup/index.html
          git commit -m 'Finalize landlord page search snippet'
          git push
