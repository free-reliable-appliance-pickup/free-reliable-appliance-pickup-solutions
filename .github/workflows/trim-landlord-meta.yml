name: One-Time Landlord Metadata Cleanup
on:
  push:
    branches: [main]
jobs:
  trim:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tighten metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('landlord-property-manager-appliance-pickup/index.html')
          s=p.read_text()
          s=s.replace('<title>Appliance Pickup for Landlords & Property Managers | Turnovers</title>','<title>Landlord & Property Manager Appliance Pickup | Turnovers</title>')
          s=s.replace('content="Appliance pickup for landlords and property managers handling tenant turnover, multiple units and recurring appliance replacements. Submit condition, photos and access details for review."','content="Appliance pickup for landlords and property managers handling turnovers, replacements and multiple units. Submit photos, condition and access for review."')
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/trim-landlord-meta.yml
          git add landlord-property-manager-appliance-pickup/index.html .github/workflows/trim-landlord-meta.yml
          git commit -m "Tighten landlord page metadata" || exit 0
          git push