name: Fix homepage customer routing load

on:
  push:
    paths:
      - '.github/workflows/fix-homepage-customer-routing.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate homepage routing script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          duplicate = '<script src="/assets/customer-routing.js" defer></script>\n'
          if duplicate in text:
              text = text.replace(duplicate, '', 1)
              p.write_text(text)
          rel = '<script src="assets/customer-routing.js" defer></script>'
          if text.count(rel) != 1:
              raise SystemExit(f'Expected one relative customer-routing include, found {text.count(rel)}')
          if '/assets/customer-routing.js' in text:
              raise SystemExit('Absolute duplicate customer-routing include still present')
          print('PASS: homepage loads customer routing exactly once')
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No repair needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix duplicate homepage customer routing load"
          git push
