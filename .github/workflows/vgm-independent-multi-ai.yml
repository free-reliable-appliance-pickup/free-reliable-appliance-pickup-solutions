name: VGM Independent Multi-AI Review (Free Models)

# Read-only. Executes only the trusted default-branch reviewer code, NEVER PR code.
# Automatic for new/updated PRs after this workflow is merged and a key is configured.
on:
  pull_request_target:
    # Reviews are queued explicitly to protect the shared 50/day free-model quota.
    # Label one release candidate at a time; updates, removals and edits re-check eligibility.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review from the same repository"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Unrelated label changes must not cancel a selected review consuming free quota.
  # Revoking the release label or pushing a new commit still cancels obsolete reviews.
  group: vgm-multi-ai-${{ github.event.pull_request.number || inputs.pr_number }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'vgm-release-review' && 'unrelated-label' || 'release' }}
  cancel-in-progress: true

jobs:
  independent-review:
    # Run the required job on every triggering event. Skipped jobs can appear
    # green in branch protection; the first step enforces fail-closed gating.
    if: ${{ !cancelled() }}
    # IMPORTANT: A skipped GitHub Actions job is treated as SUCCESS by branch
    # protection. The mandatory reviewer job must RUN and FAIL CLOSED when an
    # unselected PR is opened or synchronized, without making model API calls.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refuse non-selected or external release PRs (fail closed; no AI calls)
        # Guard ALL entry points, including manual dispatch, before any model use.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TRUSTED_REPO: ${{ github.repository }}
          REVIEW_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          event = os.environ.get("EVENT_NAME", "pull_request_target")
          trusted = os.environ.get("TRUSTED_REPO", "")
          if event == "workflow_dispatch":
              # Do not trust an arbitrary dispatch number; validate GitHub's
              # live PR metadata via read-only access before any external call.
              number = os.environ.get("REVIEW_PR_NUMBER", "")
              token = os.environ.get("GITHUB_TOKEN", "")
              if (not re.fullmatch(r"[1-9][0-9]*", number)
                      or not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", trusted)
                      or not token):
                  print("Missing or invalid manual review metadata; FAIL CLOSED.")
                  sys.exit(1)
              req = Request(
                  "https://api.github.com/repos/" + trusted + "/pulls/" + number,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "User-Agent": "VGM-free-review-release-gate"},
              )
              try:
                  with urlopen(req, timeout=12) as response:
                      metadata = json.load(response)
              except (HTTPError, URLError, ValueError, TimeoutError):
                  print("Unable to verify manually selected PR; FAIL CLOSED.")
                  sys.exit(1)
              if not isinstance(metadata, dict):
                  print("Invalid PR metadata; FAIL CLOSED.")
                  sys.exit(1)
              head = metadata.get("head") or {}
              base = metadata.get("base") or {}
              head_repo = head.get("repo") if isinstance(head, dict) else {}
              base_repo = base.get("repo") if isinstance(base, dict) else {}
              head_repo = head_repo or {}
              base_repo = base_repo or {}
              raw_labels = metadata.get("labels")
              if not isinstance(raw_labels, list):
                  print("Missing PR labels; FAIL CLOSED.")
                  sys.exit(1)
              labels = [x.get("name") for x in raw_labels if isinstance(x, dict)]
              is_same_repo = isinstance(head_repo, dict) and head_repo.get("full_name") == trusted
              is_same_base = isinstance(base_repo, dict) and base_repo.get("full_name") == trusted
              is_selected = "vgm-release-review" in labels
              is_open = metadata.get("state") == "open"
              if not (is_same_base and is_same_repo and is_selected and is_open):
                  print("Manual review PR is not an open trusted release candidate; FAIL CLOSED.")
                  sys.exit(1)
          elif event == "pull_request_target":
              labels = json.loads(os.environ.get("REVIEW_LABELS", "[]"))
              is_same_repo = os.environ.get("PR_HEAD_REPO") == trusted
              is_selected = "vgm-release-review" in labels
              action = os.environ.get("EVENT_ACTION")
              label_event = action in ("labeled", "unlabeled")
              valid_label_event = action == "labeled" and os.environ.get("EVENT_LABEL") == "vgm-release-review"
              # Unrelated label events cannot consume quota or create green reviews.
              if not is_same_repo or not is_selected or (label_event and not valid_label_event):
                  print("Not selected as a trusted release candidate; FAIL CLOSED.")
                  sys.exit(1)
          else:
              print("Unsupported review event; FAIL CLOSED.")
              sys.exit(1)
          print("Trusted release candidate verified; requesting two independent free-model reviews.")
          PY
      - name: Checkout TRUSTED default branch (never check out pull request)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test multi-AI review safeguards
        run: python -m unittest discover -s tests -p 'test_vgm_multi_ai_review.py' -v
      - name: Independent reviews — two approved FREE models only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: python scripts/vgm_multi_ai_review.py
      - name: Archive review and explicit completeness status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vgm-multi-ai-advisory-${{ github.run_id }}
          path: |
            vgm-multi-ai-review.md
            vgm-multi-ai-review.json
          if-no-files-found: ignore
          retention-days: 14
