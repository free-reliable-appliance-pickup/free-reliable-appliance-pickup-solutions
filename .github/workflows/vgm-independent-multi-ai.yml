name: VGM Independent Multi-AI Review (Free Models)

# Read-only. Executes only the trusted default-branch reviewer code, NEVER PR code.
# Automatic for new/updated PRs after this workflow is merged and a key is configured.
on:
  pull_request_target:
    # Reviews are queued explicitly to protect the shared 50/day free-model quota.
    # Label one release candidate at a time; updates, removals and edits re-check eligibility.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review from the same repository"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Unrelated label changes must not cancel a selected review consuming free quota.
  # Revoking the release label or pushing a new commit still cancels obsolete reviews.
  group: vgm-multi-ai-${{ github.event.pull_request.number || inputs.pr_number }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'vgm-release-review' && 'unrelated-label' || 'release' }}
  cancel-in-progress: true

jobs:
  independent-review:
    # Run the required job on every triggering event. Skipped jobs can appear
    # green in branch protection; the first step enforces fail-closed gating.
    if: ${{ !cancelled() }}
    # IMPORTANT: A skipped GitHub Actions job is treated as SUCCESS by branch
    # protection. The mandatory reviewer job must RUN and FAIL CLOSED when an
    # unselected PR is opened or synchronized, without making model API calls.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refuse non-selected or external release PRs (fail closed; no AI calls)
        if: github.event_name == 'pull_request_target'
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TRUSTED_REPO: ${{ github.repository }}
          REVIEW_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          labels = json.loads(os.environ["REVIEW_LABELS"])
          is_same_repo = os.environ.get("PR_HEAD_REPO") == os.environ.get("TRUSTED_REPO")
          is_selected = "vgm-release-review" in labels
          action = os.environ.get("EVENT_ACTION")
          label_event = action in ("labeled", "unlabeled")
          valid_label_event = action == "labeled" and os.environ.get("EVENT_LABEL") == "vgm-release-review"
          # Even if the selected label remains on a PR, unrelated label events
          # should never create an accidental green review check.
          if not is_same_repo or not is_selected or (label_event and not valid_label_event):
              print("Not selected as a trusted release candidate; mandatory independent review FAILS CLOSED (no external AI calls).")
              sys.exit(1)
          print("Explicit trusted release-candidate label confirmed; requesting both independent free-model reviews.")
          PY
      - name: Checkout TRUSTED default branch (never check out pull request)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test multi-AI review safeguards
        run: python -m unittest discover -s tests -p 'test_vgm_multi_ai_review.py' -v
      - name: Independent reviews — two approved FREE models only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: python scripts/vgm_multi_ai_review.py
      - name: Archive review and explicit completeness status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vgm-multi-ai-advisory-${{ github.run_id }}
          path: |
            vgm-multi-ai-review.md
            vgm-multi-ai-review.json
          if-no-files-found: ignore
          retention-days: 14
