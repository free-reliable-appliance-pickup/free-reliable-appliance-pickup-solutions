name: Temporary sharp laundry photo build

on:
  push:
    paths:
      - '.github/workflows/tmp-laundry-sharpen.yml'

permissions:
  contents: write

jobs:
  build-sharp-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sharp web images from real originals
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          outdir = Path('assets/laundry')
          outdir.mkdir(parents=True, exist_ok=True)

          jobs = [
              ('file_00000000051c81fda2fa9f1edefd32f7.png', 'washer-dryer-set-sharp.jpg', 'hero'),
              ('20240417_112815-1.jpg', 'real-laundry-pickup-1.jpg', 'portrait'),
              ('IMG-20230604-WA0038.jpg', 'real-laundry-pickup-2.jpg', 'portrait'),
              ('IMG-20241025-WA0016.jpg', 'real-laundry-pickup-3.jpg', 'portrait'),
              ('IMG-20240403-WA0010.jpg', 'real-laundry-pickup-4.jpg', 'portrait'),
              ('IMG-20241210-WA0011.jpg', 'real-laundry-pickup-5.jpg', 'portrait'),
          ]

          report = []
          for src_name, dst_name, mode in jobs:
              src = Path(src_name)
              with Image.open(src) as im:
                  im = ImageOps.exif_transpose(im).convert('RGB')
                  original_size = im.size
                  if mode == 'hero':
                      # Feature matching confirmed this original aligns with the existing hero after a 90° clockwise rotation.
                      im = im.rotate(-90, expand=True)
                      im = ImageOps.fit(im, (1400, 1050), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
                  else:
                      # Preserve the complete real photo; only downscale oversized originals.
                      max_w, max_h = 1200, 1600
                      im.thumbnail((max_w, max_h), Image.Resampling.LANCZOS)
                  dst = outdir / dst_name
                  im.save(dst, 'JPEG', quality=92, optimize=True, progressive=True, subsampling=0)
                  report.append(f'{src_name} {original_size} {src.stat().st_size} bytes -> {dst} {im.size} {dst.stat().st_size} bytes')

          Path('sharp-laundry-photo-build-report.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          PY
      - name: Commit sharp images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/laundry/washer-dryer-set-sharp.jpg \
                  assets/laundry/real-laundry-pickup-1.jpg \
                  assets/laundry/real-laundry-pickup-2.jpg \
                  assets/laundry/real-laundry-pickup-3.jpg \
                  assets/laundry/real-laundry-pickup-4.jpg \
                  assets/laundry/real-laundry-pickup-5.jpg \
                  sharp-laundry-photo-build-report.txt
          git diff --cached --quiet || git commit -m 'Add sharp real laundry photos for washer dryer page'
          git push
