name: Daily Maintenance Email Reports
on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Select Pacific report window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import os
          kind = ""
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              kind = "manual"
          elif os.environ["EVENT_NAME"] == "schedule":
              parts = os.environ.get("SCHEDULE_EXPR", "").split()
              if len(parts) == 5 and parts[0].isdigit() and parts[1].isdigit():
                  minute, hour = int(parts[0]), int(parts[1])
                  if 0 <= minute < 60 and 0 <= hour < 24:
                      nominal = datetime.now(timezone.utc).replace(
                          hour=hour, minute=minute, second=0, microsecond=0)
                      slot = nominal.astimezone(ZoneInfo("America/Los_Angeles"))
                      kind = "morning" if slot.hour == 7 else "evening" if slot.hour == 18 else ""
          print(f"Report slot: {os.environ.get('SCHEDULE_EXPR', 'manual')}; kind: {kind or 'skipped'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"kind={kind}\n")
          PY
      - name: Prepare recent workflow summary
        if: steps.window.outputs.kind != ''
        id: summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          REPORT_KIND: ${{ steps.window.outputs.kind }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone
          kind = os.environ["REPORT_KIND"]
          workflows = ["seo-safe-repair.yml", "seo-health-monitor.yml"]
          lines = [f"Free Reliable Appliance Pickup — {kind.title()} Maintenance Report", ""]
          for workflow in workflows:
              url = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/workflows/{workflow}/runs?per_page=15"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json", "User-Agent": "FRAP-maintenance-report"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      runs = json.load(response).get("workflow_runs", [])
                  cutoff = datetime.now(timezone.utc) - timedelta(hours=26)
                  recent = [r for r in runs if datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")) >= cutoff]
                  lines.append(f"{workflow}:")
                  if not recent:
                      lines.append("  No runs found in the last 26 hours.")
                  for r in recent[:6]:
                      lines.append(f"  {r['created_at']} | {r['event']} | {r['status']} | {r.get('conclusion') or 'pending'} | {r['html_url']}")
              except Exception as exc:
                  lines.append(f"{workflow}: Could not retrieve runs: {exc}")
              lines.append("")
          lines.append("A successful workflow does not prove that repairs were applied. Open run logs and pull requests to confirm changes.")
          with open("report.txt", "w") as f:
              f.write("\n".join(lines) + "\n")
          PY
      - name: Publish maintenance report in Actions summary
        if: steps.window.outputs.kind != ''
        run: |
          {
            echo '## Free Reliable Appliance Pickup — maintenance report'
            echo
            echo 'Read-only workflow status summary. Passing runs do not prove search ranking or lead delivery.'
            echo
            echo '\`\`\`text'
            cat report.txt
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save maintenance report artifact
        if: steps.window.outputs.kind != ''
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-report-${{ steps.window.outputs.kind }}-${{ github.run_id }}
          path: report.txt
          retention-days: 14
      - name: Email maintenance summary (only when configured)
        if: steps.window.outputs.kind != ''
        env:
          SMTP_HOST: ${{ secrets.MAINTENANCE_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.MAINTENANCE_SMTP_PORT }}
          SMTP_USER: ${{ secrets.MAINTENANCE_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.MAINTENANCE_SMTP_PASSWORD }}
          REPORT_TO: enriquegerardo82@gmail.com
        run: |
          python - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          keys = ["SMTP_HOST", "SMTP_USER", "SMTP_PASSWORD", "REPORT_TO"]
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
              print("SMTP not configured: " + ", ".join(missing) + "; no email sent. GitHub Actions report artifact and run summary remain available.")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("\\n**Email status:** skipped — SMTP credentials not configured; no email sent.\\n")
              raise SystemExit(0)
          message = EmailMessage()
          message["Subject"] = "Free Reliable Appliance Pickup — Maintenance Report"
          message["From"] = os.environ["SMTP_USER"]
          message["To"] = os.environ["REPORT_TO"]
          message.set_content(open("report.txt").read())
          port = int(os.environ.get("SMTP_PORT") or "465")
          if port == 465:
              with smtplib.SMTP_SSL(os.environ["SMTP_HOST"], port, context=ssl.create_default_context(), timeout=30) as smtp:
                  smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_PASSWORD"])
                  smtp.send_message(message)
          else:
              with smtplib.SMTP(os.environ["SMTP_HOST"], port, timeout=30) as smtp:
                  smtp.starttls(context=ssl.create_default_context())
                  smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_PASSWORD"])
                  smtp.send_message(message)
          print("SMTP accepted the report for sending; inbox receipt not verified.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\\n**Email status:** handed to SMTP; inbox receipt not verified.\\n")
          PY
