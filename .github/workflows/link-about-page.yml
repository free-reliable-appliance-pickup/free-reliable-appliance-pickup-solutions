name: One-Time Link About Page

on:
  push:
    paths:
      - '.github/workflows/link-about-page.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add About and Contact internal links
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          python3 <<'PY'
          from pathlib import Path
          import re

          homepage = Path('index.html')
          if homepage.exists():
              text = homepage.read_text(encoding='utf-8', errors='ignore')
              if 'href="about/"' not in text:
                  marker = '<a href="#request">Request Pickup</a>'
                  replacement = marker + '\n<a href="about/">About &amp; Contact</a>'
                  if marker in text:
                      text = text.replace(marker, replacement, 1)
                  else:
                      text = re.sub(r'</nav>', '<a href="about/">About &amp; Contact</a>\n</nav>', text, count=1, flags=re.I)
                  homepage.write_text(text, encoding='utf-8')

          service = Path('service-areas/index.html')
          if service.exists():
              text = service.read_text(encoding='utf-8', errors='ignore')
              if '/about/' not in text:
                  link = '<p><a href="https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/about/">About &amp; Contact Free Reliable Appliance Pickup</a></p>'
                  text = re.sub(r'</footer>', link + '\n</footer>', text, count=1, flags=re.I)
                  service.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/link-about-page.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Link business trust page from core navigation'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main || true
          done
          exit 1
