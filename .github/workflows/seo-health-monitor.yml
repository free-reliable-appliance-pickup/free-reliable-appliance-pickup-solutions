name: SEO Health Monitor
# Node 24 pilot validated 2026-10-06

on:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "43 9 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "robots.txt"
      - ".github/scripts/seo_health_monitor.py"
      - ".github/workflows/seo-health-monitor.yml"

permissions:
  contents: read
  issues: write

jobs:
  priority-audit:
    if: github.event_name != 'schedule' || github.event.schedule == '17 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run priority SEO health audit
        id: audit
        continue-on-error: true
        run: python .github/scripts/seo_health_monitor.py --report seo-health-report.md

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: seo-health-priority-report
          path: seo-health-report.md
          retention-days: 14

      - name: Create or update SEO health issue
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const title = 'Automated SEO health alert';
            const body = fs.readFileSync('seo-health-report.md', 'utf8') +
              '\n\n_Automatically generated by the SEO Health Monitor workflow._';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'seo-health', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              try {
                await github.rest.issues.create({
                  owner, repo, title, body, labels: ['seo-health']
                });
              } catch (e) {
                if (e.status === 422) {
                  await github.rest.issues.create({ owner, repo, title, body });
                } else throw e;
              }
            }

      - name: Close stale SEO health issue when clean
        if: steps.audit.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Automated SEO health alert';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            for (const issue of issues) {
              if (!issue.pull_request && issue.title === title) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: 'Latest automated SEO health run is clean. Closing this alert.'
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number,
                  state: 'closed', state_reason: 'completed'
                });
              }
            }

      - name: Fail workflow when audit found problems
        if: steps.audit.outcome == 'failure'
        run: exit 1

  full-site-audit:
    if: (github.event_name == 'schedule' && github.event.schedule == '43 9 * * *') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-site-audit]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run full sitemap SEO audit
        id: audit
        continue-on-error: true
        run: python .github/scripts/seo_health_monitor.py --full --report seo-health-full-report.md

      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: seo-health-full-report
          path: seo-health-full-report.md
          retention-days: 14

      - name: Create or update full-site SEO issue
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const title = 'Automated full-site SEO alert';
            const body = fs.readFileSync('seo-health-full-report.md', 'utf8') +
              '\n\n_Automatically generated by the daily full-site SEO audit._';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Close stale full-site SEO issue when clean
        if: steps.audit.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Automated full-site SEO alert';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            for (const issue of issues) {
              if (!issue.pull_request && issue.title === title) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: 'Latest automated full-site SEO run is clean. Closing this alert.'
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number,
                  state: 'closed', state_reason: 'completed'
                });
              }
            }

      - name: Fail workflow when audit found problems
        if: steps.audit.outcome == 'failure'
        run: exit 1
