name: One-Time Final SEO Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-final-seo-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove remaining mass-location footprint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          BASE='https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/'

          # Keep the homepage focused on URLs we actually want indexed.
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'<div class="card"><h3><span class="nonindexed-area">.*?</div>\s*', '', text, flags=re.S)
          text=text.replace('<!-- SOCAL SEO NETWORK -->','<!-- Southern California coverage -->')
          p.write_text(text,encoding='utf-8')

          # Replace the oversized city-name directory with a focused crawl hub.
          service = '''<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Appliance Pickup Service Areas | Free Reliable Pickup</title>
          <meta name="description" content="Browse priority Free Reliable Appliance Pickup service areas, state hubs, local markets and appliance pickup guides.">
          <meta name="robots" content="index, follow">
          <link rel="canonical" href="''' + BASE + '''service-areas/">
          <link rel="icon" href="''' + BASE + '''assets/free-reliable-appliance-pickup-logo.svg" type="image/svg+xml">
          <style>
          *{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#222;font:17px/1.6 Arial,Helvetica,sans-serif}header{background:linear-gradient(135deg,#075c34,#0b8a4d);color:#fff;text-align:center;padding:46px 20px}header h1{margin:0 0 12px}main{width:min(1100px,94%);margin:auto}section{background:#fff;margin:24px 0;padding:28px;border-radius:12px}h2{color:#087443}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid #d9e5de;border-radius:10px;padding:16px;background:#fafcfb}.card a{color:#075c34;font-weight:700;text-decoration:none}.btn{display:inline-block;background:#fff;color:#075c34;padding:11px 16px;border-radius:8px;text-decoration:none;margin:5px;font-weight:700}.note{background:#eef9f3;border-left:5px solid #087443;padding:14px;border-radius:7px}footer{background:#111;color:#fff;text-align:center;padding:24px}footer a{color:#fff}@media(max-width:800px){.grid{grid-template-columns:1fr}}
          </style>
          <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"''' + BASE + '''#organization","name":"Free Reliable Appliance Pickup","url":"''' + BASE + '''"},{"@type":"WebPage","name":"Appliance Pickup Service Areas","url":"''' + BASE + '''service-areas/","isPartOf":{"@type":"WebSite","name":"Free Reliable Appliance Pickup","url":"''' + BASE + '''"}}]}</script>
          </head>
          <body>
          <header><h1>Appliance Pickup Service Areas</h1><p>Use our priority state, regional and city pages to review current appliance pickup coverage and qualification information.</p><a class="btn" href="''' + BASE + '''">Home</a><a class="btn" href="''' + BASE + '''#request">Request Pickup</a></header>
          <main>
          <section><h2>Priority State Hubs</h2><div class="grid">
          <div class="card"><a href="''' + BASE + '''california-appliance-pickup/">California Appliance Pickup</a><p>Priority California regions and local service information.</p></div>
          <div class="card"><a href="''' + BASE + '''oregon-appliance-pickup/">Oregon Appliance Pickup</a><p>Portland-area coverage and Oregon request information.</p></div>
          <div class="card"><a href="''' + BASE + '''washington-appliance-pickup/">Washington Appliance Pickup</a><p>Seattle-area and Washington request information.</p></div>
          <div class="card"><a href="''' + BASE + '''arizona-appliance-pickup/">Arizona Appliance Pickup</a><p>Phoenix-area and Arizona request information.</p></div>
          <div class="card"><a href="''' + BASE + '''utah-appliance-pickup/">Utah Appliance Pickup</a><p>Utah pickup request and qualification information.</p></div>
          <div class="card"><a href="''' + BASE + '''colorado-appliance-pickup/">Colorado Appliance Pickup</a><p>Denver-area and Colorado request information.</p></div>
          <div class="card"><a href="''' + BASE + '''nevada-appliance-pickup/">Nevada Appliance Pickup</a><p>Las Vegas-area and Nevada request information.</p></div>
          <div class="card"><a href="''' + BASE + '''idaho-appliance-pickup/">Idaho Appliance Pickup</a><p>Idaho pickup request and qualification information.</p></div>
          </div></section>

          <section><h2>Priority Local and Regional Markets</h2><div class="grid">
          <div class="card"><a href="''' + BASE + '''los-angeles-appliance-pickup/">Los Angeles Appliance Pickup</a></div>
          <div class="card"><a href="''' + BASE + '''inland-empire-appliance-pickup/">Inland Empire Appliance Pickup</a></div>
          <div class="card"><a href="''' + BASE + '''orange-county-appliance-pickup/">Orange County Appliance Pickup</a></div>
          <div class="card"><a href="''' + BASE + '''riverside-county-appliance-pickup/">Riverside County Appliance Pickup</a></div>
          <div class="card"><a href="''' + BASE + '''san-bernardino-county-appliance-pickup/">San Bernardino County Appliance Pickup</a></div>
          <div class="card"><a href="''' + BASE + '''portland-appliance-pickup/">Portland Appliance Pickup</a></div>
          <div class="card"><a href="''' + BASE + '''seattle-appliance-pickup/">Seattle Appliance Pickup</a></div>
          <div class="card"><a href="''' + BASE + '''phoenix-appliance-pickup/">Phoenix Appliance Pickup</a></div>
          <div class="card"><a href="''' + BASE + '''denver-appliance-pickup/">Denver Appliance Pickup</a></div>
          <div class="card"><a href="''' + BASE + '''las-vegas-appliance-pickup/">Las Vegas Appliance Pickup</a></div>
          </div><p class="note">These are the strongest published local and regional pages. Other locations can still submit a request, but a city name alone does not guarantee free pickup or direct service.</p></section>

          <section><h2>How Pickup Works</h2><div class="grid">
          <div class="card"><a href="''' + BASE + '''how-appliance-pickup-works/">How Appliance Pickup Works</a></div>
          <div class="card"><a href="''' + BASE + '''free-pickup-qualification/">Free Pickup Qualification</a></div>
          <div class="card"><a href="''' + BASE + '''appliance-pickup-checklist/">Appliance Pickup Checklist</a></div>
          <div class="card"><a href="''' + BASE + '''landlord-property-manager-appliance-pickup/">Landlord &amp; Property Manager Guide</a></div>
          <div class="card"><a href="''' + BASE + '''about/">About &amp; Contact</a></div>
          </div></section>

          <section><h2>Appliance Pickup Guides</h2><div class="grid">
          <div class="card"><a href="''' + BASE + '''washer-dryer-pickup/">Washer &amp; Dryer Pickup Guide</a></div>
          <div class="card"><a href="''' + BASE + '''refrigerator-pickup/">Refrigerator Pickup Guide</a></div>
          <div class="card"><a href="''' + BASE + '''freezer-pickup/">Freezer Pickup Guide</a></div>
          <div class="card"><a href="''' + BASE + '''stove-oven-pickup/">Stove &amp; Oven Pickup Guide</a></div>
          </div></section>
          </main>
          <footer><p><a href="''' + BASE + '''">Free Reliable Appliance Pickup</a> · Service hours: 8:00 AM–8:00 PM daily.</p></footer>
          </body></html>'''
          Path('service-areas/index.html').write_text(service,encoding='utf-8')
          PY

      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-final-seo-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove remaining mass-location SEO footprint'
          git push
