name: Restore full homepage
on:
  push:
    paths:
      - '.github/workflows/restore-full-homepage.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full homepage and retain routing engine
        run: |
          git show 4e0d4af24af6da4d81bb82749bbef9636dc9d483:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="/assets/customer-routing.js" defer></script>'
          if tag not in s:
              s=s.replace('</head>', tag+'\n</head>', 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore full homepage with customer routing engine'
          git push