name: Sitewide SEO Structure Repair

on:
  push:
    paths:
      - '.github/workflows/sitewide-seo-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Repair SEO structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import date

          BASE = 'https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/'

          # Connect the 8 priority states from the homepage.
          home = Path('index.html')

          if home.exists():
              s = home.read_text(
                  encoding='utf-8',
                  errors='ignore'
              )

              links = {
                  'California': 'california-appliance-pickup',
                  'Oregon': 'oregon-appliance-pickup',
                  'Washington': 'washington-appliance-pickup',
                  'Arizona': 'arizona-appliance-pickup',
                  'Utah': 'utah-appliance-pickup',
                  'Colorado': 'colorado-appliance-pickup',
                  'Nevada': 'nevada-appliance-pickup',
                  'Idaho': 'idaho-appliance-pickup'
              }

              for state, slug in links.items():
                  s = s.replace(
                      f'<span class="chip">{state}</span>',
                      f'<a class="chip" href="{slug}/">{state}</a>'
                  )

              home.write_text(
                  s,
                  encoding='utf-8'
              )

          # Clean the Portland page and link it to Oregon.
          portland = Path(
              'portland-appliance-pickup/index.html'
          )

          if portland.exists():
              s = portland.read_text(
                  encoding='utf-8',
                  errors='ignore'
              )

              s = '\n'.join(
                  line
                  for line in s.splitlines()
                  if not (
                      line.strip().startswith('"description":')
                      and
                      'Free Reliable Appliance Pickup provides'
                      in line
                  )
              )

              if (
                  'oregon-appliance-pickup/' not in s
                  and '</main>' in s
              ):
                  block = (
                      '<section>'
                      '<h2>Oregon Appliance Pickup Areas</h2>'
                      '<p>'
                      '<a href="../oregon-appliance-pickup/">'
                      'View Oregon appliance pickup service areas'
                      '</a> for Portland, Salem, Keizer and '
                      'surrounding communities.'
                      '</p>'
                      '</section>'
                  )

                  s = s.replace(
                      '</main>',
                      block + '</main>',
                      1
                  )

              portland.write_text(
                  s,
                  encoding='utf-8'
              )

          # Reusable page creator.
          def page(
              slug,
              title,
              desc,
              h1,
              intro,
              local_links=''
          ):
              p = Path(slug) / 'index.html'

              p.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              canonical = BASE + slug + '/'

              html = (
                  '<!DOCTYPE html>'
                  '<html lang="en">'
                  '<head>'
                  '<meta charset="UTF-8">'
                  '<meta name="viewport" '
                  'content="width=device-width,initial-scale=1">'

                  f'<title>{title}</title>'

                  f'<meta name="description" '
                  f'content="{desc}">'

                  '<meta name="robots" '
                  'content="index,follow,'
                  'max-snippet:-1,'
                  'max-image-preview:large">'

                  f'<link rel="canonical" '
                  f'href="{canonical}">'

                  '<style>'
                  'body{'
                  'font-family:Arial,Helvetica,sans-serif;'
                  'margin:0;'
