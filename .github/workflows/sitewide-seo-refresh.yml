name: Sitewide SEO Structure Repair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sitewide-seo-refresh.yml'

permissions:
  contents: write

jobs:
  seo-repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Repair SEO structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import date

          BASE = "https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/"

          def write_page(slug, title, desc, h1, body):
              p = Path(slug) / "index.html"
              p.parent.mkdir(parents=True, exist_ok=True)

              url = BASE + slug + "/"

              html = (
                  '<!doctype html><html lang="en"><head>'
                  '<meta charset="utf-8">'
                  '<meta name="viewport" content="width=device-width,initial-scale=1">'
                  f'<title>{title}</title>'
                  f'<meta name="description" content="{desc}">'
                  '<meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">'
                  f'<link rel="canonical" href="{url}">'
                  '</head><body>'
                  f'<main><h1>{h1}</h1>'
                  f'<p>{body}</p>'
                  '<p>Qualifying washers, dryers, refrigerators, freezers, stoves and ranges may be reviewed. '
                  'Working and reusable appliances receive priority.</p>'
                  '<p><a href="../#request">Request appliance pickup</a></p>'
                  '</main>'
                  '<footer><a href="../">Free Reliable Appliance Pickup</a></footer>'
                  '</body></html>'
              )

              p.write_text(html, encoding="utf-8")

          home = Path("index.html")

          if home.exists():
              s = home.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              links = {
                  "California": "california-appliance-pickup",
                  "Oregon": "oregon-appliance-pickup",
                  "Washington": "washington-appliance-pickup",
                  "Arizona": "arizona-appliance-pickup",
                  "Utah": "utah-appliance-pickup",
                  "Colorado": "colorado-appliance-pickup",
                  "Nevada": "nevada-appliance-pickup",
                  "Idaho": "idaho-appliance-pickup"
              }

              for state, slug in links.items():
                  s = s.replace(
                      f'<span class="chip">{state}</span>',
                      f'<a class="chip" href="{slug}/">{state}</a>'
                  )

              home.write_text(
                  s,
                  encoding="utf-8"
              )

          portland = Path(
              "portland-appliance-pickup/index.html"
          )

          if portland.exists():
              s = portland.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              s = "\n".join(
                  line
                  for line in s.splitlines()
                  if not (
                      line.strip().startswith('"description":')
                      and
                      "Free Reliable Appliance Pickup provides"
                      in line
                  )
              )

              if (
                  "oregon-appliance-pickup/" not in s
                  and "</main>" in s
              ):
                  s = s.replace(
                      "</main>",
                      '<p><a href="../oregon-appliance-pickup/">'
                      'View Oregon appliance pickup areas'
                      '</a></p></main>',
                      1
                  )

              portland.write_text(
                  s,
                  encoding="utf-8"
              )

          write_page(
              "oregon-appliance-pickup",
              "Free Appliance Pickup Oregon | Portland, Salem & Keizer",
              "Request qualifying appliance pickup in Oregon for washers, dryers, refrigerators, stoves and freezers.",
              "Free Appliance Pickup in Oregon",
              'Priority areas include '
              '<a href="../portland-appliance-pickup/">Portland</a>, '
              '<a href="../salem-appliance-pickup/">Salem</a> and '
              '<a href="../keizer-appliance-pickup/">Keizer</a>.'
          )

          write_page(
              "arizona-appliance-pickup",
              "Free Appliance Pickup Arizona | Phoenix Metro",
              "Request qualifying appliance pickup in Arizona, including Phoenix metro.",
              "Free Appliance Pickup in Arizona",
              'Priority areas include '
              '<a href="../phoenix-appliance-pickup/">Phoenix</a>, '
              'Mesa, Chandler, Scottsdale, Glendale and Tempe.'
          )

          write_page(
              "utah-appliance-pickup",
              "Free Appliance Pickup Utah | Salt Lake City",
              "Request qualifying appliance pickup in Utah, including Salt Lake City and the Wasatch Front.",
              "Free Appliance Pickup in Utah",
              'Priority areas include '
              '<a href="../salt-lake-city-appliance-pickup/">Salt Lake City</a>, '
              'Provo, Orem, Lehi, Ogden and Layton.'
          )

          write_page(
              "phoenix-appliance-pickup",
              "Free Appliance Pickup Phoenix AZ | Washer, Dryer & Refrigerator Pickup",
              "Request qualifying appliance pickup in Phoenix Arizona for washers, dryers, refrigerators, stoves and freezers.",
              "Free Appliance Pickup in Phoenix, Arizona",
              'Phoenix metro requests are reviewed based on condition, access and available coverage. '
              '<a href="../arizona-appliance-pickup/">View Arizona service areas</a>.'
          )

          write_page(
              "salt-lake-city-appliance-pickup",
              "Free Appliance Pickup Salt Lake City UT | Washer & Dryer Pickup",
              "Request qualifying appliance pickup in Salt Lake City Utah for washers, dryers, refrigerators, stoves and freezers.",
              "Free Appliance Pickup in Salt Lake City, Utah",
              'Salt Lake City and Wasatch Front requests are reviewed based on condition, access and available coverage. '
              '<a href="../utah-appliance-pickup/">View Utah service areas</a>.'
          )

          sitemap = Path("sitemap.xml")

          if sitemap.exists():
              text = sitemap.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )
          else:
              text = (
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                  '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
                  '</urlset>\n'
              )

          today = str(date.today())

          for slug in [
              "oregon-appliance-pickup",
              "arizona-appliance-pickup",
              "utah-appliance-pickup",
              "phoenix-appliance-pickup",
              "salt-lake-city-appliance-pickup"
          ]:
              url = BASE + slug + "/"

              if url not in text:
                  entry = (
                      f'  <url><loc>{url}</loc>'
                      f'<lastmod>{today}</lastmod></url>\n'
                  )

                  text = text.replace(
                      "</urlset>",
                      entry + "</urlset>"
                  )

          sitemap.write_text(
              text,
              encoding="utf-8"
          )

          Path("robots.txt").write_text(
              "User-agent: *\n"
              "Allow: /\n\n"
              "Sitemap: "
              + BASE
              + "sitemap.xml\n",
              encoding="utf-8"
          )

          required = [
              "oregon-appliance-pickup/index.html",
              "arizona-appliance-pickup/index.html",
              "utah-appliance-pickup/index.html",
              "phoenix-appliance-pickup/index.html",
              "salt-lake-city-appliance-pickup/index.html"
          ]

          missing = [
              x
              for x in required
              if not Path(x).exists()
          ]

          if missing:
              raise SystemExit(
                  "Missing files: "
                  + ", ".join(missing)
              )

          print("SEO STRUCTURE REPAIR SUCCESSFUL")
          PY

      - name: Commit repaired website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                    git add index.html \
            portland-appliance-pickup/index.html \
            sitemap.xml \
            robots.txt \
            oregon-appliance-pickup \
            arizona-appliance-pickup \
            utah-appliance-pickup \
            phoenix-appliance-pickup \
            salt-lake-city-appliance-pickup

          git diff --cached --quiet || \
            git commit -m "Complete SEO structure repair"

          git push
