name: Sitewide SEO Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Refresh sitemap and robots
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = "https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/"

          folders = [
              d.name
              for d in sorted(Path(".").glob("*-appliance-pickup"))
              if d.is_dir() and (d / "index.html").exists()
          ]

          urls = [base] + [
              base + folder + "/"
              for folder in folders
          ]

          sitemap = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]

          for url in urls:
              sitemap.append(
                  f"  <url><loc>{url}</loc></url>"
              )

          sitemap.append("</urlset>")

          Path("sitemap.xml").write_text(
              "\n".join(sitemap),
              encoding="utf-8"
          )

          robots = (
              "User-agent: *\n"
              "Allow: /\n"
              f"Sitemap: {base}sitemap.xml\n"
          )

          Path("robots.txt").write_text(
              robots,
              encoding="utf-8"
          )

          print("Pages found:", len(folders))
          print("Sitemap URLs:", len(urls))
          PY

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "Refresh sitewide SEO files"
          git push
