name: Sitewide SEO Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Refresh sitemap and internal links
