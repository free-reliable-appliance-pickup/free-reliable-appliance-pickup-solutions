name: Finalize Original City Laundry Heroes

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/laundry/original-user-heroes/**'
      - '.github/workflows/finalize-original-city-heroes.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify originals and switch city mappings
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          expected = {
              '/san-dimas-washer-dryer-pickup/': {
                  'file': '1000274641(3).jpg',
                  'size': 324184,
                  'sha256': 'a7ab8d1b61a51c493149ab1720e1c997c6a4bda451357c298cbdcea1b31a98e4',
              },
              '/la-verne-washer-dryer-pickup/': {
                  'file': '1000274683(5).jpg',
                  'size': 368294,
                  'sha256': '5b98b7088646d6e7d0df0c180793ea5a146d369588aa0a8e31664e80f81a7525',
              },
              '/claremont-washer-dryer-pickup/': {
                  'file': '1000274700(10).jpg',
                  'size': 511446,
                  'sha256': '87185bf73ea5d70fdb3eaf8a9e2e85d5c0343acfa188935485c012a5c5177251',
              },
          }

          source_dir = Path('assets/laundry/original-user-heroes')
          mapping_path = Path('assets/premium-user-heroes.json')
          mapping = json.loads(mapping_path.read_text(encoding='utf-8'))
          changed = []

          for page, spec in expected.items():
              source = source_dir / spec['file']
              if not source.is_file():
                  print(f'Waiting for exact original: {source}')
                  continue

              data = source.read_bytes()
              actual_size = len(data)
              actual_sha = hashlib.sha256(data).hexdigest()
              if actual_size != spec['size']:
                  raise SystemExit(f'REJECTED {source}: expected {spec["size"]} bytes, got {actual_size}')
              if actual_sha != spec['sha256']:
                  raise SystemExit(f'REJECTED {source}: SHA-256 mismatch')

              cfg = mapping[page]
              cfg['src'] = source.as_posix()
              cfg.pop('parts', None)
              cfg.pop('mime', None)
              cfg['source_status'] = 'original-full-resolution'
              changed.append(page)
              print(f'VERIFIED exact original: {page} -> {source}')

          if changed:
              mapping_path.write_text(json.dumps(mapping, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              print('Finalized:', ', '.join(changed))
          else:
              print('No new original city hero files were present.')

      - name: Confirm no image bytes were changed
        shell: bash
        run: |
          if git diff --name-only | grep -E '\.(jpe?g|png|webp)$'; then
            echo 'ERROR: this workflow must never modify image bytes.'
            exit 1
          fi
          echo 'PASS: workflow only changes the mapping after exact-byte verification.'

      - name: Commit finalized mappings
        shell: bash
        run: |
          if git diff --quiet -- assets/premium-user-heroes.json; then
            echo 'No mapping changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/premium-user-heroes.json
          git commit -m 'Use verified original full-resolution city heroes'
          git push
