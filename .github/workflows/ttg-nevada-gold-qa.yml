name: TTG Nevada Gold 250-page QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nevada:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check Nevada request form, photo and release gates
        run: python -m unittest discover -s tests -p 'test_ttg_nevada_pages.py' -v
