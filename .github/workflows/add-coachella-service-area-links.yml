name: Add Coachella service-area crawl links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-coachella-service-area-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add direct city links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('service-areas/index.html')
          s = p.read_text()
          marker = 'palm-springs-appliance-pickup/'
          if marker not in s:
              target = '<div class="card"><a href="https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/palm-desert-appliance-pickup/">Palm Desert Appliance Pickup</a></div>'
              extra = '''\n<div class="card"><a href="https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/palm-springs-appliance-pickup/">Palm Springs Appliance Pickup</a></div>\n<div class="card"><a href="https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/rancho-mirage-appliance-pickup/">Rancho Mirage Appliance Pickup</a></div>\n<div class="card"><a href="https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/la-quinta-appliance-pickup/">La Quinta Appliance Pickup</a></div>\n<div class="card"><a href="https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/cathedral-city-appliance-pickup/">Cathedral City Appliance Pickup</a></div>\n<div class="card"><a href="https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/indian-wells-appliance-pickup/">Indian Wells Appliance Pickup</a></div>'''
              if target not in s:
                  raise SystemExit('Palm Desert anchor not found')
              s = s.replace(target, target + extra, 1)
          s = s.replace('assets/free-reliable-appliance-pickup-logo.svg\">\n<meta property="og:image:alt" content="Free Reliable Appliance Pickup logo">', 'assets/major-appliance-pickup-photo-1.jpg\">\n<meta property="og:image:alt" content="Real major household appliance handled by Free Reliable Appliance Pickup">', 1)
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-areas/index.html
          git diff --cached --quiet || git commit -m "Strengthen service-area crawl links"
          git push
