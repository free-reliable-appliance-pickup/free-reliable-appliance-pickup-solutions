name: Validate market routing

on:
  push:
    paths:
      - 'data/**.json'
      - 'sitemap.xml'
      - 'index.html'
      - 'assets/customer-routing.js'
      - '**-appliance-pickup/index.html'
      - '.github/workflows/validate-market-routing.yml'
  pull_request:
    paths:
      - 'data/**.json'
      - 'sitemap.xml'
      - 'index.html'
      - 'assets/customer-routing.js'
      - '**-appliance-pickup/index.html'
      - '.github/workflows/validate-market-routing.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate routing safeguards
        run: |
          python - <<'PY'
          import json, pathlib, sys
          for p in pathlib.Path('data').glob('*.json'):
              json.loads(p.read_text())
          routing=json.loads(pathlib.Path('data/market-routing.json').read_text())
          rules=routing.get('rules',{})
          if routing.get('defaultStatus')!='request-only': sys.exit('defaultStatus must be request-only')
          if routing.get('defaultTerritoryStatus')!='available': sys.exit('defaultTerritoryStatus must be available')
          if rules.get('automaticCityPageCreation') is not False: sys.exit('automaticCityPageCreation must remain false')
          print('Routing JSON and SEO safety defaults validated')
          PY