name: Strengthen Arizona SEO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arizona-seo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Strengthen Arizona pages
        run: |
          python3 <<'PY'
          from pathlib import Path

          cities = [
              "phoenix","mesa","chandler","gilbert","glendale",
              "scottsdale","tempe","peoria","surprise","avondale",
              "goodyear","buckeye","queen-creek","tucson",
              "casa-grande","maricopa","apache-junction",
              "fountain-hills"
          ]

          for city in cities:
              file = Path(city + "-appliance-pickup/index.html")

              if not file.exists():
                  print("Missing:", file)
                  continue

              html = file.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              name = city.replace("-", " ").title()
              marker = "<!-- ARIZONA SEO BOOST -->"

              if marker in html:
                  print("Already updated:", name)
                  continue

              section = """
          <!-- ARIZONA SEO BOOST -->
          <section>
            <h2>Washer and Dryer Pickup in CITY, Arizona</h2>

            <p>
              Free Reliable Appliance Pickup provides qualifying appliance
              pickup in CITY for washers, dryers, refrigerators, stoves,
              ranges, freezers and other major household appliances.
            </p>

            <p>
              Washer and dryer pickup is one of our primary Arizona services.
              Working and reusable appliances may be prioritized for reuse.
            </p>

            <p>
              Free pickup qualification depends on appliance condition,
              local demand, accessibility and scheduling. Send clear photos
              and accurate condition information with your request.
            </p>

            <p>
              Use our online appliance pickup request form to submit appliance
              details, location information and photos for review.
            </p>
          </section>
          """.replace("CITY", name)

              if "</main>" in html:
                  html = html.replace(
                      "</main>",
                      section + "\n</main>",
                      1
                  )
              elif "</body>" in html:
                  html = html.replace(
                      "</body>",
                      section + "\n</body>",
                      1
                  )
              else:
                  html += section

              file.write_text(
                  html,
                  encoding="utf-8"
              )

              print("Updated:", name)

          PY

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Strengthen Arizona SEO"
          git push
