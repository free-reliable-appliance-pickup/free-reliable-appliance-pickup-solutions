name: One-Time City SEO Cleanup

on:
  push:
    paths:
      - '.github/workflows/seo-batch-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean priority city SEO
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          import re

          BASE='https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/'

          titles = {
            'chandler-appliance-pickup':'Free Appliance Pickup Chandler AZ | Appliance Removal',
            'keizer-appliance-pickup':'Free Appliance Pickup Keizer OR | Appliance Removal',
            'palm-desert-appliance-pickup':'Free Appliance Pickup Palm Desert CA | Appliance Removal',
            'riverside-county-appliance-pickup':'Free Appliance Pickup Riverside County | Appliance Removal',
            'san-bernardino-county-appliance-pickup':'Free Appliance Pickup San Bernardino County | Removal',
          }

          meta = {
            'chandler-appliance-pickup':'Free appliance pickup in Chandler, AZ for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal.',
            'keizer-appliance-pickup':'Free appliance pickup in Keizer, OR for qualifying washers, dryers, refrigerators, stoves and freezers. Request pickup online.',
            'palm-desert-appliance-pickup':'Free appliance pickup in Palm Desert, CA for qualifying washers, dryers, refrigerators, stoves and freezers. Request local pickup.',
            'riverside-county-appliance-pickup':'Free appliance pickup across Riverside County, CA for qualifying major appliances. Request washer, dryer, refrigerator, stove or freezer pickup.',
            'san-bernardino-county-appliance-pickup':'Free appliance pickup across San Bernardino County, CA for qualifying major appliances. Request local appliance removal and recycling.',
            'stockton-appliance-pickup':'Free appliance pickup in Stockton, CA for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal.',
            'palmdale-appliance-pickup':'Free appliance pickup in Palmdale, CA for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal.',
            'oxnard-appliance-pickup':'Free appliance pickup in Oxnard, CA for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal.',
            'san-francisco-appliance-pickup':'Free appliance pickup in San Francisco, CA for qualifying washers, dryers, refrigerators, stoves and freezers. Request local pickup.',
            'bakersfield-appliance-pickup':'Free appliance pickup in Bakersfield, CA for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal.',
            'modesto-appliance-pickup':'Free appliance pickup in Modesto, CA for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal.',
            'santa-rosa-appliance-pickup':'Free appliance pickup in Santa Rosa, CA for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal.',
            'oakland-appliance-pickup':'Free appliance pickup in Oakland, CA for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal.',
            'fresno-appliance-pickup':'Free appliance pickup in Fresno, CA for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal.',
            'sacramento-appliance-pickup':'Free appliance pickup in Sacramento, CA for qualifying washers, dryers, refrigerators, stoves and freezers. Request local pickup.',
            'san-jose-appliance-pickup':'Free appliance pickup in San Jose, CA for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal.',
            'san-diego-appliance-pickup':'Free appliance pickup in San Diego, CA for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal.',
            'aurora-appliance-pickup':'Free appliance pickup in Aurora, CO for qualifying washers, dryers, refrigerators, stoves and freezers. Request local appliance removal.',
          }

          local_sections = {
            'chandler-appliance-pickup': '''<section><h2>Chandler pickup details</h2><p>Chandler requests are reviewed for appliance condition, access and current East Valley route availability. Working washers and dryers are a priority, and working refrigerators, freezers and cooking appliances are also reviewed. Include your ZIP code, clear photos and whether the appliance is in a garage, first floor, upper floor or outside.</p><p>For refrigerators and freezers, tell us whether the appliance is plugged in and cooling. For laundry equipment, describe whether the washer fills, drains and spins and whether the dryer tumbles and heats. Complete information helps us evaluate a Chandler pickup request faster.</p></section>''',
            'mesa-appliance-pickup': '''<section><h2>Mesa pickup details</h2><p>Mesa appliance pickup requests are reviewed based on working condition, local demand, access and current route coverage. Working washer and dryer sets receive strong priority, along with reusable refrigerators, freezers, stoves and ranges. Photos of the appliance and model label help us review the request accurately.</p><p>Please include your Mesa ZIP code and explain stairs, narrow halls, gates or other access details. If you have more than one appliance, list every item and its condition so the complete load can be evaluated together.</p></section>'''
          }

          link_slugs = {
            'keizer-appliance-pickup':'oregon-appliance-pickup/',
            'palm-desert-appliance-pickup':'california-appliance-pickup/',
            'san-diego-appliance-pickup':'california-appliance-pickup/',
            'riverside-appliance-pickup':'california-appliance-pickup/',
            'aurora-appliance-pickup':'colorado-appliance-pickup/',
          }

          def inject_before_footer(text, block):
              if block in text:
                  return text
              if re.search(r'</footer>', text, re.I):
                  return re.sub(r'</footer>', block + '\n</footer>', text, count=1, flags=re.I)
              return re.sub(r'</body>', block + '\n</body>', text, count=1, flags=re.I)

          changed=[]
          slugs=set(titles)|set(meta)|set(local_sections)|set(link_slugs)
          for slug in sorted(slugs):
              path=Path(slug)/'index.html'
              if not path.exists():
                  continue
              text=path.read_text(encoding='utf-8', errors='ignore')
              original=text
              if slug in titles:
                  text=re.sub(r'<title>.*?</title>', '<title>'+titles[slug]+'</title>', text, count=1, flags=re.I|re.S)
              if slug in meta:
                  text=re.sub(r'<meta\s+name=["\']description["\']\s+content=["\'][^"\']*["\']\s*/?>', '<meta name="description" content="'+meta[slug]+'">', text, count=1, flags=re.I)
              if slug in local_sections and 'pickup details</h2>' not in text.lower():
                  if re.search(r'</main>', text, re.I):
                      text=re.sub(r'</main>', local_sections[slug]+'\n</main>', text, count=1, flags=re.I)
                  else:
                      text=inject_before_footer(text, local_sections[slug])
              if slug in link_slugs and 'Helpful Appliance Pickup Links' not in text:
                  state=BASE+link_slugs[slug]
                  block=f'''<section><h2>Helpful Appliance Pickup Links</h2><p><a href="{BASE}how-appliance-pickup-works/">How appliance pickup works</a> · <a href="{BASE}free-pickup-qualification/">What qualifies for free pickup</a> · <a href="{BASE}washer-dryer-pickup/">Washer and dryer pickup guide</a> · <a href="{BASE}refrigerator-pickup/">Refrigerator pickup guide</a> · <a href="{state}">State service page</a> · <a href="{BASE}service-areas/">All service areas</a></p></section>'''
                  if re.search(r'</main>', text, re.I):
                      text=re.sub(r'</main>', block+'\n</main>', text, count=1, flags=re.I)
                  else:
                      text=inject_before_footer(text, block)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          print('Changed', len(changed), 'files')
          for p in changed: print(p)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Improve city page snippets content and internal links'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main || true
          done
          echo 'Could not push cleanup after retries.'
          exit 1
