name: Strengthen Portland and Denver local signals

on:
  push:
    paths:
      - '.github/workflows/strengthen-portland-denver-local-signals.yml'

permissions:
  contents: write

jobs:
  patch-priority-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add focused local context and appliance guide links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          portland = Path('portland-appliance-pickup/index.html')
          p = portland.read_text()
          reps = {
            '<h3>Free Refrigerator Pickup</h3>':'<h3><a href="../refrigerator-pickup/">Free Refrigerator Pickup</a></h3>',
            '<h3>Free Washer Pickup</h3>':'<h3><a href="../washer-dryer-pickup/">Free Washer Pickup</a></h3>',
            '<h3>Free Dryer Pickup</h3>':'<h3><a href="../washer-dryer-pickup/">Free Dryer Pickup</a></h3>',
            '<h3>Free Stove & Range Pickup</h3>':'<h3><a href="../stove-oven-pickup/">Free Stove &amp; Range Pickup</a></h3>',
            '<h3>Free Freezer Pickup</h3>':'<h3><a href="../freezer-pickup/">Free Freezer Pickup</a></h3>'
          }
          for old,new in reps.items():
              if old not in p:
                  raise SystemExit(f'Portland block not found: {old}')
              p = p.replace(old,new,1)
          marker = '<section id="pickup-access">'
          local = '''<section id="portland-neighborhood-route-review">\n<h2>Portland Neighborhood &amp; Access Route Review</h2>\n<p>Qualifying requests may come from the Pearl District, Northwest Portland, Irvington, St. Johns, Sellwood-Moreland, inner Southeast Portland and other Portland neighborhoods. Neighborhood names help describe the pickup area, but the exact street address and ZIP code are used to review the current route.</p>\n<p>Apartment and condo requests should include elevator and loading information. Older houses, basement laundry areas and hillside properties may need stair, doorway, driveway or parking details before pickup can be confirmed.</p>\n</section>\n'''
          if marker not in p:
              raise SystemExit('Portland access marker not found')
          p = p.replace(marker, local + marker, 1)
          portland.write_text(p)

          denver = Path('denver-appliance-pickup/index.html')
          d = denver.read_text()
          reps = {
            '<div class="card"><h3>Washers</h3>':'<div class="card"><h3><a href="../washer-dryer-pickup/">Washers</a></h3>',
            '<div class="card"><h3>Dryers</h3>':'<div class="card"><h3><a href="../washer-dryer-pickup/">Dryers</a></h3>',
            '<div class="card"><h3>Refrigerators</h3>':'<div class="card"><h3><a href="../refrigerator-pickup/">Refrigerators</a></h3>',
            '<div class="card"><h3>Freezers</h3>':'<div class="card"><h3><a href="../freezer-pickup/">Freezers</a></h3>',
            '<div class="card"><h3>Stoves &amp; Ranges</h3>':'<div class="card"><h3><a href="../stove-oven-pickup/">Stoves &amp; Ranges</a></h3>'
          }
          for old,new in reps.items():
              if old not in d:
                  raise SystemExit(f'Denver block not found: {old}')
              d = d.replace(old,new,1)
          marker = '<section><h2>Denver Pickup Access</h2>'
          local = '''<section id="denver-neighborhood-route-review"><h2>Denver Neighborhood &amp; Access Route Review</h2><p>Qualifying requests may come from Downtown and LoDo, Capitol Hill, RiNo, Washington Park, Cherry Creek, Central Park and other Denver neighborhoods. The neighborhood helps describe the pickup area, but the exact street address and ZIP code are used to confirm current Denver and Aurora route coverage.</p><p>High-rise and condo requests should include elevator reservations and loading access. Houses with basements, detached garages, narrow entries or limited street parking should include those details with the appliance photos.</p></section>\n'''
          if marker not in d:
              raise SystemExit('Denver access marker not found')
          d = d.replace(marker, local + marker, 1)
          denver.write_text(d)
          PY
      - name: Commit local SEO improvements
        run: |
          if git diff --quiet -- portland-appliance-pickup/index.html denver-appliance-pickup/index.html; then
            echo 'No changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portland-appliance-pickup/index.html denver-appliance-pickup/index.html
          git commit -m 'Strengthen Portland and Denver local SEO signals'
          git push
