# Revalidated after customer-routing integration.
name: Final SEO safety audit
on:
  push:
    branches: [main]
    paths: ['**/index.html','index.html','sitemap.xml','sitemap-regular-washer-dryer.xml','robots.txt','data/market-routing.json','data/approved-indexable-locations.txt','.github/workflows/final-seo-safety-audit.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit indexable pages, approved markets, canonicals, sitemaps and retired-link leaks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          base='https://freereliableappliancepickup.com/'
          approved_locations=set(Path('data/approved-indexable-locations.txt').read_text(encoding='utf-8').split())
          recruiting_noindex_locations={'phoenix-metro-appliance-pickup','treasure-valley-appliance-pickup','wasatch-front-appliance-pickup'}
          approved_nonlocation={'','about','appliance-pickup-checklist','contact','free-pickup-qualification','freezer-pickup','how-appliance-pickup-works','landlord-property-manager-appliance-pickup','old-appliance-disposal-options','partners','refrigerator-pickup','service-areas','stove-oven-pickup','washer-dryer-pickup'}
          approved=approved_locations|approved_nonlocation
          errors=[]
          pages=[Path('index.html')]+sorted(p for p in Path('.').rglob('index.html') if '.git' not in p.parts and '.github' not in p.parts and p!=Path('index.html'))
          indexable=[]
          for p in pages:
              s=p.read_text(encoding='utf-8',errors='ignore'); low=s.lower()
              rel='' if p==Path('index.html') else p.parent.as_posix().strip('/')
              is_indexable='noindex' not in low
              if rel in recruiting_noindex_locations and is_indexable: errors.append(f'RECRUITING LOCATION MUST BE NOINDEX {p}')
              if not is_indexable: continue
              indexable.append(p)
              if rel not in approved: errors.append(f'UNAPPROVED INDEXABLE PATH {p} ({rel})')
              if rel.endswith('-appliance-pickup') and rel not in approved_locations and rel not in approved_nonlocation: errors.append(f'UNAPPROVED INDEXABLE LOCATION {p}')
              c=re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',s,re.I)
              if not c: errors.append(f'MISSING CANONICAL {p}')
              elif not c[0].startswith(base): errors.append(f'BAD CANONICAL {p}: {c[0]}')
              if '<title>' not in low: errors.append(f'MISSING TITLE {p}')
              if '<h1' not in low: errors.append(f'MISSING H1 {p}')
          for slug in sorted(approved_locations):
              p=Path(slug)/'index.html'
              if not p.exists(): errors.append(f'APPROVED LOCATION MISSING {p}'); continue
              if 'noindex' in p.read_text(encoding='utf-8',errors='ignore').lower(): errors.append(f'APPROVED LOCATION NOINDEX {p}')
          for slug in recruiting_noindex_locations:
              p=Path(slug)/'index.html'
              if p.exists() and 'noindex' not in p.read_text(encoding='utf-8',errors='ignore').lower(): errors.append(f'RECRUITING LOCATION INDEXABLE {p}')
          sitemap_files=[Path('sitemap.xml'),Path('sitemap-regular-washer-dryer.xml')]
          locs=set()
          for sitemap_file in sitemap_files:
              if sitemap_file.exists():
                  sitemap=sitemap_file.read_text(encoding='utf-8',errors='ignore')
                  locs.update(re.findall(r'<loc>(.*?)</loc>',sitemap))
          for p in indexable:
              rel='' if p==Path('index.html') else p.parent.as_posix().strip('/')+'/'
              url=base+rel
              if url not in locs: errors.append(f'INDEXABLE NOT IN SITEMAPS {p} -> {url}')
          for url in sorted(locs):
              if not url.startswith(base): errors.append(f'FOREIGN SITEMAP URL {url}'); continue
              rel=url[len(base):].strip('/')
              if rel not in approved: errors.append(f'UNAPPROVED SITEMAP URL {url}')
          retired=['wheat-ridge']
          for p in indexable:
              s=p.read_text(encoding='utf-8',errors='ignore').lower()
              for r in retired:
                  if f'href="/{r}/' in s or f"href='/{r}/" in s or f'href="../{r}/' in s or f"href='../{r}/" in s: errors.append(f'RETIRED LINK LEAK {p}: {r}')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print(f'PASS: {len(indexable)} indexable HTML pages checked; approved paths, sitemaps, canonicals, titles, H1s and retired-link checks clean')
          PY
