name: Add homepage priority crawl links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-homepage-priority-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Palm Springs and Stockton links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          palm = '<div class="card"><h3><a href="palm-desert-appliance-pickup/">Palm Desert, California</a></h3><p>Palm Desert and selected Coachella Valley appliance pickup requests.</p></div>'
          palm_springs = '\n<div class="card"><h3><a href="palm-springs-appliance-pickup/">Palm Springs, California</a></h3><p>Palm Springs and Coachella Valley appliance pickup requests.</p></div>'
          if 'href="palm-springs-appliance-pickup/"' not in s:
              if palm not in s:
                  raise SystemExit('Palm Desert homepage anchor not found')
              s = s.replace(palm, palm + palm_springs, 1)
          orange = '<div class="card"><h3><a href="orange-county-appliance-pickup/">Orange County, California</a></h3></div>'
          stockton = '\n<div class="card"><h3><a href="stockton-appliance-pickup/">Stockton, California</a></h3><p>Stockton and Central Valley qualifying appliance pickup requests.</p></div>'
          if 'href="stockton-appliance-pickup/"' not in s:
              if orange not in s:
                  raise SystemExit('Orange County homepage anchor not found')
              s = s.replace(orange, orange + stockton, 1)
          p.write_text(s)
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Strengthen homepage priority city links"
          git push
