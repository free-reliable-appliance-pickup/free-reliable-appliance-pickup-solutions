name: Temporary laundry image match

on:
  push:
    paths:
      - '.github/workflows/tmp-laundry-image-match.yml'

permissions:
  contents: write

jobs:
  match-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare gallery images with repository originals
        run: |
          python -m pip install --quiet pillow imagehash
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import imagehash

          targets = [
              Path('assets/laundry/washer-dryer-set.jpg'),
              Path('assets/laundry/front-load-laundry-set.jpg'),
              Path('assets/laundry/stacked-laundry-center.jpg'),
              Path('assets/laundry/top-load-washer.jpg'),
              Path('assets/laundry/front-load-dryer.jpg'),
              Path('assets/laundry/laundry-pair.jpg'),
          ]
          exts = {'.jpg', '.jpeg', '.png', '.webp'}
          candidates = [p for p in Path('.').iterdir() if p.is_file() and p.suffix.lower() in exts]

          def hashes(path):
              with Image.open(path) as im:
                  im = ImageOps.exif_transpose(im).convert('RGB')
                  size = im.size
                  return (
                      imagehash.phash(im, hash_size=16),
                      imagehash.dhash(im, hash_size=16),
                      imagehash.average_hash(im, hash_size=16),
                      size,
                  )

          candidate_hashes = {}
          for p in candidates:
              try:
                  candidate_hashes[p] = hashes(p)
              except Exception as e:
                  print(f'SKIP {p}: {e}')

          lines = []
          lines.append(f'Candidates scanned: {len(candidate_hashes)}')
          lines.append('Lower score means closer visual match. Exact/near-exact resized copies should score very low.')
          lines.append('')
          for target in targets:
              th = hashes(target)
              scored = []
              for p, ch in candidate_hashes.items():
                  # Perceptual + edge + average hashes. pHash carries most weight.
                  score = (th[0] - ch[0]) * 3 + (th[1] - ch[1]) + (th[2] - ch[2])
                  scored.append((score, th[0] - ch[0], th[1] - ch[1], th[2] - ch[2], p, ch[3]))
              scored.sort(key=lambda x: x[0])
              lines.append(f'TARGET: {target} | dimensions={th[3]} | bytes={target.stat().st_size}')
              for score, pd, dd, ad, p, size in scored[:8]:
                  lines.append(f'  score={score:4d} phash={pd:3d} dhash={dd:3d} ahash={ad:3d} candidate={p} dimensions={size} bytes={p.stat().st_size}')
              lines.append('')

          report = '\n'.join(lines) + '\n'
          print(report)
          Path('laundry-image-match-report.txt').write_text(report, encoding='utf-8')
          PY
      - name: Save match report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laundry-image-match-report.txt
          git diff --cached --quiet || git commit -m 'Report laundry image source matches'
          git push
