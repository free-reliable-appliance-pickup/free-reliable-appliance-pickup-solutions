name: Platform V2 Build Check

on:
  push:
    branches:
      - platform-v2-astro
    paths:
      - "platform-v2/**"
      - ".github/workflows/platform-v2-check.yml"
  pull_request:
    paths:
      - "platform-v2/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Platform V2
        run: npm run build

      - name: Verify Astro Cloudflare output
        run: |
          test -f dist/_worker.js/index.js
          test -d dist
          test -d dist/_astro

      - name: Verify staging robots protection
        run: |
          test -f dist/robots.txt
          grep -q "Disallow: /" dist/robots.txt

      - name: Validate staging deploy bundle
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
