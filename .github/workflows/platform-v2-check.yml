name: Platform V2 Build Check

on:
  push:
    branches:
      - platform-v2-astro
    paths:
      - "platform-v2/**"
      - ".github/workflows/platform-v2-check.yml"
  pull_request:
    paths:
      - "platform-v2/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Platform V2
        run: npm run build

      - name: Inspect Astro Cloudflare output
        run: |
          find dist -maxdepth 3 -type f -print | sort
          test -d dist/server
          test -d dist/client

      - name: Verify staging robots protection
        run: |
          test -f dist/client/robots.txt
          grep -q "Disallow: /" dist/client/robots.txt

      - name: Validate generated deployment config
        run: |
          if [ -f dist/server/wrangler.json ]; then
            npx wrangler deploy --dry-run --config dist/server/wrangler.json
          elif [ -f dist/server/wrangler.jsonc ]; then
            npx wrangler deploy --dry-run --config dist/server/wrangler.jsonc
          else
            echo "Generated Wrangler config not found."
            exit 1
          fi
