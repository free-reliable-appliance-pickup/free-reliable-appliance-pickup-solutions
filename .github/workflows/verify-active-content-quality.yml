# Recheck after doorway-page consolidation
# Final verification after nationwide and regional cleanup
name: Verify Active Content Quality

on:
  push:
    paths:
      - '.github/workflows/verify-active-content-quality.yml'
      - 'sitemap.xml'
      - 'data/approved-indexable-locations.txt'
      - 'data/seo-experiments.json'
      - '**/index.html'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check active sitemap core-content similarity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html, itertools, json, xml.etree.ElementTree as ET
          from datetime import date

          BASE='https://freereliableappliancepickup.com/'
          INFORMATIONAL={'landlord-property-manager-appliance-pickup'}

          protected_until_review=set()
          exp_path=Path('data/seo-experiments.json')
          if exp_path.exists():
              try:
                  exp_data=json.loads(exp_path.read_text(encoding='utf-8'))
                  today=date.today()
                  for exp in exp_data.get('experiments',[]):
                      if exp.get('status')!='running' or not exp.get('evaluateNotBefore'):
                          continue
                      try:
                          if today >= date.fromisoformat(exp['evaluateNotBefore']):
                              continue
                      except ValueError:
                          continue
                      pages=list(exp.get('pagesChanged',[]) or [])
                      pages += list(exp.get('protectedOwners',[]) or [])
                      if exp.get('protectedOwner'):
                          pages.append(exp['protectedOwner'])
                      for page in pages:
                          slug=(page or '').strip('/')
                          if slug:
                              protected_until_review.add(slug)
              except Exception as exc:
                  print('EXPERIMENT_GUARD_PARSE_WARNING',exc)
          root=ET.parse('sitemap.xml').getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          active=[]
          for el in root.findall('.//s:loc',ns):
              if not el.text: continue
              u=el.text.strip()
              if u.startswith(BASE):
                  slug=u[len(BASE):].strip('/')
                  if slug in INFORMATIONAL:
                      continue
                  if slug and slug.endswith('-appliance-pickup') and (Path(slug)/'index.html').exists():
                      active.append(slug)

          def visible_words(raw, core=False):
              x=raw
              for tag in ['script','style']:
                  x=re.sub(rf'<{tag}\b[^>]*>.*?</{tag}>',' ',x,flags=re.I|re.S)
              if core:
                  for tag in ['form','nav','header','footer']:
                      x=re.sub(rf'<{tag}\b[^>]*>.*?</{tag}>',' ',x,flags=re.I|re.S)
              x=re.sub(r'<!--.*?-->',' ',x,flags=re.S)
              x=re.sub(r'<[^>]+>',' ',x)
              x=html.unescape(x).lower()
              x=re.sub(r'\b\d{3}[-.)\s]*\d{3}[-.\s]*\d{4}\b',' phone ',x)
              x=re.sub(r'\b\d{5}(?:-\d{4})?\b',' zip ',x)
              return re.findall(r"[a-z0-9']+",x)

          def shingles(ws,n=5):
              return {' '.join(ws[i:i+n]) for i in range(max(0,len(ws)-n+1))}

          rows=[]
          for slug in active:
              raw=(Path(slug)/'index.html').read_text(encoding='utf-8',errors='ignore')
              all_words=visible_words(raw,False)
              core_words=visible_words(raw,True)
              tokens=set(slug.replace('-appliance-pickup','').split('-'))
              norm=['city' if w in tokens and len(w)>2 else w for w in core_words]
              rows.append({
                  'slug':slug,'words':len(all_words),'core_words':len(core_words),
                  'form':'formspree.io/f/mvzeapzd' in raw,
                  'funnel':'../#request' in raw or 'free-reliable-appliance-pickup-solutions/#request' in raw,
                  'noindex':bool(re.search(r'<meta\s+name=["\']robots["\'][^>]*noindex',raw,re.I)),
                  'sh':shingles(norm)
              })

          print('ACTIVE_LOCATION_MARKET_PAGES',len(rows))
          print('WITH_LOCAL_FORM',sum(r['form'] for r in rows))
          missing_forms=[r['slug'] for r in rows if not r['form']]
          if missing_forms:
              print('MISSING_LOCAL_FORM',','.join(missing_forms))
          print('STILL_FUNNELING_HOME',sum(r['funnel'] for r in rows))
          print('NOINDEX_ACTIVE',sum(r['noindex'] for r in rows))
          print('UNDER_350_TOTAL_WORDS',sum(r['words']<350 for r in rows))
          thin=[r for r in rows if r['core_words']<300]
          print('UNDER_300_CORE_WORDS',len(thin))

          if any(r['noindex'] for r in rows):
              bad=[r['slug'] for r in rows if r['noindex']]
              raise SystemExit(f'Indexable sitemap market pages must not be noindex: {bad}')
          if thin:
              bad=[f"{r['slug']} ({r['core_words']} core words)" for r in thin]
              raise SystemExit('Indexable location pages must contain at least 300 core words of visible non-form content: '+', '.join(bad))

          pairs=[]
          for a,b in itertools.combinations(rows,2):
              union=a['sh']|b['sh']; inter=a['sh']&b['sh']
              score=len(inter)/len(union) if union else 0
              pairs.append((score,a['slug'],b['slug']))
          ranked=sorted(pairs,reverse=True)
          print('\nMOST_SIMILAR_CORE_CONTENT_PAIRS')
          for score,a,b in ranked[:30]:
              print(f'{score:.3f} | {a} <-> {b}')
          near_clones=[(score,a,b) for score,a,b in ranked if score>=0.65]
          deferred=[]
          actionable=[]
          for item in near_clones:
              score,a,b=item
              if a in protected_until_review or b in protected_until_review:
                  deferred.append(item)
              else:
                  actionable.append(item)

          if deferred:
              print('\nDEFERRED_PROTECTED_EXPERIMENT_SIMILARITY')
              for score,a,b in deferred[:30]:
                  print(f'WARNING {score:.3f} | {a} <-> {b} | protected ranking experiment still inside observation window')

          if actionable:
              examples='; '.join(f'{score:.3f} {a} <-> {b}' for score,a,b in actionable[:10])
              raise SystemExit('Near-duplicate indexable location pages exceed the 0.65 normalized 5-word-shingle similarity ceiling outside protected experiments: '+examples)

          print('\nLOWEST_CORE_WORD_COUNTS')
          for r in sorted(rows,key=lambda x:x['core_words'])[:25]:
              print(f"core={r['core_words']:4d} total={r['words']:4d} | {r['slug']}")
          PY
