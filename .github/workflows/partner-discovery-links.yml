name: One-Time Partner Discovery Links

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/partner-discovery-links.yml'

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Connect partner hub across the crawl graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/scripts/partner_discovery_links.py
          rm -f .github/scripts/partner_discovery_links.py
          rm -f .github/workflows/partner-discovery-links.yml
          git add -A
          git commit -m "Connect partner hub across site crawl graph" || exit 0
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep 2
          done
          exit 1
