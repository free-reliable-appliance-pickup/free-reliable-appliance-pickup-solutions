name: Migrate site to custom domain

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old GitHub Pages base URL in public site files
        shell: bash
        run: |
          set -euo pipefail
          OLD='https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions'
          NEW='https://freereliableappliancepickup.com'

          while IFS= read -r -d '' file; do
            sed -i "s#${OLD}#${NEW}#g" "$file"
          done < <(
            find . \
              -path './.git' -prune -o \
              -path './.github' -prune -o \
              -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' -o -name '*.json' \) \
              -print0
          )

          printf '%s\n' 'freereliableappliancepickup.com' > CNAME

          if grep -RIl --exclude-dir=.git --exclude-dir=.github \
            'https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions' \
            . --include='*.html' --include='*.xml' --include='*.txt' --include='*.json'; then
            echo 'Old GitHub Pages URLs still remain in public site files.'
            exit 1
          fi

          if [ -f robots.txt ]; then
            grep -Fq 'Sitemap: https://freereliableappliancepickup.com/sitemap.xml' robots.txt
          fi
          if [ -f sitemap.xml ]; then
            grep -Fq '<loc>https://freereliableappliancepickup.com/' sitemap.xml
          fi

      - name: Remove one-time workflow and commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/migrate-custom-domain.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes were needed.'
            exit 0
          fi
          git commit -m 'Switch public site URLs to custom domain'
          git push
