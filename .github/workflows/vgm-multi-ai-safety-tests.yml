name: VGM Multi-AI Reviewer Safety Tests

on:
  pull_request:
    paths:
      - 'scripts/vgm_multi_ai_review.py'
      - 'tests/test_vgm_multi_ai_review.py'
      - '.github/workflows/vgm-independent-multi-ai.yml'
      - '.github/workflows/vgm-multi-ai-safety-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile independent review code
        run: python -m py_compile scripts/vgm_multi_ai_review.py tests/test_vgm_multi_ai_review.py
      - name: Run 12 no-cost unit tests
        run: python -m unittest discover -s tests -p 'test_vgm_multi_ai_review.py' -v
