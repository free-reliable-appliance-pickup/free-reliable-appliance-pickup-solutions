name: Improve partner authority page

on:
  push:
    paths:
      - '.github/workflows/improve-partner-authority-page.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix partner SEO audit and add verification resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('partners/index.html')
          text = path.read_text()
          changed = False

          new_desc = 'Apply to join the Free Reliable Appliance Pickup partner network. Choose service areas and share your vehicle, experience, capacity and response time.'
          updated, count = re.subn(
              r'<meta name="description" content="[^"]*">',
              f'<meta name="description" content="{new_desc}">',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one meta description, found {count}')
          if updated != text:
              text = updated
              changed = True

          logo_url = 'https://freereliableappliancepickup.com/file_00000000b7c082308dccc73e5bd3acd2.png'
          org_old = '{"@type":"Organization","@id":"https://freereliableappliancepickup.com/#organization","name":"Free Reliable Appliance Pickup","url":"https://freereliableappliancepickup.com/"}'
          org_new = '{"@type":"Organization","@id":"https://freereliableappliancepickup.com/#organization","name":"Free Reliable Appliance Pickup","url":"https://freereliableappliancepickup.com/","logo":"' + logo_url + '"}'
          if org_new not in text:
              if org_old not in text:
                  raise SystemExit('Expected Organization schema without logo not found')
              text = text.replace(org_old, org_new, 1)
              changed = True

          marker = '<section class="card" id="territories">'
          section = '''<section class="card" id="partner-verification"><h2>Partner Announcement &amp; Verification Resources</h2><p>Approved network partners may publish a factual announcement on their own website, newsroom or business profile explaining that they support appliance pickup requests through the Free Reliable Appliance Pickup network. Announcements should describe only the markets and capabilities that have actually been approved.</p><div class="steps"><div class="step"><strong>Official Network Identity</strong>Use the business name <em>Free Reliable Appliance Pickup</em> and the official website <a href="https://freereliableappliancepickup.com/">freereliableappliancepickup.com</a> when identifying the network.</div><div class="step"><strong>Factual Announcement Example</strong>“Our business has been approved to support appliance pickup requests through the Free Reliable Appliance Pickup network in our confirmed service area.” Add your own approved cities and capabilities.</div><div class="step"><strong>Accuracy Standards</strong>Do not claim exclusivity, guaranteed lead volume, nationwide personal coverage, a company-owned fleet or guaranteed free pickup unless that statement has been specifically confirmed.</div><div class="step"><strong>Optional Source Link</strong>If useful to readers, an announcement may link to the official website or this Partner Program page as the source for network information. A link is optional and is never a condition of partnership or approval.</div></div><div class="green"><strong>Relationship verification:</strong> Third parties reviewing a partner announcement can use this Partner Program page and the official contact information on the website to confirm the network identity. Individual territory status remains subject to the partner’s current approval.</div></section>'''

          if 'id="partner-verification"' not in text:
              if marker not in text:
                  raise SystemExit('Territories insertion marker not found')
              text = text.replace(marker, section + marker, 1)
              changed = True

          if changed:
              path.write_text(text)
              print('Updated partners/index.html')
          else:
              print('No changes needed')
          PY
      - name: Commit partner authority improvement
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add partners/index.html
          git commit -m 'Improve partner verification and authority resources'
          git push
