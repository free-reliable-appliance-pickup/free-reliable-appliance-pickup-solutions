# Recheck after 2026-10-03 internal-link strengthening
name: Audit Internal Link Graph

on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - 'index.html'
      - 'service-areas/index.html'
      - 'california-appliance-pickup/index.html'
      - '*-appliance-pickup/index.html'
      - 'refrigerator-pickup/index.html'
      - '*-refrigerator-pickup/index.html'
      - 'data/seo-experiments.json'
      - 'freezer-pickup/index.html'
      - 'stove-oven-pickup/index.html'
      - 'washer-dryer-pickup/index.html'
      - 'data/california-priority-gold-city-pages.txt'
      - '.github/workflows/audit-internal-link-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Analyze sitemap crawl depth and internal links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from collections import defaultdict, deque
          import re, xml.etree.ElementTree as ET

          BASE='https://freereliableappliancepickup.com/'
          HOST='freereliableappliancepickup.com'

          root=ET.parse('sitemap.xml').getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          sitemap_urls=[el.text.strip() for el in root.findall('.//s:loc',ns) if el.text]
          active=set(sitemap_urls)

          def url_to_file(url):
              if url.rstrip('/')==BASE.rstrip('/'):
                  return Path('index.html')
              if not url.startswith(BASE): return None
              rel=url[len(BASE):].split('#',1)[0].split('?',1)[0].strip('/')
              if not rel: return Path('index.html')
              p=Path(rel)
              return p if p.suffix else p/'index.html'

          graph=defaultdict(set)
          inlinks=defaultdict(set)
          broken=[]
          href_re=re.compile(r'href\s*=\s*["\']([^"\']+)["\']',re.I)

          for src in sitemap_urls:
              fp=url_to_file(src)
              if not fp or not fp.exists():
                  print('MISSING_SITEMAP_FILE',src,fp)
                  continue
              raw=fp.read_text(encoding='utf-8',errors='ignore')
              for href in href_re.findall(raw):
                  href=href.strip()
                  if not href or href.startswith(('#','mailto:','tel:','javascript:','data:')):
                      continue
                  dest=urljoin(src,href)
                  parsed=urlparse(dest)
                  if parsed.netloc!=HOST:
                      continue
                  clean=parsed._replace(fragment='',query='').geturl()
                  if clean.endswith('/index.html'):
                      clean=clean[:-10]
                  rel=parsed.path.strip('/')
                  candidate=Path(rel)
                  if rel and not candidate.suffix and (candidate/'index.html').exists():
                      clean=BASE+rel+'/'
                  elif not rel:
                      clean=BASE
                  graph[src].add(clean)
                  inlinks[clean].add(src)
                  target=url_to_file(clean)
                  if target is not None and not target.exists():
                      broken.append((src,clean,str(target)))

          depths={BASE:0}
          q=deque([BASE])
          while q:
              u=q.popleft()
              for v in graph.get(u,()):
                  if v in active and v not in depths:
                      depths[v]=depths[u]+1
                      q.append(v)

          print('SITEMAP_URLS',len(sitemap_urls))
          print('REACHABLE_FROM_HOME',sum(u in depths for u in sitemap_urls))
          print('UNREACHABLE_FROM_HOME',sum(u not in depths for u in sitemap_urls))
          print('BROKEN_INTERNAL_TARGETS',len(set(broken)))
          print('ZERO_ACTIVE_INLINKS',sum(not (inlinks.get(u,set()) & active) for u in sitemap_urls if u!=BASE))

          print('\nCRAWL_DEPTH_DISTRIBUTION')
          for d in sorted(set(depths.values())):
              print(d,sum(1 for u in sitemap_urls if depths.get(u)==d))

          print('\nUNREACHABLE_ACTIVE_URLS')
          for u in sitemap_urls:
              if u not in depths: print(u)

          print('\nLOWEST_ACTIVE_INLINK_COUNTS')
          rows=[]
          for u in sitemap_urls:
              if u==BASE: continue
              count=len(inlinks.get(u,set()) & active)
              rows.append((count,depths.get(u,999),u))
          for count,depth,u in sorted(rows)[:30]:
              print(f'inlinks={count:2d} depth={depth if depth<999 else "NA"} | {u}')

          print('\nPRIORITY_CALIFORNIA_INLINKS')
          priority_slugs=[
              x.strip()
              for x in Path('data/california-priority-gold-city-pages.txt').read_text(encoding='utf-8').splitlines()
              if x.strip()
          ]
          for slug in priority_slugs:
              u=BASE+slug+'/'
              count=len(inlinks.get(u,set()) & active)
              depth=depths.get(u,999)
              print(f'inlinks={count:2d} depth={depth if depth<999 else "NA"} | {u}')

          print('\nREFRIGERATOR_CITY_HANDOFF_AUDIT')
          import json
          exp_data=json.loads(Path('data/seo-experiments.json').read_text(encoding='utf-8'))
          experiments=exp_data if isinstance(exp_data,list) else exp_data.get('experiments',[])
          def touching_running_experiments(path):
              hits=[]
              for exp in experiments:
                  if exp.get('status')!='running':
                      continue
                  touched=[]
                  touched.extend(exp.get('pagesChanged') or [])
                  if exp.get('protectedOwner'):
                      touched.append(exp.get('protectedOwner'))
                  touched.extend(exp.get('protectedOwners') or [])
                  if path in touched:
                      hits.append(exp)
              return hits

          fridge_urls=[u for u in sitemap_urls if u.rstrip('/').endswith('-refrigerator-pickup')]
          fridge_rows=[]
          for u in fridge_urls:
              slug=urlparse(u).path.strip('/')
              city=slug[:-len('-refrigerator-pickup')]
              general=BASE+city+'-appliance-pickup/'
              has_direct=general in inlinks.get(u,set())
              direct_active=general in active
              general_path='/'+city+'-appliance-pickup/'
              fridge_path='/'+slug+'/'
              freeze_dates=[]
              for exp in touching_running_experiments(general_path)+touching_running_experiments(fridge_path):
                  d=exp.get('evaluateNotBefore')
                  if d:
                      freeze_dates.append(d)
              effective_gate=max(freeze_dates) if freeze_dates else 'unfrozen'
              fridge_rows.append((0 if has_direct else 1,effective_gate,slug,direct_active,has_direct))
          for missing,effective_gate,slug,direct_active,has_direct in sorted(fridge_rows, key=lambda r:(-r[0],r[1],r[2])):
              print(f'{slug}: city_owner_active={direct_active} direct_city_handoff={has_direct} effective_gate={effective_gate}')
          print('REFRIGERATOR_MISSING_DIRECT_CITY_HANDOFFS',sum(m for m,_,_,_,_ in fridge_rows))

          print('\nBROKEN_INTERNAL_LINKS')
          for src,dest,target in sorted(set(broken))[:100]:
              print(src,'->',dest,'| missing',target)
          PY
