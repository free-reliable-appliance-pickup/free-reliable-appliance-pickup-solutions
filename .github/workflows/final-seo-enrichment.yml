name: One-Time Final SEO Enrichment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-seo-enrichment.yml

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add real-photo, state hierarchy, site identity and sitemap signals
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 <<'PY'
          from pathlib import Path
          import re, json, html, subprocess
          from datetime import date

          BASE='https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/'
          photos=['major-appliance-pickup-photo-1.jpg','major-appliance-pickup-photo-2.jpg','major-appliance-pickup-photo-3.jpg']

          # Homepage: explicit WebSite identity signal.
          hp=Path('index.html')
          t=hp.read_text(encoding='utf-8')
          if '"@type":"WebSite"' not in t and '"@type": "WebSite"' not in t:
              website={"@context":"https://schema.org","@type":"WebSite","@id":BASE+'#website',"url":BASE,"name":"Free Reliable Appliance Pickup","alternateName":"Reliable Appliance Pickup","publisher":{"@id":BASE+'#organization'}}
              tag='<script type="application/ld+json">'+json.dumps(website,separators=(',',':'))+'</script>\n'
              t=re.sub(r'</head>',tag+'</head>',t,count=1,flags=re.I)
              hp.write_text(t,encoding='utf-8')

          # State hubs get the same clear hierarchy competitors use.
          states={
            'california-appliance-pickup/index.html':'California',
            'oregon-appliance-pickup/index.html':'Oregon',
            'washington-appliance-pickup/index.html':'Washington',
            'arizona-appliance-pickup/index.html':'Arizona',
            'colorado-appliance-pickup/index.html':'Colorado',
            'nevada-appliance-pickup/index.html':'Nevada',
            'utah-appliance-pickup/index.html':'Utah',
            'idaho-appliance-pickup/index.html':'Idaho',
          }
          for i,(filename,state) in enumerate(states.items()):
              p=Path(filename)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8',errors='ignore')
              page_url=BASE+p.parent.as_posix().strip('/')+'/'
              if '"@type":"BreadcrumbList"' not in s and '"@type": "BreadcrumbList"' not in s:
                  data={"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
                    {"@type":"ListItem","position":1,"name":"Home","item":BASE},
                    {"@type":"ListItem","position":2,"name":"Service Areas","item":BASE+'service-areas/'},
                    {"@type":"ListItem","position":3,"name":state,"item":page_url}]}
                  s=re.sub(r'</head>','<script type="application/ld+json">'+json.dumps(data,separators=(',',':'))+'</script>\n</head>',s,count=1,flags=re.I)
              if 'class="seo-breadcrumb"' not in s:
                  crumb=f'<div class="seo-breadcrumb" role="navigation" aria-label="Breadcrumb" style="max-width:1050px;margin:12px auto;padding:0 18px;font:14px/1.5 Arial,sans-serif"><a href="../" style="color:#075c34">Home</a> &rsaquo; <a href="../service-areas/" style="color:#075c34">Service Areas</a> &rsaquo; <span>{html.escape(state)}</span></div>'
                  s=re.sub(r'(<body\b[^>]*>)',r'\1\n'+crumb,s,count=1,flags=re.I)
              if 'class="real-appliance-proof"' not in s:
                  photo=photos[i%len(photos)]
                  proof=f'''<section class="real-appliance-proof"><h2>Real Appliance Example</h2><figure style="margin:0;max-width:720px"><img src="../assets/{photo}" alt="Example major household appliance handled by Free Reliable Appliance Pickup" loading="lazy" decoding="async" style="width:100%;height:auto;border-radius:10px"><figcaption>Real appliance photo from our work and inventory. Pickup eligibility depends on appliance condition, location, access and available coverage.</figcaption></figure></section>'''
                  if '</main>' in s: s=s.replace('</main>',proof+'\n</main>',1)
              if 'href="../contact/"' not in s:
                  trust='<p><a href="../contact/">Contact</a> · <a href="../about/">About</a> · <a href="../privacy/">Privacy</a> · <a href="../terms/">Service Terms</a></p>'
                  s=re.sub(r'</footer>',trust+'\n</footer>',s,count=1,flags=re.I)
              p.write_text(s,encoding='utf-8')

          # Priority city/region pages: use visible, real images rather than logo-only pages.
          city_pages=[
            'portland-appliance-pickup/index.html','salem-appliance-pickup/index.html','keizer-appliance-pickup/index.html',
            'denver-appliance-pickup/index.html','aurora-appliance-pickup/index.html','los-angeles-appliance-pickup/index.html',
            'orange-county-appliance-pickup/index.html','inland-empire-appliance-pickup/index.html','riverside-appliance-pickup/index.html',
            'riverside-county-appliance-pickup/index.html','palm-desert-appliance-pickup/index.html','san-bernardino-county-appliance-pickup/index.html',
            'san-diego-appliance-pickup/index.html','stockton-appliance-pickup/index.html','phoenix-appliance-pickup/index.html',
            'seattle-appliance-pickup/index.html','las-vegas-appliance-pickup/index.html']
          for i,filename in enumerate(city_pages):
              p=Path(filename)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8',errors='ignore')
              if 'class="real-appliance-proof"' not in s:
                  photo=photos[i%len(photos)]
                  proof=f'''<section class="real-appliance-proof"><h2>Real Appliance Example</h2><figure style="margin:0;max-width:720px"><img src="../assets/{photo}" alt="Example major household appliance handled by Free Reliable Appliance Pickup" loading="lazy" decoding="async" style="width:100%;height:auto;border-radius:10px"><figcaption>Real appliance photo from our work and inventory. It is not a stock image and does not represent a guaranteed pickup; eligibility is reviewed for each request.</figcaption></figure></section>'''
                  # Put visual proof before FAQ when possible, otherwise before main close.
                  m=re.search(r'<section[^>]*>\s*<h2[^>]*>Frequently Asked Questions',s,flags=re.I)
                  if m: s=s[:m.start()]+proof+'\n'+s[m.start():]
                  elif '</main>' in s: s=s.replace('</main>',proof+'\n</main>',1)
                  p.write_text(s,encoding='utf-8')

          # Expand the Contact page so it is useful enough to index on its own.
          cp=Path('contact/index.html')
          if cp.exists():
              s=cp.read_text(encoding='utf-8')
              if 'id="what-happens-next"' not in s:
                  extra='''
<section id="what-happens-next"><h2>What Happens After You Contact Us?</h2><p>We review the appliance type, working condition, location and access details before confirming a pickup. Working washers, dryers, refrigerators, freezers, stoves and ranges receive priority. If you have more than one appliance, list the condition of every item so the complete load can be reviewed accurately.</p><p>Photos are especially helpful for showing the appliance, any visible damage, stairs, narrow doorways, hallways or other access conditions. For refrigerators and freezers, tell us whether the unit currently holds temperature. For washers and dryers, describe whether each machine completes its normal cycle.</p></section>
<section><h2>Free Pickup Is Qualification-Based</h2><p>A submitted request is not an automatic pickup appointment. Fully working appliances may qualify for free pickup, and mixed loads may qualify when approximately 80% of the appliances work. Minor repairs may be considered. A nonworking appliance by itself does not qualify for free pickup. Microwaves are accepted only with another qualifying major appliance, and dishwashers are considered only with two or more major working appliances.</p><p>Coverage also depends on the city, route, local demand and available pickup or partner capacity. We confirm eligibility and scheduling after reviewing the request details.</p></section>
<section><h2>Service Area Help</h2><p>Use our <a href="../service-areas/">Service Areas</a> page to browse priority markets and state pages. If your city is outside an active direct-service market, you may still submit a request for review. Available partner coverage varies by location.</p><p>For the fastest review, use the same regional phone number shown on the relevant city or state page and include your city or ZIP code when you call or text.</p></section>'''
                  s=s.replace('</main>',extra+'\n</main>',1)
                  cp.write_text(s,encoding='utf-8')

          # Rebuild focused sitemaps now because action-generated pushes do not trigger normal push workflows.
          urls=[]
          for f in sorted(Path('.').rglob('index.html')):
              if '.git' in f.parts: continue
              text=f.read_text(encoding='utf-8',errors='ignore')
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex',text,re.I): continue
              rel=f.parent.as_posix()
              url=BASE if rel=='.' else BASE+rel.strip('/')+'/'
              try:
                  d=subprocess.check_output(['git','log','-1','--format=%cs','--',str(f)],text=True).strip() or date.today().isoformat()
              except Exception:
                  d=date.today().isoformat()
              if f.is_relative_to(Path('contact')): d=date.today().isoformat()
              urls.append((url,d))
          lines=["<?xml version='1.0' encoding='utf-8'?>",'<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for url,d in urls:
              lines += ['  <url>',f'    <loc>{url}</loc>',f'    <lastmod>{d}</lastmod>','  </url>']
          lines.append('</urlset>')
          xml='\n'.join(lines)
          Path('sitemap.xml').write_text(xml,encoding='utf-8')
          Path('sitemap-new.xml').write_text(xml,encoding='utf-8')
          PY
          rm -f .github/workflows/final-seo-enrichment.yml
          git add -A
          git commit -m "Complete competitor-informed SEO hierarchy and proof signals" || exit 0
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep 2
          done
          exit 1
