name: Improve Local Page Usability

on:
  push:
    paths:
      - '.github/workflows/improve-local-page-usability.yml'

permissions:
  contents: write

jobs:
  improve-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make priority city pages self-contained
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = {
              'denver-appliance-pickup/index.html': ('Denver', 'Colorado', '720-604-7498'),
              'los-angeles-appliance-pickup/index.html': ('Los Angeles', 'California', '310-774-4304'),
              'phoenix-appliance-pickup/index.html': ('Phoenix', 'Arizona', ''),
              'seattle-appliance-pickup/index.html': ('Seattle', 'Washington', '503-868-4455'),
              'palm-springs-appliance-pickup/index.html': ('Palm Springs', 'California', '909-375-6685'),
          }

          def form_section(city, state, phone):
              phone_html = ''
              if phone:
                  digits = ''.join(ch for ch in phone if ch.isdigit())
                  phone_html = f'<p><strong>Call or text <a href="tel:+1{digits}">{phone}</a></strong> for {city} pickup questions.</p>'
              return f'''
          <section id="request" class="local-request-form">
          <h2>Request Appliance Pickup in {city}</h2>
          <p>Submit the appliance condition, pickup address, access details and photos or photo information. This request is reviewed specifically for {city}, {state} before pickup is confirmed.</p>
          {phone_html}
          <form action="https://formspree.io/f/mvzeapzd" method="POST" style="display:grid;gap:12px">
          <input type="hidden" name="_subject" value="{city} {state} Appliance Pickup Request">
          <input type="hidden" name="city" value="{city}">
          <input type="hidden" name="state" value="{state}">
          <label>Full Name<input type="text" name="name" required style="width:100%;padding:12px;margin-top:6px"></label>
          <label>Phone Number<input type="tel" name="phone" required style="width:100%;padding:12px;margin-top:6px"></label>
          <label>Pickup Address<input type="text" name="address" required style="width:100%;padding:12px;margin-top:6px"></label>
          <label>ZIP Code<input type="text" name="zip" required style="width:100%;padding:12px;margin-top:6px"></label>
          <label>Appliance Type<select name="appliance" required style="width:100%;padding:12px;margin-top:6px"><option value="">Select appliance</option><option>Washer</option><option>Dryer</option><option>Washer and Dryer</option><option>Refrigerator</option><option>Freezer</option><option>Stove / Range / Oven</option><option>Multiple Major Appliances</option><option>Other Major Appliance</option></select></label>
          <label>Condition<select name="condition" required style="width:100%;padding:12px;margin-top:6px"><option value="">Select condition</option><option>Fully Working</option><option>Needs Repair</option><option>Not Working</option><option>Unknown</option></select></label>
          <label>Appliance Location<select name="location" required style="width:100%;padding:12px;margin-top:6px"><option value="">Select location</option><option>First Floor</option><option>Second Floor</option><option>Third Floor or Higher</option><option>Basement</option><option>Garage</option><option>Outside</option><option>Other</option></select></label>
          <label>Stairs<select name="stairs" required style="width:100%;padding:12px;margin-top:6px"><option value="">Select stairs</option><option>No Stairs</option><option>1 Flight</option><option>2 Flights</option><option>3+ Flights</option><option>Unknown</option></select></label>
          <label>Access Notes / Photo Information<textarea name="message" rows="5" placeholder="Brand, model, working condition, stairs, gates, elevators, narrow doors, parking, and whether photos are available." style="width:100%;padding:12px;margin-top:6px"></textarea></label>
          <button type="submit" style="padding:14px;border:0;border-radius:8px;background:#075c34;color:#fff;font-weight:700;font-size:17px">Submit {city} Pickup Request</button>
          </form>
          </section>
          '''

          for path, (city, state, phone) in pages.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')

              # Keep the visitor on the city page instead of funneling to the homepage form.
              text = text.replace('href="../#request"', 'href="#request"')
              text = text.replace('href="https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/#request"', 'href="#request"')

              if 'id="request"' not in text and 'id=\'request\'' not in text:
                  section = form_section(city, state, phone)
                  if '</main>' in text:
                      text = text.replace('</main>', section + '\n</main>', 1)
                  else:
                      text = text.replace('</body>', section + '\n</body>', 1)

              # Add genuinely local Palm Springs utility information from the City of Palm Springs.
              if city == 'Palm Springs' and 'Palm Springs City Bulky-Item Alternative' not in text:
                  local = '''
          <section id="palm-springs-local-alternative">
          <h2>Palm Springs City Bulky-Item Alternative</h2>
          <p>If an appliance does not qualify for our pickup, Palm Springs residents can also review the city's bulky-item collection program. The City of Palm Springs states that eligible residential and single-family subscribers can schedule collection of appliances and other bulky items through Palm Springs Disposal Services, subject to the city's current item limits and preparation rules.</p>
          <p><a href="https://www.palmspringsca.gov/government/departments/sustainability/recycling-waste-management/special-collection-services-events" rel="noopener">Official City of Palm Springs special collection information</a></p>
          <p>Confirm current eligibility, weight limits, scheduling and placement instructions with the city or Palm Springs Disposal Services before setting an appliance out.</p>
          </section>
          '''
                  text = text.replace('<section id="request"', local + '\n<section id="request"', 1)

              p.write_text(text, encoding='utf-8')

          # Move Portland's local-resource section above its footer when an earlier repair appended it after the footer.
          pp = Path('portland-appliance-pickup/index.html')
          t = pp.read_text(encoding='utf-8')
          pattern = re.compile(r'(\n<section class="official-local-resource" id="local-disposal-options">.*?</section>\n)(</body>)', re.S)
          m = pattern.search(t)
          if m and '<footer>' in t and t.find(m.group(1)) > t.find('</footer>'):
              sec = m.group(1)
              t = t.replace(sec, '', 1)
              t = t.replace('<footer>', sec + '\n<footer>', 1)
              pp.write_text(t, encoding='utf-8')
          PY

      - name: Commit improvements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add denver-appliance-pickup/index.html los-angeles-appliance-pickup/index.html phoenix-appliance-pickup/index.html seattle-appliance-pickup/index.html palm-springs-appliance-pickup/index.html portland-appliance-pickup/index.html
          if git diff --cached --quiet; then
            echo "No page changes needed"
            exit 0
          fi
          git commit -m "Make priority city pages complete local destinations"
          git push
