              )

          def write(path, text):
              path = Path(path)

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              old = (
                  path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
                  if path.exists()
                  else None
              )

