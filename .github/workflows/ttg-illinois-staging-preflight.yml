name: TTG Illinois Staged Batch Preflight (No Release)
on:
  push:
    branches:
      - vgm/ttg-illinois-integrated-preflight-20261108

permissions:
  contents: read

jobs:
  test-staged-illinois:
    name: FastTrack source and Python QA only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current staging commit only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test inventory and preflight safeguards
        run: python -m unittest discover -s tests -p 'test_ttg_fasttrack_*.py' -v
      - name: Audit Illinois city pages and state hub
        run: |
          python scripts/ttg_fasttrack_inventory.py --state IL --details --output /tmp/ttg-il-cities.json
          python scripts/ttg_fasttrack_preflight.py --state IL --output /tmp/ttg-il-city-preflight.json
          python scripts/ttg_fasttrack_preflight.py --state IL --path illinois-appliance-pickup/index.html --output /tmp/ttg-il-hub-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('/tmp/ttg-il-cities.json').read_text())
          city = json.loads(Path('/tmp/ttg-il-city-preflight.json').read_text())
          hub = json.loads(Path('/tmp/ttg-il-hub-preflight.json').read_text())
          assert len(inventory) >= 12, f'Unexpected candidate inventory: {len(inventory)}'
          assert city['checked'] == 16 and city['failed'] == 0, city
          assert hub['checked'] == 1 and hub['failed'] == 0, hub
          print('Static staging QA passed: 16 Illinois city/category pages + 1 state hub.')
          print('No live deployment, Formspree delivery or operator coverage is certified.')
          PY

      - name: Generate and validate five cross-state request-only pilot drafts
        run: |
          python scripts/ttg_fasttrack_generate.py --manifest data/ttg-curated-draft-pages.json --output-dir /tmp/ttg-fasttrack-pilots
          cp home-six-appliance-garage.webp /tmp/ttg-fasttrack-pilots/home-six-appliance-garage.webp
          cp salem-group-appliances.webp /tmp/ttg-fasttrack-pilots/salem-group-appliances.webp
          cp tacoma-group-appliances.webp /tmp/ttg-fasttrack-pilots/tacoma-group-appliances.webp
          cp seattle-group-appliances.webp /tmp/ttg-fasttrack-pilots/seattle-group-appliances.webp
          cp spokane-group-appliances.webp /tmp/ttg-fasttrack-pilots/spokane-group-appliances.webp
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.ttg_fasttrack_preflight import inspect_page
          root = Path('/tmp/ttg-fasttrack-pilots')
          expected = (
              ('evanston', 'IL'), ('oak-park', 'IL'), ('skokie', 'IL'),
              ('sandy-springs', 'GA'), ('dunwoody', 'GA')
          )
          manifest = json.loads(Path('data/ttg-curated-draft-pages.json').read_text())
          actual = {(p['city'].lower().replace(' ', '-'), p['state_code']) for p in manifest['pages']}
          assert actual == set(expected), (actual, expected)
          for slug, code in expected:
              path = f'{slug}-{code.lower()}-appliance-pickup/index.html'
              result = inspect_page(root, path, code, request_only=True)
              assert result['passed'] and not result['errors'], result
              assert result['publication_approved'] is False
              print(f'Passed: {path}')
          print('Five source-backed Illinois/Georgia drafts generated and passed static source QA.')
          print('No page was copied into main, published, indexed, or submitted to Formspree.')
          PY
