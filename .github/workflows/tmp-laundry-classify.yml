name: Temporary laundry photo classifier

on:
  push:
    paths:
      - '.github/workflows/tmp-laundry-classify.yml'

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify original appliance photos
        run: |
          python -m pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import torch
          from torchvision.models import mobilenet_v3_large, MobileNet_V3_Large_Weights

          weights = MobileNet_V3_Large_Weights.DEFAULT
          model = mobilenet_v3_large(weights=weights).eval()
          preprocess = weights.transforms()
          cats = weights.meta['categories']
          exts={'.jpg','.jpeg','.png','.webp'}
          files=[p for p in Path('.').iterdir() if p.is_file() and p.suffix.lower() in exts]
          rows=[]
          laundry_terms={'washer','washing machine','dryer','clothes dryer','laundry','dishwasher'}
          with torch.inference_mode():
              for p in files:
                  try:
                      with Image.open(p) as im:
                          im=ImageOps.exif_transpose(im).convert('RGB')
                          size=im.size
                          x=preprocess(im).unsqueeze(0)
                      probs=model(x).softmax(1)[0]
                      vals,idx=torch.topk(probs,8)
                      tops=[(cats[int(i)],float(v)) for v,i in zip(vals,idx)]
                      wash_idx=[i for i,c in enumerate(cats) if 'washer' in c.lower() or 'washing machine' in c.lower()]
                      dishwasher_idx=[i for i,c in enumerate(cats) if 'dishwasher' in c.lower()]
                      refrigerator_idx=[i for i,c in enumerate(cats) if 'refrigerator' in c.lower()]
                      stove_idx=[i for i,c in enumerate(cats) if 'stove' in c.lower() or 'range' in c.lower()]
                      washer_prob=max([float(probs[i]) for i in wash_idx] or [0])
                      dishwasher_prob=max([float(probs[i]) for i in dishwasher_idx] or [0])
                      refrigerator_prob=max([float(probs[i]) for i in refrigerator_idx] or [0])
                      stove_prob=max([float(probs[i]) for i in stove_idx] or [0])
                      rows.append((washer_prob,dishwasher_prob,refrigerator_prob,stove_prob,p,size,p.stat().st_size,tops))
                  except Exception as e:
                      print('SKIP',p,e)
          rows.sort(key=lambda r:r[0], reverse=True)
          out=['Root photo appliance classification (ImageNet MobileNetV3). Higher washer probability suggests laundry appliance content.','']
          for wp,dp,rp,sp,p,size,bytes_,tops in rows:
              topstr='; '.join(f'{name}={prob:.3f}' for name,prob in tops[:5])
              out.append(f'{p} | dimensions={size} bytes={bytes_} | washer={wp:.4f} dishwasher={dp:.4f} refrigerator={rp:.4f} stove={sp:.4f} | top: {topstr}')
          Path('laundry-photo-classification-report.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('\n'.join(out[:25]))
          PY
      - name: Save classifier report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laundry-photo-classification-report.txt
          git diff --cached --quiet || git commit -m 'Report laundry photo classification'
          git push
