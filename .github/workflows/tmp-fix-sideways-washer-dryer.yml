name: Fix sideways washer dryer photo

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-sideways-washer-dryer.yml'

permissions:
  contents: write

jobs:
  rotate-photo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rotate washer dryer photo upright
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          image_path = Path('assets/laundry/washer-dryer-set-sharp.jpg')
          with Image.open(image_path) as im:
              im = im.convert('RGB')
              # The source is visually sideways: the control panel is on the right.
              # Rotate 90 degrees counter-clockwise so the controls are at the top.
              im = im.transpose(Image.Transpose.ROTATE_90)
              im.save(image_path, 'JPEG', quality=92, optimize=True, progressive=True)

          page = Path('washer-dryer-pickup/index.html')
          text = page.read_text(encoding='utf-8')
          text = text.replace('width="1400" height="1050"', 'width="1050" height="1400"')
          page.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit fix
        run: |
          rm -f .github/workflows/tmp-fix-sideways-washer-dryer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/laundry/washer-dryer-set-sharp.jpg washer-dryer-pickup/index.html .github/workflows/tmp-fix-sideways-washer-dryer.yml
          git commit -m "Fix sideways washer dryer photo"
          git push
