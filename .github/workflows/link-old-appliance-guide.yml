name: One-Time Old Appliance Guide Links

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/link_old_appliance_guide.py'
      - '.github/workflows/link-old-appliance-guide.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add guide links
        run: python .github/scripts/link_old_appliance_guide.py
      - name: Commit and clean temporary files
        shell: bash
        run: |
          set -e
          rm -f .github/scripts/link_old_appliance_guide.py .github/workflows/link-old-appliance-guide.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Connect old appliance disposal guide across site'
          for attempt in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
