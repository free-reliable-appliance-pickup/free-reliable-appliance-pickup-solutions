name: Audit active page images
on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - '**/index.html'
      - 'index.html'
      - 'assets/**'
      - '*.jpg'
      - '*.png'
      - 'scripts/audit-active-page-images.py'
      - '.github/workflows/audit-active-page-images.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - run: python scripts/audit-active-page-images.py
