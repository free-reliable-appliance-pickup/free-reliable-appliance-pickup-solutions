name: One-Time Full Website Repair COMPACT

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run existing full repair safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          lines = Path(".github/workflows/repair-site.yml").read_text(
              encoding="utf-8"
          ).splitlines()

          blocks = []
          i = 0

          while i < len(lines):
              if "<<'PY'" in lines[i]:
                  start = i + 1
                  end = next(
                      j for j in range(start, len(lines))
                      if lines[j].strip() == "PY"
                  )
                  blocks.append(
                      textwrap.dedent("\n".join(lines[start:end]))
                  )
                  i = end + 1
              else:
                  i += 1

          if not blocks:
              raise SystemExit("Could not find repair code.")

          for number, code in enumerate(blocks, 1):
              exec(
                  compile(code, f"repair_block_{number}.py", "exec"),
                  {"__name__": "__main__"}
              )

          print(f"Completed {len(blocks)} repair/validation blocks.")
          PY

      - name: Commit repaired site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Repair website SEO pages and internal links"
            git push
          fi
