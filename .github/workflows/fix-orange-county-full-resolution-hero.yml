name: Fix Orange County Full Resolution Hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-orange-county-full-resolution-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Orange County assigned hero at full resolution
        shell: bash
        run: |
          set -euo pipefail
          SRC="assets/laundry/city-heroes/la-canada-flintridge-washer-dryer-pickup-real-washer-dryer-set.jpg"
          DEST="assets/laundry/city-heroes/orange-county-washer-dryer-pickup-real-washer-dryer-set.jpg"
          PAGE="orange-county-washer-dryer-pickup/index.html"

          test -f "$SRC"
          cp "$SRC" "$DEST"

          python - <<'PY'
          from pathlib import Path
          p=Path("orange-county-washer-dryer-pickup/index.html")
          s=p.read_text(encoding="utf-8")
          old="/assets/laundry/heroes/la-canada-premium-set.webp?premium-static=20260916"
          new="/assets/laundry/city-heroes/orange-county-washer-dryer-pickup-real-washer-dryer-set.jpg"
          if old not in s:
              raise SystemExit("Old Orange County compressed hero reference not found")
          s=s.replace(old,new)
          p.write_text(s,encoding="utf-8")
          PY

          src_size=$(stat -c%s "$SRC")
          dest_size=$(stat -c%s "$DEST")
          echo "source_size=$src_size"
          echo "dest_size=$dest_size"
          test "$src_size" -eq "$dest_size"
          test "$dest_size" -gt 100000

          grep -q '/assets/laundry/city-heroes/orange-county-washer-dryer-pickup-real-washer-dryer-set.jpg' "$PAGE"
          if grep -q 'la-canada-premium-set.webp' "$PAGE"; then
            echo "Old compressed hero reference still exists in Orange County page"
            exit 1
          fi

      - name: Commit full resolution Orange County hero
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/laundry/city-heroes/orange-county-washer-dryer-pickup-real-washer-dryer-set.jpg orange-county-washer-dryer-pickup/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore full resolution Orange County washer dryer hero"
          git push
