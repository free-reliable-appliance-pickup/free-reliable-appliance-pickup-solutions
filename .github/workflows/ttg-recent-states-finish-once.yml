name: TTG Recent States Finish Customer Free Pickup Copy
on:
  push:
    paths:
      - '.github/workflows/ttg-recent-states-finish-once.yml'
permissions:
  contents: write
jobs:
  finish:
    if: github.ref == 'refs/heads/ttg/recent-states-free-pickup-final-20261110'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Correct recent states customer pickup headings and buttons
        run: python3 scripts/ttg_recent_state_free_copy.py --apply
      - name: Add missing stove fuel and disconnection fields
        run: python3 scripts/ttg_recent_stove_safety_fields.py
      - name: Audit all recent states forms and headings
        run: python3 scripts/ttg_recent_state_free_copy.py --check
      - name: Audit state manifests and safe request-only metadata
        run: python3 scripts/ttg_state_batch_qa.py
      - name: Run TTG regression suite
        run: python3 -m unittest discover -s tests -p 'test_ttg_*.py' > /tmp/ttg-results.log 2>&1 || { tail -n 90 /tmp/ttg-results.log; exit 1; }
      - name: Commit verified final pages, remove one-time workflow
        run: |
          git config user.name "Free Reliable Website Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ttg-recent-states-finish-once.yml
          git add -A
          git commit -m "TTG: finish Free Appliance Pickup pages and safe intake across recent states"
          git pull --rebase origin ttg/recent-states-free-pickup-final-20261110
          git push origin HEAD:ttg/recent-states-free-pickup-final-20261110
