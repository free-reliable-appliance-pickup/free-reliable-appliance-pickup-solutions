name: Generate Rancho Header Logo Derivative

on:
  push:
    branches: [main]
    paths:
      - 'file_00000000b7c082308dccc73e5bd3acd2.png'
      - '.github/workflows/generate-rancho-header-logo.yml'
  pull_request:
    paths:
      - 'file_00000000b7c082308dccc73e5bd3acd2.png'
      - '.github/workflows/generate-rancho-header-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate sharp 2x header logo
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src=Path('file_00000000b7c082308dccc73e5bd3acd2.png')
          out=Path('assets/brand/free-reliable-appliance-pickup-logo-236.webp')
          out.parent.mkdir(parents=True,exist_ok=True)

          with Image.open(src) as im:
              im=im.convert('RGBA')
              im=im.resize((236,236),Image.Resampling.LANCZOS)
              im.save(out,'WEBP',quality=90,method=6)

          with Image.open(out) as check:
              if check.size != (236,236):
                  raise SystemExit(f'wrong derivative dimensions: {check.size}')

          size=out.stat().st_size
          print('HEADER_LOGO_BYTES',size)
          if size > 100000:
              raise SystemExit(f'header derivative too large: {size} bytes')
          PY

      - name: Commit optimized header logo
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain -- assets/brand/free-reliable-appliance-pickup-logo-236.webp)" ]; then
            echo "No logo derivative changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/free-reliable-appliance-pickup-logo-236.webp
          git commit -m "Generate optimized header logo derivative"
          git pull --rebase origin main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
