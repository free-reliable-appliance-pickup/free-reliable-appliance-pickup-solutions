name: Promote SGV Corridor SEO Gold Standard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-sgv-corridor-gold-standard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote remaining San Gabriel corridor pages
        shell: python
        run: |
          from pathlib import Path
          import re

          appliance = [
            'whittier-appliance-pickup','la-habra-appliance-pickup',
            'la-puente-appliance-pickup','diamond-bar-appliance-pickup',
            'walnut-appliance-pickup','rowland-heights-appliance-pickup',
            'irwindale-appliance-pickup','south-san-jose-hills-appliance-pickup',
            'avocado-heights-appliance-pickup'
          ]
          laundry = [
            'chino-washer-dryer-pickup','whittier-washer-dryer-pickup',
            'la-habra-washer-dryer-pickup','la-puente-washer-dryer-pickup',
            'diamond-bar-washer-dryer-pickup','walnut-washer-dryer-pickup',
            'rowland-heights-washer-dryer-pickup','irwindale-washer-dryer-pickup',
            'south-san-jose-hills-washer-dryer-pickup',
            'avocado-heights-washer-dryer-pickup'
          ]

          fallback_sections = {
            'la-puente-washer-dryer-pickup': '<section class="local-ranking-depth-20260918 la-puente-wd-local-depth-20260919"><h2>La Puente Washer &amp; Dryer Pickup Access &amp; Route Details</h2><p>La Puente laundry requests can involve houses, apartments, rental turnovers, garages and shared parking. Include the exact pickup address, floor level, stairs, gates, parking or loading limits and carrying distance so the removal path can be reviewed before scheduling.</p><p>Nearby washer and dryer pages connect La Puente with <a href="/west-covina-washer-dryer-pickup/">West Covina</a>, <a href="/avocado-heights-washer-dryer-pickup/">Avocado Heights</a>, <a href="/south-san-jose-hills-washer-dryer-pickup/">South San Jose Hills</a> and the <a href="/san-gabriel-valley-washer-dryer-pickup/">San Gabriel Valley hub</a>.</p></section>',
            'diamond-bar-washer-dryer-pickup': '<section class="local-ranking-depth-20260918 diamond-bar-wd-local-depth-20260919"><h2>Diamond Bar Washer &amp; Dryer Pickup Access Review</h2><p>Diamond Bar washer and dryer requests should include driveway slope, gate access, garage or interior location, stairs and carrying distance. These details matter when a laundry set must move from an interior room or elevated driveway to the loading point.</p><p>Use the nearby pages for <a href="/walnut-washer-dryer-pickup/">Walnut</a>, <a href="/rowland-heights-washer-dryer-pickup/">Rowland Heights</a> and the <a href="/san-gabriel-valley-washer-dryer-pickup/">San Gabriel Valley washer and dryer hub</a> when the pickup address falls outside Diamond Bar.</p></section>',
            'walnut-washer-dryer-pickup': '<section class="local-ranking-depth-20260918 walnut-wd-local-depth-20260919"><h2>Walnut Washer &amp; Dryer Pickup Access Review</h2><p>For Walnut laundry requests, send the exact address and describe whether the machines are in a garage, interior laundry room or upstairs space. Driveway grade, gates, stairs, narrow paths and carrying distance can change the removal plan.</p><p>Nearby route pages include <a href="/diamond-bar-washer-dryer-pickup/">Diamond Bar</a>, <a href="/rowland-heights-washer-dryer-pickup/">Rowland Heights</a>, <a href="/west-covina-washer-dryer-pickup/">West Covina</a> and the <a href="/san-gabriel-valley-washer-dryer-pickup/">San Gabriel Valley hub</a>.</p></section>',
            'rowland-heights-washer-dryer-pickup': '<section class="local-ranking-depth-20260918 rowland-heights-wd-local-depth-20260919"><h2>Rowland Heights Washer &amp; Dryer Pickup Access Review</h2><p>Rowland Heights laundry requests may come from homes, apartments, garages and rental properties. Include floor level, stairs, gate access, parking restrictions and the path from the machines to the truck so pickup can be reviewed accurately.</p><p>Nearby washer and dryer pages include <a href="/walnut-washer-dryer-pickup/">Walnut</a>, <a href="/diamond-bar-washer-dryer-pickup/">Diamond Bar</a>, <a href="/hacienda-heights-washer-dryer-pickup/">Hacienda Heights</a> and the <a href="/san-gabriel-valley-washer-dryer-pickup/">San Gabriel Valley hub</a>.</p></section>',
            'irwindale-washer-dryer-pickup': '<section class="local-ranking-depth-20260918 irwindale-wd-local-depth-20260919"><h2>Irwindale Washer &amp; Dryer Pickup Address &amp; Access Review</h2><p>Irwindale requests are routed by the exact pickup address because access can differ between residential, rental and business properties. Include the machine location, stairs, gates, loading access, parking limits and carrying distance.</p><p>Nearby laundry routes connect with <a href="/azusa-washer-dryer-pickup/">Azusa</a>, <a href="/duarte-washer-dryer-pickup/">Duarte</a>, <a href="/west-covina-washer-dryer-pickup/">West Covina</a> and the <a href="/san-gabriel-valley-washer-dryer-pickup/">San Gabriel Valley hub</a>.</p></section>',
            'south-san-jose-hills-washer-dryer-pickup': '<section class="local-ranking-depth-20260918 south-san-jose-hills-wd-local-depth-20260919"><h2>South San Jose Hills Washer &amp; Dryer Pickup Access Review</h2><p>For South San Jose Hills requests, provide the exact address plus garage or interior location, floor level, stairs, driveway or curb access and carrying distance. Shared parking or a long path from the laundry area should be included before the route is confirmed.</p><p>Nearby washer and dryer pages include <a href="/la-puente-washer-dryer-pickup/">La Puente</a>, <a href="/avocado-heights-washer-dryer-pickup/">Avocado Heights</a>, <a href="/west-covina-washer-dryer-pickup/">West Covina</a> and the <a href="/san-gabriel-valley-washer-dryer-pickup/">San Gabriel Valley hub</a>.</p></section>',
            'avocado-heights-washer-dryer-pickup': '<section class="local-ranking-depth-20260918 avocado-heights-wd-local-depth-20260919"><h2>Avocado Heights Washer &amp; Dryer Pickup Access Review</h2><p>Avocado Heights laundry requests should include the exact address, machine location, gates, driveway access, stairs and carrying distance. For appliances inside a home or rear area, describe the full removal path to the loading point.</p><p>Nearby washer and dryer pages connect with <a href="/la-puente-washer-dryer-pickup/">La Puente</a>, <a href="/south-san-jose-hills-washer-dryer-pickup/">South San Jose Hills</a>, <a href="/rowland-heights-washer-dryer-pickup/">Rowland Heights</a> and the <a href="/san-gabriel-valley-washer-dryer-pickup/">San Gabriel Valley hub</a>.</p></section>'
          }

          failures=[]
          changed=[]
          for slug in appliance + laundry:
              p=Path(slug)/'index.html'
              if not p.exists():
                  failures.append(f'{slug}: missing page')
                  continue
              s=p.read_text(encoding='utf-8',errors='replace')
              old=s
              low=s.lower()

              if 'local-ranking-depth-20260918' not in low:
                  pattern=re.compile(r'<section\s+class="([^"]*(?:ranking-depth|local-depth)[^"]*)">',re.I)
                  m=pattern.search(s)
                  if not m:
                      fallback=fallback_sections.get(slug)
                      request_marker=re.search(r'<section\s+id=["\']request["\'][^>]*>',s,re.I)
                      if fallback and request_marker:
                          s=s[:request_marker.start()] + fallback + s[request_marker.start():]
                      else:
                          failures.append(f'{slug}: no local/ranking depth section and no safe fallback insertion')
                          continue
                  else:
                      classes=(m.group(1)+' local-ranking-depth-20260918').split()
                      classes=' '.join(dict.fromkeys(classes))
                      s=s[:m.start()] + f'<section class="{classes}">' + s[m.end():]

              low=s.lower()
              if 'major-appliance-pickup-photo' not in low and 'real appliance example' not in low:
                  photo=re.compile(r'<h2>\s*Real Washer\s*&amp;\s*Dryer Photos\s*</h2>',re.I)
                  if not photo.search(s):
                      failures.append(f'{slug}: no real-photo heading found')
                      continue
                  s=photo.sub('<h2>Real Appliance Examples: Washer &amp; Dryer Photos</h2>',s,count=1)

              low=s.lower()
              checks={
                'local depth':'local-ranking-depth-20260918' in low,
                'real proof':('major-appliance-pickup-photo' in low or 'real appliance example' in low),
                'self canonical':f'https://freereliableappliancepickup.com/{slug}/' in low,
                'site branding':'/assets/site-brand.css' in low,
                'request form':'https://formspree.io/f/mvzeapzd' in low,
                'customer routing':'/assets/customer-routing.js' in low,
                'breadcrumb':'breadcrumblist' in low,
              }
              missing=[k for k,v in checks.items() if not v]
              if missing:
                  failures.append(f"{slug}: missing after promotion: {', '.join(missing)}")
                  continue

              if s != old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(slug)

          def append_model(path, slugs):
              p=Path(path)
              lines=[x.strip() for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
              seen=set(lines)
              added=[]
              for slug in slugs:
                  if slug not in seen:
                      lines.append(slug); seen.add(slug); added.append(slug)
              p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
              return added

          added_a=append_model('data/california-seo-model-pages.txt',appliance)
          added_w=append_model('data/california-washer-dryer-seo-model-pages.txt',laundry)

          print('PAGES_CHANGED',len(changed))
          print('\n'.join(changed))
          print('APPLIANCE_BENCHMARKS_ADDED',len(added_a))
          print('\n'.join(added_a))
          print('LAUNDRY_BENCHMARKS_ADDED',len(added_w))
          print('\n'.join(added_w))

          if failures:
              print('FAILURES')
              for f in failures: print('-',f)
              raise SystemExit(1)

      - name: Commit promoted corridor pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*-appliance-pickup/index.html' '*-washer-dryer-pickup/index.html' data/california-seo-model-pages.txt data/california-washer-dryer-seo-model-pages.txt
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Promote remaining SGV corridor pages to California SEO gold standard"
          git push
