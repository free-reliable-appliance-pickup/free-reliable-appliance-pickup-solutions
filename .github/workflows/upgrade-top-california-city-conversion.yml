name: Cleanup Duplicate California Conversion Blocks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-top-california-city-conversion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate city conversion blocks
        shell: python
        run: |
          from pathlib import Path
          import re

          slugs=[
              'anaheim','rancho-cucamonga','fontana','ontario','pomona','west-covina',
              'pasadena','long-beach','santa-ana','irvine','corona','moreno-valley',
              'victorville','fullerton','costa-mesa','tustin'
          ]
          changed=[]
          failures=[]

          for slug in slugs:
              page=Path(f'{slug}-appliance-pickup')/'index.html'
              if not page.exists():
                  failures.append(f'{slug}: missing page')
                  continue
              s=page.read_text(encoding='utf-8',errors='replace')
              low=s.lower()

              has_core='direct-request-conversion-20260920' in low
              has_city='direct-city-request-conversion-20260920' in low

              if has_core and has_city:
                  new=re.sub(
                      r'<section class="direct-city-request-conversion-20260920">.*?</section>',
                      '',
                      s,
                      count=1,
                      flags=re.I|re.S
                  )
                  if new==s:
                      failures.append(f'{slug}: duplicate marker found but block removal failed')
                      continue
                  page.write_text(new,encoding='utf-8')
                  changed.append(slug)

          if failures:
              print('FAILURES')
              for f in failures:
                  print('-',f)
              raise SystemExit(1)

          print('PAGES_CLEANED',len(changed))
          for x in changed:
              print(x)

      - name: Verify conversion blocks remain useful
        shell: python
        run: |
          from pathlib import Path
          import re

          slugs=[
              'anaheim','rancho-cucamonga','fontana','ontario','pomona','west-covina',
              'pasadena','long-beach','santa-ana','irvine','corona','moreno-valley',
              'victorville','fullerton','costa-mesa','tustin'
          ]
          failures=[]
          for slug in slugs:
              page=Path(f'{slug}-appliance-pickup')/'index.html'
              t=page.read_text(encoding='utf-8',errors='replace')
              low=t.lower()
              conversion=('direct-request-conversion-20260920' in low or
                          'direct-city-request-conversion-20260920' in low)
              checks={
                  'one conversion block': conversion,
                  'request CTA':'href="#request"' in low,
                  'phone CTA':'href="tel:' in low,
                  'text CTA':'href="sms:' in low,
                  'formspree':'https://formspree.io/f/mvzeapzd' in low,
                  'routing':'customer-routing.js' in low,
                  'canonical':f'https://freereliableappliancepickup.com/{slug}-appliance-pickup/' in low,
                  'index/follow':bool(re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*index[^"\']*follow',t,re.I)),
              }
              miss=[k for k,v in checks.items() if not v]
              if miss:
                  failures.append(f"{slug}: {', '.join(miss)}")
              if low.count('direct-request-conversion-20260920') + low.count('direct-city-request-conversion-20260920') > 1:
                  failures.append(f'{slug}: duplicate conversion blocks remain')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          print('PASS: top city conversion pages have one clear conversion block each.')

      - name: Commit conversion cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*-appliance-pickup/index.html'
          if git diff --cached --quiet; then
            echo "No duplicate conversion blocks found"
            exit 0
          fi
          git commit -m "Remove duplicate top city conversion blocks"
          git pull --rebase origin main
          git push
