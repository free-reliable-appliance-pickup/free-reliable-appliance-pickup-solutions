name: Repair Approved Request Actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-approved-request-actions.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep request buttons on the current page
        shell: python
        run: |
          from pathlib import Path

          targets = [
              'california-appliance-pickup',
              'oregon-appliance-pickup',
              'washington-appliance-pickup',
              'arizona-appliance-pickup',
              'colorado-appliance-pickup',
              'nevada-appliance-pickup',
              'utah-appliance-pickup',
              'idaho-appliance-pickup',
              'puget-sound-appliance-pickup',
          ]

          changed = []
          for slug in targets:
              path = Path(slug) / 'index.html'
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace('href="/#request"', 'href="#request"')
              text = text.replace('href="../#request"', 'href="#request"')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(slug)

          print('Updated same-page request links:', ', '.join(changed) if changed else 'none')

      - name: Commit request-link cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No request-link cleanup needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add california-appliance-pickup/index.html oregon-appliance-pickup/index.html washington-appliance-pickup/index.html arizona-appliance-pickup/index.html colorado-appliance-pickup/index.html nevada-appliance-pickup/index.html utah-appliance-pickup/index.html idaho-appliance-pickup/index.html puget-sound-appliance-pickup/index.html
          git commit -m "Keep regional request buttons on-page"
          git push
