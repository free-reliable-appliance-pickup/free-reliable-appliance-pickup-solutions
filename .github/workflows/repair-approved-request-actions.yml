name: Repair Approved Request Actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-approved-request-actions.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair approved state and regional hubs
        shell: python
        run: |
          from pathlib import Path

          targets = {
              'california-appliance-pickup': 'California',
              'oregon-appliance-pickup': 'Oregon',
              'washington-appliance-pickup': 'Washington',
              'arizona-appliance-pickup': 'Arizona',
              'colorado-appliance-pickup': 'Colorado',
              'nevada-appliance-pickup': 'Nevada',
              'utah-appliance-pickup': 'Utah',
              'idaho-appliance-pickup': 'Idaho',
              'puget-sound-appliance-pickup': 'Washington',
          }

          form = '''
<section id="request" class="site-request-panel">
  <h2>Request Appliance Pickup</h2>
  <p class="site-request-intro">Submit the appliance condition, exact pickup location, stairs and access details. Free pickup is qualification-based and route availability must be confirmed.</p>
  <form action="https://formspree.io/f/mvzeapzd" method="POST">
    <input type="hidden" name="_subject" value="{subject} Appliance Pickup Request">
    <input type="hidden" name="state" value="{state}">
    <input type="hidden" name="source_page" value="{slug}">
    <div class="site-request-grid">
      <div class="site-request-field"><label>Full Name<input type="text" name="name" required autocomplete="name"></label></div>
      <div class="site-request-field"><label>Phone<input type="tel" name="phone" required autocomplete="tel"></label></div>
      <div class="site-request-field"><label>Email<input type="email" name="email" autocomplete="email"></label></div>
      <div class="site-request-field"><label>Street Address<input type="text" name="address" required autocomplete="street-address"></label></div>
      <div class="site-request-field"><label>City<input type="text" name="city" required autocomplete="address-level2"></label></div>
      <div class="site-request-field"><label>ZIP Code<input type="text" name="zip" required autocomplete="postal-code" inputmode="numeric"></label></div>
      <div class="site-request-field"><label>Appliance Type<select name="appliance" required><option value="">Select appliance</option><option>Refrigerator</option><option>Washer</option><option>Dryer</option><option>Washer &amp; Dryer Set</option><option>Stove / Range</option><option>Oven</option><option>Freezer</option><option>Dishwasher with qualifying appliances</option><option>Multiple Appliances</option><option>Other Major Appliance</option></select></label></div>
      <div class="site-request-field"><label>Condition<select name="condition" required><option value="">Select condition</option><option>Fully working</option><option>Needs minor repair</option><option>Not working</option><option>Unknown</option><option>Mixed load - majority working</option></select></label></div>
      <div class="site-request-field"><label>Location / Floor<select name="floor" required><option value="">Select location</option><option>1st floor</option><option>2nd floor</option><option>3rd floor or higher</option><option>Basement</option><option>Garage</option><option>Outside / Driveway</option><option>Other</option></select></label></div>
      <div class="site-request-field"><label>Stairs<select name="stairs" required><option value="">Select stairs</option><option>No stairs</option><option>1 flight</option><option>2 flights</option><option>3+ flights</option><option>Unknown</option></select></label></div>
      <div class="site-request-field full"><label>Access Details<input type="text" name="access" placeholder="Gate, elevator, narrow hallway, parking, doorway, long carry, etc."></label></div>
      <div class="site-request-field full"><label>Appliance Details / Message<textarea name="message" rows="5" placeholder="List every appliance, whether each one works, brand/model if known, and whether photos are available."></textarea></label></div>
      <div class="site-request-field full"><button class="site-request-submit" type="submit">Submit Pickup Request</button><p class="site-request-note">Submitting a request does not guarantee free pickup. Eligibility and route availability must be confirmed.</p></div>
    </div>
  </form>
</section>
'''

          changed = []
          for slug, state in targets.items():
              path = Path(slug) / 'index.html'
              text = path.read_text(encoding='utf-8')
              original = text

              if '/assets/customer-routing.js' not in text:
                  text = text.replace('</head>', '<script src="/assets/customer-routing.js" defer></script>\n</head>', 1)

              if 'href="#request"' not in text:
                  cta = '<p class="site-inline-request"><a class="btn" href="#request">Request Pickup</a></p>\n'
                  if '</header>' in text:
                      text = text.replace('</header>', cta + '</header>', 1)
                  elif '<main' in text:
                      pos = text.find('>\n', text.find('<main'))
                      if pos != -1:
                          text = text[:pos+2] + cta + text[pos+2:]

              if 'id="request"' not in text or 'https://formspree.io/f/mvzeapzd' not in text:
                  subject = 'Puget Sound Washington' if slug == 'puget-sound-appliance-pickup' else state
                  block = form.format(subject=subject, state=state, slug=slug)
                  if '</main>' in text:
                      text = text.replace('</main>', block + '\n</main>', 1)
                  else:
                      text = text.replace('</body>', '<main>' + block + '</main>\n</body>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(slug)

          print('Repaired:', ', '.join(changed) if changed else 'none')

      - name: Commit repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repairs needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add california-appliance-pickup/index.html oregon-appliance-pickup/index.html washington-appliance-pickup/index.html arizona-appliance-pickup/index.html colorado-appliance-pickup/index.html nevada-appliance-pickup/index.html utah-appliance-pickup/index.html idaho-appliance-pickup/index.html puget-sound-appliance-pickup/index.html
          git commit -m "Repair request actions on approved regional hubs"
          git push
