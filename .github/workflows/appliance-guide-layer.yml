name: One-Time Appliance Guide Layer

on:
  push:
    paths:
      - '.github/workflows/appliance-guide-layer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build appliance guides and internal links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          from datetime import date

          BASE='https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/'
          LOGO=BASE+'assets/free-reliable-appliance-pickup-logo.svg'

          guides={
          'washer-dryer-pickup':('Free Washer & Dryer Pickup | Appliance Removal Guide','Free washer and dryer pickup guide for qualifying working laundry appliances, pickup access, photos, preparation and service-area availability.','Free Washer & Dryer Pickup',[
          ('What receives priority?','Fully working washers and dryers receive the strongest priority. Matching laundry sets are especially useful because both units can often be reused together. Minor-repair units may also be reviewed depending on model, age, condition, local demand and available coverage.'),
          ('What should I submit?','Tell us whether the washer powers on, fills, agitates, drains and spins, and whether the dryer powers on, tumbles and heats. Include leaks, noises, missing parts and photos of the front, controls and model label.'),
          ('Can you pick up from inside?','Inside pickup may be available. Tell us whether the machines are in a garage, laundry room, basement, upstairs area or outside. Include stairs, narrow doors, tight halls, gates and whether the units are disconnected.'),
          ('Do broken units qualify?','A single nonworking appliance does not automatically qualify for free pickup. Working appliances receive priority. Mixed loads may qualify when approximately 80% of the load is working.')]),
          'refrigerator-pickup':('Free Refrigerator Pickup | Appliance Removal Guide','Free refrigerator pickup guide covering working-condition priority, cooling status, photos, access, preparation and service-area availability.','Free Refrigerator Pickup',[
          ('What receives priority?','Refrigerators that cool correctly, have intact shelves and drawers, close properly and are reasonably clean receive the strongest priority. Top-freezer, bottom-freezer, side-by-side and French-door models can all be submitted.'),
          ('What photos help?','Send a clear front photo, an interior photo when possible and the model/serial label. Mention approximate width, whether the refrigerator is currently plugged in and cooling, and any dispenser, seal or temperature problems.'),
          ('What access details matter?','Tell us about stairs, floor level, narrow doors, tight turns, gates and whether doors may need to be removed. Accurate access information helps prevent scheduling problems.'),
          ('Do nonworking refrigerators qualify?','A single nonworking refrigerator does not automatically qualify for free pickup. Working and reusable units receive priority. Mixed loads may qualify when approximately 80% are working.')]),
          'freezer-pickup':('Free Freezer Pickup | Appliance Removal Guide','Free chest and upright freezer pickup guide covering working condition, photos, preparation, access and service-area availability.','Free Freezer Pickup',[
          ('What receives priority?','Freezers that reach and hold freezing temperature, have working lids or doors, intact baskets or shelves and no major cabinet damage receive priority. Clean working chest and upright freezers can be strong pickup candidates.'),
          ('What should I include?','Tell us whether the freezer is currently plugged in and freezing, whether it is chest-style or upright, approximate dimensions, condition of the lid or door and any known electrical or temperature problems.'),
          ('What photos are useful?','A clear exterior photo, interior photo and model-label photo are ideal. If the freezer is in a garage, basement or shed, explain the path to the pickup vehicle.'),
          ('Do broken freezers qualify?','Not automatically. A single nonworking freezer generally does not qualify for free pickup. Working appliances are prioritized; mixed loads may qualify when approximately 80% are working.')]),
          'stove-oven-pickup':('Free Stove & Oven Pickup | Appliance Removal Guide','Free stove, range and oven pickup guide covering gas and electric units, condition, access, preparation and service-area availability.','Free Stove, Range & Oven Pickup',[
          ('What can I submit?','Freestanding gas ranges, electric ranges and some wall ovens can be reviewed. Tell us the fuel type, approximate size and whether burners or elements, controls and the oven work.'),
          ('What condition receives priority?','Working burners or elements, a functioning oven, intact knobs and controls, solid doors and clean reusable condition increase the chance of qualification. Cosmetic wear can be acceptable when the appliance still works.'),
          ('What access details matter?','Tell us whether the range is in a kitchen, garage, upstairs unit or another location. Include stairs, narrow halls, floor level and whether the appliance is disconnected and ready to move.'),
          ('How should gas ranges be prepared?','Gas appliances should be disconnected safely when required. Do not loosen gas fittings unless qualified. Tell us whether the gas line is already disconnected.')])}

          css='*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#222;font:17px/1.65 Arial,Helvetica,sans-serif}header{background:linear-gradient(135deg,#075c34,#0b8a4d);color:#fff;text-align:center;padding:46px 20px}main{width:min(1000px,94%);margin:auto}section{background:#fff;margin:22px 0;padding:26px;border-radius:12px;border:1px solid #d7e5dc}h2{color:#075c34}.btn{display:inline-block;background:#fff;color:#075c34;font-weight:700;padding:11px 16px;border-radius:8px;text-decoration:none;margin:5px}.links a{display:inline-block;margin:5px;padding:9px 11px;background:#eef8f2;border-radius:8px;color:#075c34;font-weight:700}footer{background:#17352a;color:#fff;text-align:center;padding:24px}footer a{color:#fff}'

          for slug,(title,desc,h1,sections) in guides.items():
              d=Path(slug); d.mkdir(exist_ok=True)
              url=BASE+slug+'/'
              body=''.join(f'<section><h2>{h}</h2><p>{p}</p></section>' for h,p in sections)
              related=''.join(f'<a href="{BASE}{s}/">{v[2]}</a>' for s,v in guides.items() if s!=slug)
              page=f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{title}</title><meta name="description" content="{desc}"><meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1"><link rel="canonical" href="{url}"><link rel="icon" href="{LOGO}" type="image/svg+xml"><style>{css}</style><script type="application/ld+json">{{"@context":"https://schema.org","@graph":[{{"@type":"Organization","@id":"{BASE}#organization","name":"Free Reliable Appliance Pickup","url":"{BASE}","logo":"{LOGO}"}},{{"@type":"Service","name":"{h1}","url":"{url}","provider":{{"@id":"{BASE}#organization"}},"areaServed":{{"@type":"Country","name":"United States"}}}}]}}</script></head><body><header><h1>{h1}</h1><p>Qualifying pickup is reviewed by appliance condition, access, local demand, scheduling and active coverage.</p><a class="btn" href="{BASE}#request">Request Appliance Pickup</a><a class="btn" href="{BASE}service-areas/">Browse Service Areas</a></header><main>{body}<section><h2>Related Appliance Pickup Guides</h2><div class="links">{related}</div></section><section><h2>Free Pickup Is Qualification-Based</h2><p>Fully working appliances receive priority. A single nonworking appliance does not automatically qualify. Mixed loads may qualify when approximately 80% of the load is working. Microwaves are accepted only with another major qualifying appliance, and dishwashers only with two or more major working appliances.</p></section></main><footer><a href="{BASE}">Free Reliable Appliance Pickup</a> · <a href="{BASE}#request">Request Pickup</a></footer></body></html>'''
              (d/'index.html').write_text(page,encoding='utf-8')

          block=f'''<section id="appliance-guides"><h2>Appliance Pickup Guides</h2><p>Learn what information helps us review each major appliance category.</p><div class="links"><a href="{BASE}washer-dryer-pickup/">Washer &amp; Dryer Pickup</a> <a href="{BASE}refrigerator-pickup/">Refrigerator Pickup</a> <a href="{BASE}freezer-pickup/">Freezer Pickup</a> <a href="{BASE}stove-oven-pickup/">Stove &amp; Oven Pickup</a></div></section>'''

          targets=['index.html','los-angeles-appliance-pickup/index.html','portland-appliance-pickup/index.html','salem-appliance-pickup/index.html','seattle-appliance-pickup/index.html','vancouver-appliance-pickup/index.html','phoenix-appliance-pickup/index.html','denver-appliance-pickup/index.html','las-vegas-appliance-pickup/index.html','salt-lake-city-appliance-pickup/index.html','boise-appliance-pickup/index.html','california-appliance-pickup/index.html','oregon-appliance-pickup/index.html','washington-appliance-pickup/index.html','arizona-appliance-pickup/index.html','colorado-appliance-pickup/index.html','nevada-appliance-pickup/index.html','utah-appliance-pickup/index.html','idaho-appliance-pickup/index.html']
          for fn in targets:
              p=Path(fn)
              if not p.exists(): continue
              txt=p.read_text(encoding='utf-8',errors='ignore')
              if 'id="appliance-guides"' in txt: continue
              if re.search(r'</main>',txt,re.I):
                  txt=re.sub(r'</main>',block+'</main>',txt,count=1,flags=re.I)
              elif re.search(r'</body>',txt,re.I):
                  txt=re.sub(r'</body>',block+'</body>',txt,count=1,flags=re.I)
              p.write_text(txt,encoding='utf-8')

          sm=Path('sitemap.xml')
          if sm.exists():
              ns='http://www.sitemaps.org/schemas/sitemap/0.9'; ET.register_namespace('',ns)
              tree=ET.parse(sm); root=tree.getroot()
              existing={x.text.strip() for x in root.findall(f'.//{{{ns}}}loc') if x.text}
              for slug in guides:
                  url=BASE+slug+'/'
                  if url not in existing:
                      u=ET.SubElement(root,f'{{{ns}}}url'); ET.SubElement(u,f'{{{ns}}}loc').text=url; ET.SubElement(u,f'{{{ns}}}lastmod').text=date.today().isoformat()
              tree.write(sm,encoding='utf-8',xml_declaration=True)
          print('Created appliance guides and internal links.')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add appliance pickup guide content layer'
          git pull --rebase origin main
          git push origin HEAD:main
