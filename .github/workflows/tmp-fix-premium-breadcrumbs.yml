name: Temporary premium corridor breadcrumb fix

on:
  push:
    paths:
      - '.github/workflows/tmp-fix-premium-breadcrumbs.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add missing breadcrumb schema and re-audit corridor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          cities = [
              ("Montrose", "montrose-washer-dryer-pickup"),
              ("La Crescenta", "la-crescenta-washer-dryer-pickup"),
              ("La Cañada Flintridge", "la-canada-flintridge-washer-dryer-pickup"),
              ("Altadena", "altadena-washer-dryer-pickup"),
              ("Pasadena", "pasadena-washer-dryer-pickup"),
              ("San Marino", "san-marino-washer-dryer-pickup"),
              ("San Gabriel", "san-gabriel-washer-dryer-pickup"),
              ("Sierra Madre", "sierra-madre-washer-dryer-pickup"),
              ("Arcadia", "arcadia-washer-dryer-pickup"),
              ("Monrovia", "monrovia-washer-dryer-pickup"),
              ("Duarte", "duarte-washer-dryer-pickup"),
              ("Azusa", "azusa-washer-dryer-pickup"),
              ("Glendora", "glendora-washer-dryer-pickup"),
              ("Covina", "covina-washer-dryer-pickup"),
              ("West Covina", "west-covina-washer-dryer-pickup"),
              ("San Dimas", "san-dimas-washer-dryer-pickup"),
              ("La Verne", "la-verne-washer-dryer-pickup"),
              ("Claremont", "claremont-washer-dryer-pickup"),
              ("Pomona", "pomona-washer-dryer-pickup"),
              ("Montclair", "montclair-washer-dryer-pickup"),
              ("Ontario", "ontario-washer-dryer-pickup"),
              ("Upland", "upland-washer-dryer-pickup"),
              ("Rancho Cucamonga", "rancho-cucamonga-washer-dryer-pickup"),
              ("Fontana", "fontana-washer-dryer-pickup"),
              ("San Bernardino", "san-bernardino-washer-dryer-pickup"),
          ]
          targets = {"Upland":"upland-washer-dryer-pickup", "Rancho Cucamonga":"rancho-cucamonga-washer-dryer-pickup", "Fontana":"fontana-washer-dryer-pickup"}

          for city, slug in targets.items():
              p = Path(slug) / 'index.html'
              text = p.read_text(encoding='utf-8')
              if 'BreadcrumbList' not in text:
                  pattern = re.compile(r'<script type="application/ld\+json">(\{"@context":"https://schema.org","@graph":.*?\})</script>', re.S)
                  m = pattern.search(text)
                  if not m:
                      raise SystemExit(f'Could not find @graph JSON in {p}')
                  data = json.loads(m.group(1))
                  data['@graph'].append({
                      '@type':'BreadcrumbList',
                      'itemListElement':[
                          {'@type':'ListItem','position':1,'name':'Home','item':'https://freereliableappliancepickup.com/'},
                          {'@type':'ListItem','position':2,'name':'Washer & Dryer Pickup','item':'https://freereliableappliancepickup.com/washer-dryer-pickup/'},
                          {'@type':'ListItem','position':3,'name':'San Gabriel Valley to Inland Empire Corridor','item':'https://freereliableappliancepickup.com/san-gabriel-inland-empire-washer-dryer-pickup/'},
                          {'@type':'ListItem','position':4,'name':f'{city} Washer & Dryer Pickup','item':f'https://freereliableappliancepickup.com/{slug}/'}
                      ]
                  })
                  new_json = json.dumps(data, ensure_ascii=False, separators=(',',':'))
                  text = text[:m.start(1)] + new_json + text[m.end(1):]
              # Preserve full appliance visibility on pages that use the .photos gallery class.
              text = text.replace('.photos img{width:100%;height:260px;object-fit:cover;border-radius:10px}', '.photos img{width:100%;height:260px;object-fit:contain;background:#f5f7f6;border-radius:10px}')
              p.write_text(text, encoding='utf-8')

          old_assets = [
              '/assets/laundry/washer-dryer-set.jpg',
              '/assets/laundry/laundry-pair.jpg',
              '/assets/laundry/top-load-washer.jpg',
              '/assets/laundry/front-load-dryer.jpg',
              '/assets/laundry/stacked-laundry-center.jpg',
              '/assets/laundry/front-load-laundry-set.jpg',
          ]
          lines = ['Premium Corridor SEO Audit — 2026-09-15']
          results = []
          passed = 0
          missing = 0
          for city, slug in cities:
              p = Path(slug) / 'index.html'
              if not p.exists():
                  missing += 1
                  results.append(f'FAIL {city}: missing {p}')
                  continue
              t = p.read_text(encoding='utf-8')
              checks = {
                  'title': f'Free Washer & Dryer Pickup in {city}, CA | Appliance Removal' in t,
                  'canonical': f'https://freereliableappliancepickup.com/{slug}/' in t,
                  'h1': '<h1' in t and city in t,
                  'service_schema': '"@type":"Service"' in t or '"@type": "Service"' in t,
                  'faq_schema': 'FAQPage' in t,
                  'breadcrumb_schema': 'BreadcrumbList' in t,
                  'request_form': 'formspree.io/f/mvzeapzd' in t,
                  'corridor_link': '/san-gabriel-inland-empire-washer-dryer-pickup/' in t,
                  'neighbor_nav': 'data-premium-corridor-neighbors="1"' in t,
                  'no_old_blurry_assets': not any(old in t for old in old_assets),
              }
              ok = all(checks.values())
              if ok: passed += 1
              failed = ', '.join(k for k,v in checks.items() if not v) or 'none'
              results.append(f'{"PASS" if ok else "CHECK"} {city}: failed={failed}')

          lines.append(f'Pages passing all checks: {passed}/{len(cities)}')
          lines.append(f'Missing page files: {missing}')
          lines.extend(results)
          lines.extend(['', 'Strategy applied: exact city/service titles, descriptive internal links, browseable corridor hierarchy, sharp real-photo fallbacks, accurate qualification language, Service/FAQ/Breadcrumb checks, request-form checks, and sitemap coverage.'])
          Path('premium-corridor-audit.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          if passed != len(cities) or missing:
              raise SystemExit(f'Audit incomplete: {passed}/{len(cities)}, missing={missing}')
          PY

      - name: Commit breadcrumb fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upland-washer-dryer-pickup/index.html rancho-cucamonga-washer-dryer-pickup/index.html fontana-washer-dryer-pickup/index.html premium-corridor-audit.txt
          git commit -m "Complete premium corridor SEO audit"
          git push origin HEAD:main
