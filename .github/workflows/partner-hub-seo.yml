name: One-Time Partner Hub SEO

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/partner-hub-seo.yml'

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Improve partner hub and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 .github/scripts/partner_hub_seo.py
          rm -f .github/scripts/partner_hub_seo.py
          rm -f .github/workflows/partner-hub-seo.yml
          git add -A
          git commit -m "Make partner hub indexable useful and crawlable" || exit 0
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep 2
          done
          exit 1
