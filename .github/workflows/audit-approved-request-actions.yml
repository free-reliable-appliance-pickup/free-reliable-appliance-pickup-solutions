name: Audit Approved Request Actions
# rerun-after-request-repair-2026-09-18
# Protect approved customer-facing SEO pages from broken request buttons or missing intake forms.

on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - 'assets/customer-routing.js'
      - 'data/approved-indexable-locations.txt'
      - 'data/california-city-gold-standard-clusters.json'
      - '**/index.html'
      - '.github/workflows/audit-approved-request-actions.yml'
  pull_request:
    paths:
      - 'sitemap.xml'
      - 'assets/customer-routing.js'
      - 'data/approved-indexable-locations.txt'
      - 'data/california-city-gold-standard-clusters.json'
      - '**/index.html'
      - '.github/workflows/audit-approved-request-actions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate approved pages
        shell: python
        run: |
          from pathlib import Path
          import json
          import sys

          root = Path('.')
          approved_file = root / 'data' / 'approved-indexable-locations.txt'
          pages = [line.strip() for line in approved_file.read_text(encoding='utf-8').splitlines() if line.strip()]

          city_cfg_path = root / 'data' / 'california-city-gold-standard-clusters.json'
          city_cfg = json.loads(city_cfg_path.read_text(encoding='utf-8')) if city_cfg_path.exists() else {'clusters': []}
          shared_intake_children = {}
          for cluster in city_cfg.get('clusters', []):
              if not cluster.get('single_city_intake'):
                  continue
              main_slug = cluster.get('main')
              for child_slug in (cluster.get('children') or {}).values():
                  if main_slug and child_slug:
                      shared_intake_children[child_slug] = main_slug

          required = {
              'brand stylesheet': '/assets/site-brand.css',
              'customer routing script': '/assets/customer-routing.js',
              'same-page request link': 'href="#request"',
              'request section anchor': 'id="request"',
              'Formspree endpoint': 'https://formspree.io/f/mvzeapzd',
          }
          forbidden = {
              'homepage request redirect': 'href="/#request"',
              'parent-page request redirect': 'href="../#request"',
          }

          failures = []
          for slug in pages:
              page = root / slug / 'index.html'
              if not page.exists():
                  failures.append(f'{slug}: missing index.html')
                  continue
              text = page.read_text(encoding='utf-8', errors='replace')
              shared_main = shared_intake_children.get(slug)
              if shared_main:
                  for label, needle in {
                      'brand stylesheet': '/assets/site-brand.css',
                      'customer routing script': '/assets/customer-routing.js',
                  }.items():
                      if needle not in text:
                          failures.append(f'{slug}: missing {label}')
                  request_target = f'href="/{shared_main}/#request"'
                  if request_target not in text:
                      failures.append(f'{slug}: missing shared city request target {request_target}')
                  if 'https://formspree.io/f/mvzeapzd' in text:
                      failures.append(f'{slug}: contains duplicate Formspree endpoint instead of shared city intake')
              else:
                  for label, needle in required.items():
                      if needle not in text:
                          failures.append(f'{slug}: missing {label}')
              for label, needle in forbidden.items():
                  if needle in text:
                      failures.append(f'{slug}: contains {label}')

          print(f'Checked {len(pages)} approved indexable pages.')
          if failures:
              print('\nApproved-page request-action audit FAILED:')
              for item in failures:
                  print(f' - {item}')
              sys.exit(1)

          print('All approved pages use the correct request architecture: local forms where required and configured single-city intake redirects for benchmark specialty pages.')
