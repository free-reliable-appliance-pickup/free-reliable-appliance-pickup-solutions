name: TTG Recent States Free Pickup Wording Batch
on:
  push:
    paths:
      - '.github/workflows/ttg-recent-states-free-pickup-once.yml'
permissions:
  contents: write
jobs:
  apply-and-audit:
    if: github.ref == 'refs/heads/ttg/recent-states-free-pickup-20261110'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply California-style pickup wording (preserve customer forms and robots)
        run: python3 scripts/ttg_recent_state_free_copy.py --apply
      - name: Check all updated pages
        run: python3 scripts/ttg_recent_state_free_copy.py --check
      - name: Run state batch QA
        run: python3 scripts/ttg_state_batch_qa.py
      - name: Run TTG regression tests
        run: python3 -m unittest discover -s tests -p 'test_ttg_*.py'
      - name: Commit results to the review branch, remove one-time workflow
        run: |
          git config user.name "Free Reliable Website Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ttg-recent-states-free-pickup-once.yml
          git add -A
          git commit -m "TTG: California-model Free Pickup requests for recent states"
          git pull --rebase origin ttg/recent-states-free-pickup-20261110
          git push origin HEAD:ttg/recent-states-free-pickup-20261110
