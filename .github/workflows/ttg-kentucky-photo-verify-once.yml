name: TTG Kentucky Verified Specialty Photo Repair
on:
  push:
    paths:
      - '.github/workflows/ttg-kentucky-photo-verify-once.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/ttg/kentucky-california-gold-50city-20261110'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair all Kentucky cooling and stove hero images
        run: python3 scripts/ttg_ky_repair_photo_mappings.py
      - name: Verify Kentucky 251 customer pages
        run: python3 -m unittest tests.test_ttg_kentucky_pages -v
      - name: Verify all 12 FastTrack manifests
        run: python3 scripts/ttg_state_batch_qa.py
      - name: Verify full site appliance category imagery
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/audit-active-page-images.py > /tmp/ky-photo-audit.log 2>&1 || { tail -n 100 /tmp/ky-photo-audit.log; exit 1; }
          tail -n 7 /tmp/ky-photo-audit.log
      - name: Existing TTG regression suite
        run: python3 -m unittest discover -s tests -p 'test_ttg_*.py' > /tmp/ky-regression.log 2>&1 || { tail -n 100 /tmp/ky-regression.log; exit 1; }
      - name: Save verified 150 photos and drop one-time workflow
        run: |
          git config user.name "Free Reliable Website Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ttg-kentucky-photo-verify-once.yml
          git add -A
          git commit -m "TTG Kentucky: visually verified photos on all category pages"
          git pull --rebase origin ttg/kentucky-california-gold-50city-20261110
          git push origin HEAD:ttg/kentucky-california-gold-50city-20261110
