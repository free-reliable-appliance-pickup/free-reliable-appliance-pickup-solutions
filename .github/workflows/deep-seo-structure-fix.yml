name: One-Time Deep SEO Structure Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deep-seo-structure-fix.yml

permissions:
  contents: write

jobs:
  improve-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve crawl hierarchy trust and image signals
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          python3 <<'PY'
          from pathlib import Path
          import re, json, html

          BASE = "https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/"

          # Create smaller, descriptive copies of existing real appliance photos when available.
          assets = Path("assets")
          assets.mkdir(exist_ok=True)
          photo_sources = [
              (Path("IMG-20241210-WA0011.jpg"), assets / "major-appliance-pickup-photo-1.jpg"),
              (Path("IMG-20240403-WA0010.jpg"), assets / "major-appliance-pickup-photo-2.jpg"),
              (Path("IMG-20241025-WA0016.jpg"), assets / "major-appliance-pickup-photo-3.jpg"),
          ]
          for src, dst in photo_sources:
              if src.exists() and not dst.exists():
                  dst.write_bytes(src.read_bytes())

          # Trust/contact pages. Privacy and terms remain noindex so Google can focus on service content.
          pages = {
          "contact/index.html": f'''<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Contact Free Reliable Appliance Pickup | Service Numbers</title>
          <meta name="description" content="Contact Free Reliable Appliance Pickup for qualifying appliance pickup requests. Find service numbers for Oregon, Washington, California and Colorado.">
          <meta name="robots" content="index, follow"><link rel="canonical" href="{BASE}contact/">
          <link rel="icon" href="../assets/free-reliable-appliance-pickup-logo.svg" type="image/svg+xml">
          <style>body{{margin:0;font:17px/1.65 Arial,sans-serif;background:#f5f7f6;color:#222}}header{{background:#087443;color:#fff;text-align:center;padding:46px 18px}}main{{max-width:950px;margin:auto;padding:0 18px}}section{{background:#fff;margin:22px 0;padding:24px;border-radius:12px;border:1px solid #d7e5dc}}h2,h3{{color:#075c34}}.grid{{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}}.card{{border:1px solid #d7e5dc;padding:16px;border-radius:10px}}a{{color:#075c34}}footer{{background:#17352a;color:#fff;text-align:center;padding:25px}}footer a{{color:#fff}}</style>
          <script type="application/ld+json">{{"@context":"https://schema.org","@graph":[{{"@type":"ContactPage","name":"Contact Free Reliable Appliance Pickup","url":"{BASE}contact/"}},{{"@type":"Organization","name":"Free Reliable Appliance Pickup","url":"{BASE}","logo":"{BASE}assets/free-reliable-appliance-pickup-logo.svg","contactPoint":[{{"@type":"ContactPoint","telephone":"+1-503-868-4455","contactType":"customer service","areaServed":["Oregon","Washington"]}},{{"@type":"ContactPoint","telephone":"+1-909-375-6685","contactType":"customer service","areaServed":["Inland Empire","Orange County","Riverside County","Coachella Valley","Victor Valley","San Gabriel Valley"]}},{{"@type":"ContactPoint","telephone":"+1-310-774-4304","contactType":"customer service","areaServed":["Los Angeles County","California"]}},{{"@type":"ContactPoint","telephone":"+1-720-604-7498","contactType":"customer service","areaServed":["Colorado"]}}]}}]}}</script>
          </head><body><header><img src="../assets/free-reliable-appliance-pickup-logo.svg" alt="Free Reliable Appliance Pickup logo" width="110" height="110"><h1>Contact Free Reliable Appliance Pickup</h1><p>Send appliance condition, photos, city or ZIP code and access details so your request can be reviewed accurately.</p></header><main>
          <section><h2>Regional Contact Numbers</h2><div class="grid"><div class="card"><h3>Oregon &amp; Washington</h3><p><a href="tel:+15038684455">(503) 868-4455</a></p></div><div class="card"><h3>Inland Empire, Orange County &amp; Riverside Region</h3><p><a href="tel:+19093756685">(909) 375-6685</a></p></div><div class="card"><h3>Los Angeles &amp; Other California Coverage</h3><p><a href="tel:+13107744304">(310) 774-4304</a></p></div><div class="card"><h3>Colorado</h3><p><a href="tel:+17206047498">(720) 604-7498</a></p></div></div><p><strong>Hours:</strong> Monday through Sunday, 8:00 AM–8:00 PM.</p></section>
          <section><h2>Before You Contact Us</h2><p>Include the appliance type, working condition, city or ZIP code, floor level, stairs, tight access and clear photos. Free pickup is qualification-based and must be confirmed before scheduling.</p><p><a href="../#request">Use the online pickup request form</a> · <a href="../free-pickup-qualification/">Read pickup qualification</a> · <a href="../service-areas/">Browse service areas</a></p></section>
          </main><footer><a href="../">Home</a> · <a href="../about/">About</a> · <a href="../privacy/">Privacy</a> · <a href="../terms/">Service Terms</a></footer></body></html>''',
          "privacy/index.html": f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Privacy | Free Reliable Appliance Pickup</title><meta name="robots" content="noindex, follow"><link rel="canonical" href="{BASE}privacy/"><style>body{{max-width:900px;margin:40px auto;padding:0 18px;font:17px/1.65 Arial,sans-serif;color:#222}}a{{color:#075c34}}</style></head><body><h1>Privacy Information</h1><p>Free Reliable Appliance Pickup uses the information submitted through the pickup request form to review and respond to appliance pickup requests. Request information may include your name, phone number, email address, pickup location, appliance details, access information, message and any photos or photo details you provide.</p><p>The website uses Formspree to process form submissions. Information submitted through that form is also subject to Formspree's service and privacy practices. Do not submit passwords, payment-card numbers, government identification numbers or other unrelated sensitive information through the pickup form.</p><p>If you have a question about information associated with a pickup request, contact the service number for your region on our <a href="../contact/">Contact page</a>.</p><p><a href="../">Home</a> · <a href="../terms/">Service Terms</a></p></body></html>''',
          "terms/index.html": f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service Terms | Free Reliable Appliance Pickup</title><meta name="robots" content="noindex, follow"><link rel="canonical" href="{BASE}terms/"><style>body{{max-width:900px;margin:40px auto;padding:0 18px;font:17px/1.65 Arial,sans-serif;color:#222}}a{{color:#075c34}}</style></head><body><h1>Appliance Pickup Service Terms</h1><p>Submitting a request does not guarantee free pickup or a scheduled appointment. Each request is reviewed for appliance condition, location, access, current demand and available service or partner coverage.</p><p>Qualifying fully working appliances receive priority. Mixed loads may qualify when approximately 80% of the appliances work. Minor repairs may be considered. A nonworking appliance by itself does not qualify for free pickup. Dishwashers are considered only with two or more major working appliances, and microwaves are accepted only with another qualifying major appliance.</p><p>Please provide accurate appliance condition, location, stairs, floor level and access information. Pickup is confirmed only after the request has been reviewed.</p><p><a href="../contact/">Contact us</a> · <a href="../free-pickup-qualification/">Pickup qualification guide</a> · <a href="../">Home</a></p></body></html>'''
          }
          for name, content in pages.items():
              p = Path(name); p.parent.mkdir(parents=True, exist_ok=True)
              if not p.exists(): p.write_text(content, encoding="utf-8")

          # Add a real-photo proof section to the homepage without changing existing SEO copy.
          home = Path("index.html")
          text = home.read_text(encoding="utf-8")
          if 'id="real-pickup-photos"' not in text:
              photo_section = '''
          <section id="real-pickup-photos">
          <h2>Real Appliance Photos From Our Work</h2>
          <p>These are real appliance photos from our work and inventory, included so customers can see examples of the major household appliances we handle. They are not stock advertising images.</p>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
          <figure style="margin:0"><img src="assets/major-appliance-pickup-photo-1.jpg" alt="Major household appliance handled by Free Reliable Appliance Pickup" loading="lazy" decoding="async" style="width:100%;height:260px;object-fit:cover;border-radius:10px"><figcaption>Example appliance from our work.</figcaption></figure>
          <figure style="margin:0"><img src="assets/major-appliance-pickup-photo-2.jpg" alt="Household appliance from Free Reliable Appliance Pickup work and inventory" loading="lazy" decoding="async" style="width:100%;height:260px;object-fit:cover;border-radius:10px"><figcaption>Real appliance photo, not a stock image.</figcaption></figure>
          <figure style="margin:0"><img src="assets/major-appliance-pickup-photo-3.jpg" alt="Major appliance reviewed by Free Reliable Appliance Pickup" loading="lazy" decoding="async" style="width:100%;height:260px;object-fit:cover;border-radius:10px"><figcaption>Example of the appliance types we review.</figcaption></figure>
          </div>
          </section>
          '''
              marker = '<section id="pickup-eligibility">'
              if marker in text:
                  text = text.replace(marker, photo_section + '\n' + marker, 1)
              else:
                  text = text.replace('</main>', photo_section + '\n</main>', 1)
          # Add explicit trust links to homepage navigation/footer.
          if 'href="contact/"' not in text:
              text = text.replace('<a href="about/">About &amp; Contact</a>', '<a href="about/">About</a>\n<a href="contact/">Contact</a>', 1)
          if 'href="privacy/"' not in text:
              trust = '<p><a href="contact/">Contact</a> · <a href="about/">About</a> · <a href="privacy/">Privacy</a> · <a href="terms/">Service Terms</a></p>'
              text = text.replace('</footer>', trust + '\n</footer>', 1)
          home.write_text(text, encoding="utf-8")

          targets = {
              'portland-appliance-pickup/index.html': ('Oregon','oregon-appliance-pickup/','Portland'),
              'salem-appliance-pickup/index.html': ('Oregon','oregon-appliance-pickup/','Salem'),
              'keizer-appliance-pickup/index.html': ('Oregon','oregon-appliance-pickup/','Keizer'),
              'denver-appliance-pickup/index.html': ('Colorado','colorado-appliance-pickup/','Denver'),
              'aurora-appliance-pickup/index.html': ('Colorado','colorado-appliance-pickup/','Aurora'),
              'los-angeles-appliance-pickup/index.html': ('California','california-appliance-pickup/','Los Angeles'),
              'orange-county-appliance-pickup/index.html': ('California','california-appliance-pickup/','Orange County'),
              'inland-empire-appliance-pickup/index.html': ('California','california-appliance-pickup/','Inland Empire'),
              'riverside-appliance-pickup/index.html': ('California','california-appliance-pickup/','Riverside'),
              'riverside-county-appliance-pickup/index.html': ('California','california-appliance-pickup/','Riverside County'),
              'palm-desert-appliance-pickup/index.html': ('California','california-appliance-pickup/','Palm Desert'),
              'san-bernardino-county-appliance-pickup/index.html': ('California','california-appliance-pickup/','San Bernardino County'),
              'san-diego-appliance-pickup/index.html': ('California','california-appliance-pickup/','San Diego'),
              'stockton-appliance-pickup/index.html': ('California','california-appliance-pickup/','Stockton'),
              'phoenix-appliance-pickup/index.html': ('Arizona','arizona-appliance-pickup/','Phoenix'),
              'seattle-appliance-pickup/index.html': ('Washington','washington-appliance-pickup/','Seattle'),
              'las-vegas-appliance-pickup/index.html': ('Nevada','nevada-appliance-pickup/','Las Vegas'),
          }

          for filename, (state, state_path, label) in targets.items():
              p = Path(filename)
              if not p.exists():
                  continue
              t = p.read_text(encoding='utf-8', errors='ignore')
              page_url = BASE + p.parent.as_posix().strip('/') + '/'
              if '"@type":"BreadcrumbList"' not in t and '"@type": "BreadcrumbList"' not in t:
                  data = {
                      "@context":"https://schema.org",
                      "@type":"BreadcrumbList",
                      "itemListElement":[
                          {"@type":"ListItem","position":1,"name":"Home","item":BASE},
                          {"@type":"ListItem","position":2,"name":"Service Areas","item":BASE+'service-areas/'},
                          {"@type":"ListItem","position":3,"name":state,"item":BASE+state_path},
                          {"@type":"ListItem","position":4,"name":label,"item":page_url},
                      ]
                  }
                  script = '<script type="application/ld+json">'+json.dumps(data,separators=(',',':'))+'</script>\n'
                  t = re.sub(r'</head>', script+'</head>', t, count=1, flags=re.I)
              if 'class="seo-breadcrumb"' not in t:
                  crumb = f'''<div class="seo-breadcrumb" role="navigation" aria-label="Breadcrumb" style="max-width:1050px;margin:12px auto;padding:0 18px;font:14px/1.5 Arial,sans-serif"><a href="../" style="color:#075c34">Home</a> &rsaquo; <a href="../service-areas/" style="color:#075c34">Service Areas</a> &rsaquo; <a href="../{state_path}" style="color:#075c34">{html.escape(state)}</a> &rsaquo; <span>{html.escape(label)}</span></div>'''
                  t = re.sub(r'(<body\b[^>]*>)', r'\1\n'+crumb, t, count=1, flags=re.I)
              if 'href="../contact/"' not in t:
                  trust = '<p><a href="../contact/">Contact</a> · <a href="../about/">About</a> · <a href="../privacy/">Privacy</a> · <a href="../terms/">Service Terms</a></p>'
                  t = re.sub(r'</footer>', trust+'\n</footer>', t, count=1, flags=re.I)
              p.write_text(t, encoding='utf-8')

          # Add trust links to about and service areas without changing their main content.
          for filename in ['about/index.html','service-areas/index.html']:
              p=Path(filename)
              if not p.exists(): continue
              t=p.read_text(encoding='utf-8',errors='ignore')
              if 'href="../privacy/"' not in t:
                  trust='<p><a href="../contact/">Contact</a> · <a href="../privacy/">Privacy</a> · <a href="../terms/">Service Terms</a></p>'
                  t=re.sub(r'</footer>',trust+'\n</footer>',t,count=1,flags=re.I)
                  p.write_text(t,encoding='utf-8')
          PY

          rm -f .github/workflows/deep-seo-structure-fix.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Strengthen crawl hierarchy trust and image signals"

          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep 2
          done
          exit 1
