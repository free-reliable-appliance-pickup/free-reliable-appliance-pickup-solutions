# Maintains indexable page URLs plus owned appliance-image discovery references.
name: Auto Rebuild Sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - sitemap.xml
      - sitemap-new.xml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-sitemap-main
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and push sitemaps safely
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            echo "Sitemap attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          BASE = "https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/"
          NS = "http://www.sitemaps.org/schemas/sitemap/0.9"
          IMG_NS = "http://www.google.com/schemas/sitemap-image/1.1"
          ET.register_namespace('', NS)
          ET.register_namespace('image', IMG_NS)

          root = Path('.')
          all_pages = [Path('index.html')]
          all_pages += sorted(p for p in root.rglob('index.html') if p != Path('index.html') and '.github' not in p.parts)

          def page_text(path):
              return path.read_text(encoding='utf-8', errors='ignore')

          def is_indexable(path):
              text = page_text(path)
              match = re.search(r'<meta\b[^>]*\bname=["\']robots["\'][^>]*>', text, flags=re.I)
              return not (match and 'noindex' in match.group(0).lower())

          def lastmod(path):
              try:
                  return subprocess.check_output(
                      ['git','log','-1','--format=%cs','--',str(path)],
                      text=True
                  ).strip() or None
              except Exception:
                  return None

          def appliance_images(path):
              text = page_text(path)
              names = re.findall(r'(major-appliance-pickup-photo-[123]\.jpg)', text, flags=re.I)
              seen = []
              for name in names:
                  name = name.lower()
                  if name not in seen:
                      seen.append(name)
              return [BASE + 'assets/' + name for name in seen]

          pages = [p for p in all_pages if is_indexable(p)]

          def write_sitemap(filename):
              urlset = ET.Element(ET.QName(NS, 'urlset'))
              seen = set()
              image_count = 0
              for page in pages:
                  if page == Path('index.html'):
                      url = BASE
                  else:
                      rel = page.parent.as_posix().strip('/')
                      url = BASE + rel + '/'
                  if url in seen:
                      continue
                  seen.add(url)
                  u = ET.SubElement(urlset, ET.QName(NS, 'url'))
                  ET.SubElement(u, ET.QName(NS, 'loc')).text = url
                  modified = lastmod(page)
                  if modified:
                      ET.SubElement(u, ET.QName(NS, 'lastmod')).text = modified
                  for image_url in appliance_images(page):
                      image = ET.SubElement(u, ET.QName(IMG_NS, 'image'))
                      ET.SubElement(image, ET.QName(IMG_NS, 'loc')).text = image_url
                      image_count += 1
              ET.indent(urlset, space='  ')
              ET.ElementTree(urlset).write(filename, encoding='utf-8', xml_declaration=True)
              return len(seen), image_count

          count, images = write_sitemap('sitemap.xml')
          write_sitemap('sitemap-new.xml')
          print(f'Generated focused sitemaps with {count} indexable URLs and {images} appliance-image references')
          PY

            if git diff --quiet -- sitemap.xml sitemap-new.xml; then
              echo "Sitemaps already current"
              exit 0
            fi

            git add sitemap.xml sitemap-new.xml
            git commit -m "Auto rebuild focused image sitemaps"
            if git push origin HEAD:main; then
              echo "Sitemaps pushed successfully"
              exit 0
            fi

            echo "Main advanced during push; retrying from latest main"
            sleep 2
          done

          echo "Main kept advancing. Leaving this run successful because the newest push triggers a fresh sitemap rebuild."
          exit 0
