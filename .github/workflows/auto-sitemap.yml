# Read-only validation of approved indexable page URLs and sitemap coverage.
name: Validate Approved Sitemap
on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - 'sitemap-regular-washer-dryer.xml'
      - 'data/approved-indexable-locations.txt'
      - '.github/workflows/auto-sitemap.yml'
  pull_request:
    paths:
      - 'sitemap.xml'
      - 'sitemap-regular-washer-dryer.xml'
      - 'data/approved-indexable-locations.txt'
      - '.github/workflows/auto-sitemap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved indexable pages are covered by published sitemaps
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys, xml.etree.ElementTree as ET
          BASE='https://freereliableappliancepickup.com/'
          approved_raw=[x.strip() for x in Path('data/approved-indexable-locations.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          approved_locations=set(approved_raw)
          # Freeze location-page expansion at the current audited baseline.
          # New indexable location URLs should replace/consolidate an existing entry rather than
          # continuously increasing the footprint. This guards against doorway/scaled-content drift.
          MAX_APPROVED_LOCATION_PAGES=503
          if len(approved_raw) != len(approved_locations):
              print('ERROR: duplicate entries in data/approved-indexable-locations.txt')
              sys.exit(1)
          if len(approved_locations) > MAX_APPROVED_LOCATION_PAGES:
              print(f'ERROR: approved indexable location count {len(approved_locations)} exceeds the {MAX_APPROVED_LOCATION_PAGES}-page quality ceiling')
              print('Consolidate or retire an existing location URL before approving another indexable location page.')
              sys.exit(1)
          approved_nonlocation={'','about','appliance-pickup-checklist','commercial-appliance-pickup','contact','free-pickup-qualification','freezer-pickup','how-appliance-pickup-works','landlord-property-manager-appliance-pickup','old-appliance-disposal-options','partners','refrigerator-pickup','service-areas','stove-oven-pickup','washer-dryer-pickup','california-washer-dryer-pickup','fresno-washer-dryer-pickup','los-angeles-county-washer-dryer-pickup','orange-county-washer-dryer-pickup','riverside-county-washer-dryer-pickup','san-bernardino-county-washer-dryer-pickup','san-gabriel-inland-empire-washer-dryer-pickup','southern-california-washer-dryer-pickup'}
          approved=approved_locations|approved_nonlocation
          pages=[Path('index.html')]+sorted(p for p in Path('.').rglob('index.html') if p!=Path('index.html') and '.github' not in p.parts and '.git' not in p.parts)
          def relpath(p): return '' if p==Path('index.html') else p.parent.as_posix().strip('/')
          def indexable(p):
              s=p.read_text(encoding='utf-8',errors='ignore')
              m=re.search(r'<meta\b[^>]*\bname=["\']robots["\'][^>]*>',s,re.I)
              return not (m and 'noindex' in m.group(0).lower())
          unexpected=[str(p) for p in pages if indexable(p) and relpath(p) not in approved]
          if unexpected:
              print('ERROR: unapproved indexable pages detected:')
              [print(' -',p) for p in unexpected]
              sys.exit(1)
          expected={BASE if not relpath(p) else BASE+relpath(p)+'/' for p in pages if indexable(p) and relpath(p) in approved}
          def sitemap_urls(filename):
              root=ET.parse(filename).getroot()
              urls=set()
              for loc in root.findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc'):
                  if loc.text: urls.add(loc.text.strip())
              return urls
          published_files=['sitemap.xml']
          if Path('sitemap-regular-washer-dryer.xml').exists(): published_files.append('sitemap-regular-washer-dryer.xml')
          actual=set()
          for filename in published_files: actual |= sitemap_urls(filename)
          missing=sorted(expected-actual)
          extra=sorted(url for url in actual if url.startswith(BASE) and url[len(BASE):].strip('/') not in approved)
          foreign=sorted(url for url in actual if not url.startswith(BASE))
          errors=[]
          if missing: errors.append('published sitemaps missing: '+', '.join(missing))
          if extra: errors.append('published sitemaps contain unapproved URLs: '+', '.join(extra))
          if foreign: errors.append('published sitemaps contain foreign URLs: '+', '.join(foreign))
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print(f'PASS: {len(expected)} approved indexable URLs are covered by published sitemaps')
          PY
