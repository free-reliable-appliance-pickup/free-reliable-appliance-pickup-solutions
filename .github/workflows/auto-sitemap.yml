# Maintains indexable page URLs plus owned appliance-image discovery references.
name: Auto Rebuild Sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - sitemap.xml
      - sitemap-new.xml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-sitemap-main
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild sitemaps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess, xml.etree.ElementTree as ET
          BASE = "https://freereliableappliancepickup.com/"
          NS = "http://www.sitemaps.org/schemas/sitemap/0.9"
          IMG_NS = "http://www.google.com/schemas/sitemap-image/1.1"
          ET.register_namespace('', NS); ET.register_namespace('image', IMG_NS)
          pages=[Path('index.html')]+sorted(p for p in Path('.').rglob('index.html') if p!=Path('index.html') and '.github' not in p.parts)
          def text(p): return p.read_text(encoding='utf-8',errors='ignore')
          def indexable(p):
              m=re.search(r'<meta\b[^>]*\bname=["\']robots["\'][^>]*>',text(p),re.I)
              return not (m and 'noindex' in m.group(0).lower())
          def lastmod(p):
              try: return subprocess.check_output(['git','log','-1','--format=%cs','--',str(p)],text=True).strip() or None
              except: return None
          def images(p):
              found=[]
              for n in re.findall(r'(major-appliance-pickup-photo-[123]\.jpg)',text(p),re.I):
                  n=n.lower()
                  if n not in found: found.append(n)
              return [BASE+'assets/'+n for n in found]
          pages=[p for p in pages if indexable(p)]
          def write(fn):
              root=ET.Element(ET.QName(NS,'urlset')); seen=set()
              for p in pages:
                  url=BASE if p==Path('index.html') else BASE+p.parent.as_posix().strip('/')+'/'
                  if url in seen: continue
                  seen.add(url); u=ET.SubElement(root,ET.QName(NS,'url')); ET.SubElement(u,ET.QName(NS,'loc')).text=url
                  lm=lastmod(p)
                  if lm: ET.SubElement(u,ET.QName(NS,'lastmod')).text=lm
                  for im in images(p):
                      x=ET.SubElement(u,ET.QName(IMG_NS,'image')); ET.SubElement(x,ET.QName(IMG_NS,'loc')).text=im
              ET.indent(root,space='  '); ET.ElementTree(root).write(fn,encoding='utf-8',xml_declaration=True)
              return len(seen)
          print('Indexable URLs:',write('sitemap.xml')); write('sitemap-new.xml')
          PY
          git add sitemap.xml sitemap-new.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild sitemap from indexable pages on custom domain"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
