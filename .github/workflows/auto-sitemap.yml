# Read-only validation of approved indexable page URLs and sitemap coverage.
name: Validate Approved Sitemap
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved indexable pages match both sitemaps
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys, xml.etree.ElementTree as ET
          BASE='https://freereliableappliancepickup.com/'
          approved_locations={'california-appliance-pickup','oregon-appliance-pickup','washington-appliance-pickup','arizona-appliance-pickup','colorado-appliance-pickup','nevada-appliance-pickup','utah-appliance-pickup','idaho-appliance-pickup','portland-appliance-pickup','salem-appliance-pickup','denver-appliance-pickup','aurora-appliance-pickup','inland-empire-appliance-pickup','los-angeles-appliance-pickup','los-angeles-county-appliance-pickup','riverside-county-appliance-pickup','orange-county-appliance-pickup','san-diego-county-appliance-pickup','sf-bay-area-appliance-pickup','central-valley-appliance-pickup','central-coast-appliance-pickup','las-vegas-valley-appliance-pickup','phoenix-appliance-pickup','phoenix-metro-appliance-pickup','puget-sound-appliance-pickup','rancho-cucamonga-appliance-pickup','fontana-appliance-pickup','ontario-appliance-pickup','riverside-appliance-pickup','anaheim-appliance-pickup','irvine-appliance-pickup','lakewood-appliance-pickup','long-beach-appliance-pickup','pasadena-appliance-pickup','santa-ana-appliance-pickup','mission-viejo-appliance-pickup','gresham-appliance-pickup','hillsboro-appliance-pickup','beaverton-appliance-pickup','keizer-appliance-pickup','arvada-appliance-pickup','centennial-appliance-pickup','temecula-appliance-pickup','tigard-appliance-pickup','happy-valley-appliance-pickup','oregon-city-appliance-pickup','parker-appliance-pickup','westminster-appliance-pickup','thornton-appliance-pickup','chino-appliance-pickup','chino-hills-appliance-pickup','upland-appliance-pickup','fullerton-appliance-pickup','lake-forest-appliance-pickup','costa-mesa-appliance-pickup','huntington-beach-appliance-pickup','newport-beach-appliance-pickup','fountain-valley-appliance-pickup','brea-appliance-pickup','redlands-appliance-pickup','yucaipa-appliance-pickup','claremont-appliance-pickup','pomona-appliance-pickup','west-covina-appliance-pickup'}
          approved_nonlocation={'','about','appliance-pickup-checklist','contact','free-pickup-qualification','freezer-pickup','how-appliance-pickup-works','landlord-property-manager-appliance-pickup','old-appliance-disposal-options','partners','refrigerator-pickup','service-areas','stove-oven-pickup','washer-dryer-pickup'}
          approved=approved_locations|approved_nonlocation
          pages=[Path('index.html')]+sorted(p for p in Path('.').rglob('index.html') if p!=Path('index.html') and '.github' not in p.parts and '.git' not in p.parts)
          def relpath(p): return '' if p==Path('index.html') else p.parent.as_posix().strip('/')
          def indexable(p):
              s=p.read_text(encoding='utf-8',errors='ignore')
              m=re.search(r'<meta\b[^>]*\bname=["\']robots["\'][^>]*>',s,re.I)
              return not (m and 'noindex' in m.group(0).lower())
          unexpected=[str(p) for p in pages if indexable(p) and relpath(p) not in approved]
          if unexpected:
              print('ERROR: unapproved indexable pages detected:')
              [print(' -',p) for p in unexpected]
              sys.exit(1)
          expected={BASE if not relpath(p) else BASE+relpath(p)+'/' for p in pages if indexable(p) and relpath(p) in approved}
          def sitemap_urls(filename):
              root=ET.parse(filename).getroot()
              urls=set()
              for loc in root.findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc'):
                  if loc.text: urls.add(loc.text.strip())
              return urls
          errors=[]
          for filename in ('sitemap.xml','sitemap-new.xml'):
              actual=sitemap_urls(filename)
              missing=sorted(expected-actual); extra=sorted(actual-expected)
              if missing: errors.append(filename+' missing: '+', '.join(missing))
              if extra: errors.append(filename+' extra: '+', '.join(extra))
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print(f'PASS: {len(expected)} approved indexable URLs match sitemap.xml and sitemap-new.xml exactly')
          PY