name: Protect original full-resolution washer dryer photos

on:
  push:
    paths:
      - '.github/workflows/restore-full-resolution-laundry-heroes.yml'

permissions:
  contents: read

jobs:
  verify-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify original photo without modifying it
        shell: bash
        run: |
          set -euo pipefail
          src='file_00000000051c81fda2fa9f1edefd32f7.png'

          if [[ ! -f "$src" ]]; then
            echo "Missing original full-resolution photo: $src" >&2
            exit 1
          fi

          bytes=$(wc -c < "$src")
          sha256=$(sha256sum "$src" | awk '{print $1}')
          printf 'Original photo preserved exactly as committed.\nFile: %s\nBytes: %s\nSHA-256: %s\n' "$src" "$bytes" "$sha256"

          # Important: this workflow intentionally does NOT resize, crop, rotate,
          # convert, recompress, or overwrite any user photo. Display cropping
          # belongs in CSS (object-fit/object-position), never in the image bytes.
