name: Priority Local SEO Upgrade

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  priority-seo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Upgrade priority ranking pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import date
          import html
          import xml.etree.ElementTree as ET
          import json

          BASE = "https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/"
          BRAND = "Free Reliable Appliance Pickup"
          TODAY = date.today().isoformat()
          changed = []

          def write(path, text):
              path = Path(path)
              old = path.read_text(encoding="utf-8", errors="ignore") if path.exists() else None

              if old != text:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          def local_link(slug, label):
              target = Path(slug) / "index.html"

              if target.exists():
                  return f'<a href="../{slug}/">{html.escape(label)}</a>'

              return f'<span>{html.escape(label)}</span>'

          def render_page(d):
              city_links = " ".join(
                  local_link(slug, label)
                  if slug
                  else f"<span>{html.escape(label)}</span>"
                  for label, slug in d["areas"]
              )

              neighborhoods = "".join(
                  f"<li>{html.escape(x)}</li>"
                  for x in d["neighborhoods"]
              )

              appliances = "".join(
                  f'''
                  <div class="card">
                  <h3>{html.escape(title)}</h3>
                  <p>{html.escape(text)}</p>
                  </div>
                  '''
                  for title, text in d["appliances"]
              )

              faqs_html = "".join(
                  f'''
                  <div class="faq">
                  <h3>{html.escape(q)}</h3>
                  <p>{html.escape(a)}</p>
                  </div>
                  '''
                  for q, a in d["faqs"]
              )

              faq_json = json.dumps(
                  [
                      {
                          "@type": "Question",
                          "name": q,
                          "acceptedAnswer": {
                              "@type": "Answer",
                              "text": a
                          }
                      }
                      for q, a in d["faqs"]
                  ],
                  ensure_ascii=False
              )

              official = ""

              if d.get("official_url"):
                  official = f'''
                  <section>
                  <h2>Local Appliance Disposal Information</h2>

                  <p>
                  {html.escape(d["official_text"])}
                  </p>

                  <p>
                  <a
                  href="{html.escape(d["official_url"])}"
                  target="_blank"
                  rel="noopener">
                  View the official local resource
                  </a>
                  </p>

                  </section>
                  '''

              return f'''<!DOCTYPE html>
