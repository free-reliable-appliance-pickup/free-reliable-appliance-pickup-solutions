name: Fix remaining Coachella audit issues

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-coachella-audit-issues.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix titles and strengthen Indian Wells
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'cathedral-city-appliance-pickup/index.html': (
                  'Free Appliance Pickup in Cathedral City | Washer, Dryer & Refrigerator Pickup',
                  'Free Appliance Pickup Cathedral City CA | Appliance Removal'
              ),
              'la-quinta-appliance-pickup/index.html': (
                  'Free Appliance Pickup in La Quinta | Washer, Dryer & Refrigerator Pickup',
                  'Free Appliance Pickup La Quinta CA | Appliance Removal'
              ),
              'indian-wells-appliance-pickup/index.html': (
                  'Free Appliance Pickup in Indian Wells | Washer, Dryer & Refrigerator Pickup',
                  'Free Appliance Pickup Indian Wells CA | Appliance Removal'
              )
          }
          for filename, (old, new) in replacements.items():
              p = Path(filename)
              s = p.read_text()
              if old in s:
                  s = s.replace(old, new, 1)
              p.write_text(s)

          p = Path('indian-wells-appliance-pickup/index.html')
          s = p.read_text()
          marker = '<section id="priority-seo-finish-2026"'
          if 'id="indian-wells-local-details"' not in s:
              section = '''<section id="indian-wells-local-details">
<h2>Indian Wells Appliance Pickup Preparation</h2>
<p>For a faster review, identify every appliance separately and tell us whether it is fully working, needs a minor repair, is not working, or has an unknown condition. For refrigerators and freezers, include an interior photo and confirm whether the unit is currently cooling. For washers and dryers, tell us whether the washer fills, drains and spins and whether the dryer heats and tumbles.</p>
<p>Access details matter before a pickup is scheduled. Include the floor level, stairs, gates, narrow doorways, tight hallways, garage or outside location, and whether an appliance door may need to be removed for safe movement. For multiple-appliance requests, list the condition of each item so the qualifying working share of the load can be reviewed in advance.</p>
<p>Indian Wells requests are reviewed together with nearby Coachella Valley coverage. You can also review our pages for <a href="../palm-desert-appliance-pickup/">Palm Desert appliance pickup</a>, <a href="../la-quinta-appliance-pickup/">La Quinta appliance pickup</a>, <a href="../rancho-mirage-appliance-pickup/">Rancho Mirage appliance pickup</a>, <a href="../palm-springs-appliance-pickup/">Palm Springs appliance pickup</a>, and <a href="../cathedral-city-appliance-pickup/">Cathedral City appliance pickup</a>.</p>
</section>

'''
              if marker not in s:
                  raise SystemExit('Indian Wells insertion marker missing')
              s = s.replace(marker, section + marker, 1)
              p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cathedral-city-appliance-pickup/index.html la-quinta-appliance-pickup/index.html indian-wells-appliance-pickup/index.html
          git diff --cached --quiet || git commit -m "Fix Coachella SEO audit issues"
          git push
