name: Strengthen homepage priority links

on:
  push:
    paths:
      - '.github/workflows/strengthen-homepage-priority-links.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add focused internal links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          replacements = {
            '<div class="card"><h3>Refrigerators</h3><p>Working refrigerators and qualifying units with minor repair needs.</p></div>':
            '<div class="card"><h3><a href="/refrigerator-pickup/">Refrigerator Pickup</a></h3><p>Working refrigerators and qualifying units with minor repair needs.</p></div>',
            '<div class="card"><h3>Washers & Dryers</h3><p>High-demand laundry appliances, including qualifying sets and individual units.</p></div>':
            '<div class="card"><h3><a href="/washer-dryer-pickup/">Washer &amp; Dryer Pickup</a></h3><p>High-demand laundry appliances, including qualifying sets and individual units.</p></div>',
            '<div class="card"><h3>Stoves & Freezers</h3><p>Ranges, ovens and freezers are reviewed based on condition and route availability.</p></div>':
            '<div class="card"><h3>Stoves &amp; Freezers</h3><p><a href="/stove-oven-pickup/">Stoves, ranges and ovens</a> and <a href="/freezer-pickup/">freezers</a> are reviewed based on condition and route availability.</p></div>',
            '<a class="pill" href="/los-angeles-appliance-pickup/">Los Angeles</a><a class="pill" href="/phoenix-appliance-pickup/">Phoenix</a>':
            '<a class="pill" href="/california-appliance-pickup/">California</a><a class="pill" href="/los-angeles-county-appliance-pickup/">Los Angeles County</a><a class="pill" href="/los-angeles-appliance-pickup/">Los Angeles</a><a class="pill" href="/phoenix-appliance-pickup/">Phoenix</a>'
          }
          changed = 0
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected homepage block not found: {old[:80]}')
              text = text.replace(old, new, 1)
              changed += 1
          if changed != 4:
              raise SystemExit('Unexpected replacement count')
          p.write_text(text)
          PY
      - name: Commit homepage link improvements
        run: |
          if git diff --quiet -- index.html; then
            echo 'No homepage changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Strengthen homepage internal links to priority pages'
          git push
