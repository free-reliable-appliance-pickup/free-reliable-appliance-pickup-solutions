name: One-Time Competitor Edge SEO Pass

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/competitor-edge-final.yml'

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply competitor-informed improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          echo '    ' | tr -d ' ' | base64 -d > /tmp/competitor_edge.py
          python3 /tmp/competitor_edge.py
          rm -f .github/workflows/competitor-edge-final.yml
          git add -A
          git commit -m "Strengthen competitor edge hierarchy images and trust" || exit 0
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep 2
          done
          exit 1
