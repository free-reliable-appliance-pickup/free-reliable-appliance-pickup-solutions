name: TTG One-Time Recent States California Customer Copy
on:
  push:
    branches:
      - ttg/recent-states-free-pickup-20261110
    paths:
      - .github/workflows/ttg-recent-free-customer-copy.yml
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Apply Free Appliance Pickup copy across recent states
        run: python3 scripts/ttg_recent_state_free_copy.py --apply
      - name: Check all 10 state manifests, forms and page copy
        run: |
          python3 scripts/ttg_recent_state_free_copy.py --check
          python3 scripts/ttg_state_batch_qa.py
      - name: Customer-focused state and city regression tests
        run: |
          PYTHONPATH=. python3 -m unittest tests.test_ttg_free_pickup_state_hubs tests.test_ttg_minnesota_pages tests.test_ttg_free_city_category_copy
      - name: Record verified changes and remove one-time workflow
        run: |
          git config user.name "Free Reliable Website Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/ttg-recent-free-customer-copy.yml
          git add -u
          git commit -m "TTG California model: Free Appliance Pickup copy across 10 recent states"
          git fetch origin ttg/recent-states-free-pickup-20261110
          git pull --rebase origin ttg/recent-states-free-pickup-20261110
          git push origin HEAD:ttg/recent-states-free-pickup-20261110

