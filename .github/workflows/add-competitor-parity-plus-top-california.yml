name: Add Competitor Parity Plus Top California

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-competitor-parity-plus-top-california.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add competitor-parity-plus conversion structure
        shell: python
        run: |
          from pathlib import Path
          import re

          cities={
            'los-angeles':('Los Angeles','310-774-4304'),
            'anaheim':('Anaheim','909-375-6685'),
            'riverside':('Riverside','909-375-6685'),
            'rancho-cucamonga':('Rancho Cucamonga','909-375-6685'),
            'san-bernardino':('San Bernardino','909-375-6685'),
            'fontana':('Fontana','909-375-6685'),
            'ontario':('Ontario','909-375-6685'),
            'pomona':('Pomona','909-375-6685'),
            'west-covina':('West Covina','909-375-6685'),
            'pasadena':('Pasadena','909-375-6685'),
            'long-beach':('Long Beach','310-774-4304'),
            'santa-ana':('Santa Ana','909-375-6685'),
            'irvine':('Irvine','909-375-6685'),
            'corona':('Corona','909-375-6685'),
            'moreno-valley':('Moreno Valley','909-375-6685'),
            'victorville':('Victorville','909-375-6685'),
          }

          failures=[]
          changed=[]

          for slug,(city,phone) in cities.items():
              page=Path(f'{slug}-appliance-pickup')/'index.html'
              if not page.exists():
                  failures.append(f'{slug}: missing page')
                  continue

              s=page.read_text(encoding='utf-8',errors='replace')
              old=s
              low=s.lower()

              # Do not duplicate if already added.
              if 'competitor-parity-plus-20260920' in low:
                  continue

              req=re.search(r'<section\s+id=["\']request["\'][^>]*>',s,re.I)
              if not req:
                  failures.append(f'{slug}: request section missing')
                  continue

              tel=''.join(ch for ch in phone if ch.isdigit())
              block=f'''
<section class="competitor-parity-plus-20260920">
  <h2>How {city} Appliance Pickup Requests Work</h2>
  <div class="grid">
    <div class="card"><h3>1. Send the appliance details</h3><p>Tell us the appliance type, exact {city} pickup address, working condition and whether it is in a garage, driveway, apartment or interior room.</p></div>
    <div class="card"><h3>2. Send clear photos and access details</h3><p>Photos help verify appliance type, cosmetic condition, size and removal access. Include stairs, gates, elevators, tight doors, parking or long carrying distance.</p></div>
    <div class="card"><h3>3. We review qualification and route availability</h3><p>If the appliance qualifies and the current route can accept it, pickup details are confirmed directly. Submitting the form is a review request, not an automatic appointment.</p></div>
  </div>

  <h2>Why Our Photo-First Review Is Useful</h2>
  <div class="grid">
    <div class="card"><h3>Clear qualification before scheduling</h3><p>Working and reusable major appliances receive priority. A single nonworking appliance generally does not qualify for free pickup, so condition is reviewed before a route is promised.</p></div>
    <div class="card"><h3>Real appliance photos</h3><p>Our website uses real appliance photos from our work and inventory. Your own photos help us compare condition and access accurately before pickup.</p></div>
    <div class="card"><h3>Inside-access details matter</h3><p>Garage, first-floor and interior pickups can be very different from upstairs apartments or gated properties. The removal path is reviewed with the appliance itself.</p></div>
    <div class="card"><h3>Local alternatives when needed</h3><p>If a request does not qualify, our city pages point customers toward appropriate municipal, utility, waste-hauler or recycling options when available.</p></div>
  </div>

  <h2>Best Photos to Send for a Faster Review</h2>
  <div class="grid">
    <div class="card"><h3>Full appliance view</h3><p>Send a clear front or full-unit photo so the appliance type, style and visible condition can be reviewed.</p></div>
    <div class="card"><h3>Interior or operating area</h3><p>For refrigerators and freezers, include the interior. For washers, dryers, stoves and ranges, show the usable areas and describe what functions were tested.</p></div>
    <div class="card"><h3>Model label when available</h3><p>A model or serial-label photo can help identify size, configuration and age without guessing.</p></div>
    <div class="card"><h3>Removal path</h3><p>If access may be difficult, include the doorway, stairs, gate, hallway, elevator or path from the appliance to the loading area.</p></div>
  </div>

  <div class="note"><strong>Ready for pickup review in {city}?</strong> Use the request form below, or call/text <a href="tel:+1{tel}">{phone}</a>. Free pickup depends on appliance condition, access, local demand and current route availability.</div>
  <p><a class="btn" href="#request">Check {city} Pickup Qualification</a></p>
</section>
'''
              s=s[:req.start()]+block+s[req.start():]

              # Verify the core page remains intact.
              low=s.lower()
              checks={
                'canonical':f'https://freereliableappliancepickup.com/{slug}-appliance-pickup/' in low,
                'request':'id="request"' in low or "id='request'" in low,
                'formspree':'https://formspree.io/f/mvzeapzd' in low,
                'routing':'customer-routing.js' in low,
                'real proof':('major-appliance-pickup-photo' in low or 'real appliance example' in low),
                'marker':'competitor-parity-plus-20260920' in low,
              }
              missing=[k for k,v in checks.items() if not v]
              if missing:
                  failures.append(f"{slug}: missing after update: {', '.join(missing)}")
                  continue

              page.write_text(s,encoding='utf-8')
              changed.append(slug)

          if failures:
              print('FAILURES')
              for f in failures: print('-',f)
              raise SystemExit(1)

          print('PAGES_CHANGED',len(changed))
          print('\n'.join(changed))

      - name: Commit competitor parity plus improvements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*-appliance-pickup/index.html'
          if git diff --cached --quiet; then
            echo "No competitor-parity changes needed"
            exit 0
          fi
          git commit -m "Add competitor parity plus structure to top California pages"
          git pull --rebase origin main
          git push
