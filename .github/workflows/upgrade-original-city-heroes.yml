name: Apply verified original city heroes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upgrade-original-city-heroes.yml'
      - 'assets/premium-user-heroes.json'

permissions:
  contents: write

concurrency:
  group: apply-verified-original-city-heroes
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply verified full-resolution hero references
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          manifest = json.loads(Path('assets/premium-user-heroes.json').read_text(encoding='utf-8'))
          stamp = '20260920a'
          changed = []
          verified = []

          def repl_once(pattern, replacement, text, flags=0):
              return re.sub(pattern, replacement, text, count=1, flags=flags)

          for route, meta in manifest.items():
              src = str(meta.get('src', '')).lstrip('/')
              if not src.startswith('assets/laundry/original-user-heroes/'):
                  continue
              source_path = Path(src)
              if not source_path.is_file() or source_path.stat().st_size == 0:
                  raise SystemExit(f'Missing approved original hero source for {route}: {src}')

              route = route.strip('/')
              page = Path(route) / 'index.html'
              if not page.is_file():
                  print('Missing page:', page)
                  continue

              src = '/' + src
              hero_url = src + '?original-fullres=' + stamp
              absolute_url = 'https://freereliableappliancepickup.com' + hero_url

              old = page.read_text(encoding='utf-8')
              new = old

              # Visible hero image.
              new = repl_once(
                  r'(<div class="site-hero-art"[^>]*><img\b[^>]*\bsrc=")[^"]+(")',
                  lambda m: m.group(1) + hero_url + m.group(2),
                  new,
                  re.S,
              )

              # Any page-specific load handler that can override the visible hero.
              new = repl_once(
                  r"(img\.src=')[^']+(')",
                  lambda m: m.group(1) + hero_url + m.group(2),
                  new,
              )

              # The final premium hero lock wins after other scripts load.
              new = repl_once(
                  r'(<script data-premium-hero-lock="1">.*?var s=")[^"]+(")',
                  lambda m: m.group(1) + hero_url + m.group(2),
                  new,
                  re.S,
              )

              # Keep social/search image metadata aligned with the actual city hero.
              new = repl_once(
                  r'(<meta property="og:image" content=")[^"]+(")',
                  lambda m: m.group(1) + absolute_url + m.group(2),
                  new,
              )
              new = repl_once(
                  r'(<meta name="twitter:image" content=")[^"]+(")',
                  lambda m: m.group(1) + absolute_url + m.group(2),
                  new,
              )
              new = repl_once(
                  r'("primaryImageOfPage":\{"@type":"ImageObject","url":")[^"]+(")',
                  lambda m: m.group(1) + absolute_url + m.group(2),
                  new,
              )

              verified.append({'route': route, 'src': src, 'page': page.as_posix()})
              if new != old:
                  page.write_text(new, encoding='utf-8')
                  changed.append(page.as_posix())
                  print('Updated:', route, '=>', src)
              else:
                  print('Already aligned:', route)

          report = {
              'purpose': 'Keep each manually verified city assignment on its original full-resolution photo and prevent page scripts from overriding it.',
              'verified': verified,
              'changed_pages': changed,
              'changed_count': len(changed),
          }
          Path('assets/laundry/verified-original-hero-apply-report.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          print('Changed pages:', len(changed))
          PY

      - name: Force fresh shared CSS on every washer dryer city page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          stamp = '20260921sharp'
          changed = []
          pattern = re.compile(r'(<link[^>]+href=["\']/assets/site-brand\.css)(?:\?[^"\']*)?(["\'])', re.I)

          for page in Path('.').glob('*-washer-dryer-pickup/index.html'):
              old = page.read_text(encoding='utf-8')
              new = pattern.sub(lambda m: m.group(1) + '?v=' + stamp + m.group(2), old, count=1)
              if new != old:
                  page.write_text(new, encoding='utf-8')
                  changed.append(page.as_posix())
                  print('Refreshed CSS cache key:', page)

          print('Washer/dryer pages refreshed:', len(changed))
          PY

      - name: Verify every approved mapping before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, sys

          manifest = json.loads(Path('assets/premium-user-heroes.json').read_text(encoding='utf-8'))
          failures=[]
          checked=0

          for route, info in manifest.items():
              src = str(info.get('src','')).lstrip('/')
              if not src.startswith('assets/laundry/original-user-heroes/'):
                  failures.append(f'{route}: invalid approved source {src}')
                  continue
              page=Path(route.strip('/'))/'index.html'
              if not page.is_file():
                  failures.append(f'{route}: missing page')
                  continue

              text=page.read_text(encoding='utf-8')
              rel='/'+src
              absolute='https://freereliableappliancepickup.com/'+src
              checked+=1
              checks={
                  'Open Graph image': re.search(r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']'+re.escape(absolute),text,re.I),
                  'Twitter image': re.search(r'<meta[^>]+name=["\']twitter:image["\'][^>]+content=["\']'+re.escape(absolute),text,re.I),
                  'primaryImageOfPage': ('primaryImageOfPage' in text and absolute in text),
                  'visible hero': re.search(r'class=["\']site-hero-art["\'][\s\S]{0,1200}?<img[^>]+src=["\']'+re.escape(rel),text,re.I),
                  'hero lock': re.search(r'data-premium-hero-lock=["\']1["\'][\s\S]{0,2500}?'+re.escape(rel),text,re.I),
              }
              for label,ok in checks.items():
                  if not ok:
                      failures.append(f'{route}: {label} not aligned to {src}')

          print(f'Checked {checked} approved original hero pages.')
          if failures:
              print('FAILED:')
              for item in failures:
                  print(' -',item)
              sys.exit(1)
          print('PASS: all approved city hero references use exact original-user-heroes files.')
          PY

      - name: Commit verified original-resolution hero upgrades
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/laundry/verified-original-hero-apply-report.json
          git add -- '*washer-dryer-pickup/index.html' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No verified hero changes to commit.'
          else
            git commit -m 'Use verified original full-resolution city heroes'
            git pull --rebase origin main
            git push origin main
          fi
