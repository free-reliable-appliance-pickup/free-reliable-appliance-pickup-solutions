name: TTG State Operational Readiness (No Auto Activation)

on:
  pull_request:
    paths:
      - 'scripts/ttg_release_readiness.py'
      - 'tests/test_ttg_release_readiness.py'
      - 'data/ttg-state-batches/**'
      - 'data/ttg-release-readiness/**'
      - 'data/market-routing.json'
      - '.github/workflows/ttg-operational-readiness.yml'
  workflow_dispatch:
  schedule:
    - cron: '51 13 * * *'

permissions:
  contents: read

jobs:
  state-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Regression tests
        run: python -m unittest discover -s tests -p 'test_ttg_release_readiness.py' -v
      - name: Stage safety and operational evidence report (never sends forms)
        run: python -m scripts.ttg_release_readiness --state IL --report ttg-illinois-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: ttg-illinois-readiness
          path: ttg-illinois-readiness.json
          if-no-files-found: error
