name: Audit Active Sitemap Pages
# rerun-after-request-repair-2026-09-18

on:
  push:
    paths:
      - 'sitemap.xml'
      - 'sitemap-regular-washer-dryer.xml'
      - 'data/approved-indexable-service-pages.txt'
      - '.github/workflows/audit-active-sitemap-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify active sitemap pickup pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html, sys, xml.etree.ElementTree as ET

          BASE='https://freereliableappliancepickup.com/'
          INFORMATIONAL={'landlord-property-manager-appliance-pickup'}
          SERVICE_PAGES=set(x.strip() for x in Path('data/approved-indexable-service-pages.txt').read_text(encoding='utf-8').splitlines() if x.strip() and not x.lstrip().startswith('#'))

          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[]
          for sitemap_name in ('sitemap.xml','sitemap-regular-washer-dryer.xml'):
              sitemap_path=Path(sitemap_name)
              if not sitemap_path.exists():
                  continue
              root=ET.parse(sitemap_path).getroot()
              urls.extend(x.text.strip() for x in root.findall('.//s:loc',ns) if x.text)
          active=[]
          for u in urls:
              if not u.startswith(BASE):
                  continue
              rest=u[len(BASE):].strip('/')
              if rest:
                  active.append(rest)

          def words(raw):
              raw=re.sub(r'<script\b[^>]*>.*?</script>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<style\b[^>]*>.*?</style>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<[^>]+>',' ',raw)
              raw=html.unescape(raw)
              return len(re.findall(r"[A-Za-z0-9']+",raw))

          rows=[]
          failures=[]
          for slug in sorted(set(active)):
              p=Path(slug)/'index.html'
              if not p.exists():
                  failures.append(f'MISSING FILE: {slug}/index.html')
                  continue

              # Every URL submitted in sitemap.xml must be indexable. This
              # catches retired/noindex aliases (including city x appliance
              # aliases) even when they are outside the general location-page
              # and approved specialty-page lists below.
              raw=p.read_text(encoding='utf-8',errors='ignore')
              low=raw.lower()
              sitemap_noindex=bool(re.search(r"<meta\\b[^>]*\\bname=['\"]robots['\"][^>]*\\bcontent=['\"][^'\"]*noindex",raw,re.I))
              if sitemap_noindex:
                  failures.append(f'SITEMAP PAGE IS NOINDEX: {slug}')

              if not slug.endswith('-appliance-pickup') or slug in INFORMATIONAL or slug in SERVICE_PAGES:
                  continue
              has_form='formspree.io/f/mvzeapzd' in low
              has_request_target='id="request"' in low or "id='request'" in low
              has_request_link=bool(re.search(r'href=["\'][^"\']*#request["\']',raw,re.I))
              branded='site-brand.css' in low
              noindex='noindex' in low
              wc=words(raw)
              rows.append((slug,wc,has_form,has_request_target,has_request_link,branded,noindex))

              if noindex:
                  failures.append(f'ACTIVE PAGE IS NOINDEX: {slug}')
              if not has_request_link:
                  failures.append(f'NO REQUEST CTA/LINK: {slug}')
              if has_request_target and not has_form:
                  failures.append(f'LOCAL #request TARGET HAS NO FORMSPREE FORM: {slug}')
              if has_form and 'customer-routing.js' not in low:
                  failures.append(f'LOCAL FORM MISSING CUSTOMER ROUTING: {slug}')
              if not branded:
                  failures.append(f'ACTIVE MARKET PAGE MISSING SHARED BRAND CSS: {slug}')

          print('ACTIVE_MARKET_PAGES',len(rows))
          print('ACTIVE_WITH_LOCAL_FORM',sum(r[2] for r in rows))
          print('ACTIVE_WITH_LOCAL_REQUEST_TARGET',sum(r[3] for r in rows))
          print('ACTIVE_WITH_REQUEST_LINK',sum(r[4] for r in rows))
          print('ACTIVE_BRANDED',sum(r[5] for r in rows))
          print('ACTIVE_NOINDEX',sum(r[6] for r in rows))
          print('ACTIVE_UNDER_350_WORDS',sum(r[1]<350 for r in rows))
          print('\nACTIVE_ROWS')
          for r in sorted(rows,key=lambda x:x[1]):
              print(f"{r[1]:4d} | form={r[2]} local={r[3]} cta={r[4]} branded={r[5]} noindex={r[6]} | {r[0]}")

          # Approved specialty/service pages are intentionally excluded from the
          # location-page UX checks above, but if they are in the sitemap they must
          # still be genuinely indexable and self-canonical. This prevents an
          # approved city x appliance page from silently shipping with noindex.
          approved_active=[]
          for slug in sorted(SERVICE_PAGES.intersection(active)):
              p=Path(slug)/'index.html'
              if not p.exists():
                  failures.append(f'APPROVED SERVICE PAGE MISSING FILE: {slug}/index.html')
                  continue
              raw=p.read_text(encoding='utf-8',errors='ignore')
              low=raw.lower()
              expected=BASE+slug+'/'
              noindex=bool(re.search(r"<meta\b[^>]*\bname=['\"]robots['\"][^>]*\bcontent=['\"][^'\"]*noindex",raw,re.I))
              cm=re.search(r"<link\b[^>]*\brel=['\"]canonical['\"][^>]*\bhref=['\"]([^'\"]+)['\"]",raw,re.I)
              canonical=cm.group(1).strip() if cm else ''
              approved_active.append((slug,noindex,canonical))
              if noindex:
                  failures.append(f'APPROVED SERVICE PAGE IS NOINDEX: {slug}')
              if canonical != expected:
                  failures.append(f'APPROVED SERVICE PAGE CANONICAL MISMATCH: {slug} -> {canonical or "MISSING"}')

          print('APPROVED_ACTIVE_SERVICE_PAGES',len(approved_active))
          print('APPROVED_ACTIVE_NOINDEX',sum(1 for _,n,_ in approved_active if n))
          print('APPROVED_ACTIVE_CANONICAL_MISMATCH',sum(1 for s,n,ca in approved_active if ca != BASE+s+'/'))

          if failures:
              print('\nFAILURES')
              for f in failures:
                  print('-',f)
              sys.exit(1)

          print('\nPASS: every active appliance-pickup page has a request path, shared branding, and indexable status.')
          PY
