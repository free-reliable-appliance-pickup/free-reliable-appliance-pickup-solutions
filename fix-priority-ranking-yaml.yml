name: Fix Priority Ranking YAML

on:
  push:
    paths:
      - '.github/workflows/fix-priority-ranking-yaml.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Repair YAML indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/priority-ranking-upgrade.yml")
          lines = path.read_text(encoding="utf-8").splitlines()

          out = []
          inside_run = False

          for line in lines:

              if line == "        run: |" and not inside_run:
                  inside_run = True
                  out.append(line)
                  continue

              if inside_run and line.startswith(
                  "      - name: Commit priority SEO upgrade"
              ):
                  inside_run = False
                  out.append(line)
                  continue

              if inside_run and line.strip():
                  indent = len(line) - len(line.lstrip(" "))

                  if indent < 10:
                      line = (" " * (10 - indent)) + line

              out.append(line)

          path.write_text(
              "\n".join(out) + "\n",
              encoding="utf-8"
          )

          print("Priority ranking workflow indentation repaired.")
          PY

      - name: Commit repaired workflow
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/priority-ranking-upgrade.yml

          git commit \
            -m "Fix priority ranking workflow YAML indentation"

          git push
