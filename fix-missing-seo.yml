name: Fix Missing SEO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Fix SEO
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = "https://free-reliable-appliance-pickup.github.io/free-reliable-appliance-pickup-solutions/"

          pages = []

          for d in Path(".").glob("*-appliance-pickup"):
              f = d / "index.html"

              if not f.exists():
                  continue

              pages.append(d)

              h = f.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              old = h

              name = d.name.replace(
                  "-appliance-pickup",
                  ""
              ).replace("-", " ").title()

              url = base + d.name + "/"

              if "<title" not in h.lower():
                  h = h.replace(
                      "</head>",
                      f"<title>Free Appliance Pickup {name}</title>\n</head>"
                  )

              if 'name="description"' not in h.lower():
                  h = h.replace(
                      "</head>",
                      f'<meta name="description" content="Qualifying free appliance pickup in {name} for washers, dryers, refrigerators and other major appliances.">\n</head>'
                  )

              if 'rel="canonical"' not in h.lower():
                  h = h.replace(
                      "</head>",
                      f'<link rel="canonical" href="{url}">\n</head>'
                  )

              if 'name="robots"' not in h.lower():
                  h = h.replace(
                      "</head>",
                      '<meta name="robots" content="index, follow">\n</head>'
                  )

              if "<h1" not in h.lower():
                  heading = (
                      f"<h1>Free Appliance Pickup in {name}</h1>"
                  )

                  if "<main" in h.lower():
                      h = re.sub(
                          r"(<main[^>]*>)",
                          r"\1" + heading,
                          h,
                          count=1,
                          flags=re.I
                      )
                  else:
                      h = re.sub(
                          r"(<body[^>]*>)",
                          r"\1" + heading,
                          h,
                          count=1,
                          flags=re.I
                      )

              if h != old:
                  f.write_text(
                      h,
                      encoding="utf-8"
                  )

                  print("Fixed", d.name)

          urls = [base] + [
              base + d.name + "/"
              for d in sorted(pages)
          ]

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]

          for url in urls:
              lines.append(
                  f"<url><loc>{url}</loc></url>"
              )

          lines.append("</urlset>")

          Path("sitemap.xml").write_text(
              "\n".join(lines),
              encoding="utf-8"
          )

          print("Total pages:", len(pages))
          print("Sitemap URLs:", len(urls))
          PY

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Fix sitewide SEO"
          git push
